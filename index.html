<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b0d">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wraith">
<title>Wraith</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://gql.twitch.tv">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://static-cdn.jtvnw.net">
<script id="hlsjs" src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.light.min.js" integrity="sha384-y8wQxRLtNclrHbMBLBLTEkgUrdFu6uWzZiobE1wBE09nt2wHIZlBPvPepdZU4+MM" crossorigin="anonymous" async onload="this.dataset.ok=1" onerror="this.dataset.err=1"></script>
<style>
:root {
  --bg: #0b0b0d; --bg-1: #121215; --bg-2: #19191d; --bg-3: #232329;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.14);
  --fg: #f4f4f6; --fg-2: #a8a8b2; --fg-3: #6e6e79;
  --live: #ff3b4f; --good: #3ddc97; --warn: #fbbf24;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, sans-serif;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
  --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { font: 15px/1.4 var(--sans); min-height: 100dvh; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; touch-action: manipulation; }
a { color: inherit; text-decoration: none; -webkit-touch-callout: none; }
img { display: block; max-width: 100%; }
svg { width: 22px; height: 22px; flex: none; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 2px; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes sk { to { background-position: -200% 0; } }
@keyframes up { from { transform: translateY(28px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* ── home ─────────────────────────────────────────── */
#home { max-width: 1200px; margin: 0 auto; padding: calc(var(--sat) + 8px) max(16px, var(--sar)) calc(var(--sab) + 32px) max(16px, var(--sal)); }
.top { display: flex; align-items: center; height: 50px; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.brand svg { width: 25px; height: 25px; }
.sp { flex: 1; }
.ib { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--fg-2); }
.ib:active { background: var(--bg-2); }
.ib.busy svg { animation: rot .8s linear infinite; }
.search { display: flex; align-items: center; gap: 10px; height: 48px; margin: 6px 0 28px; padding: 0 5px 0 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; }
.search:focus-within { border-color: var(--line-2); }
.search svg { width: 18px; height: 18px; color: var(--fg-3); }
.search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; font-size: 16px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--fg-3); }
.search input::-webkit-search-cancel-button { display: none; }
.search button { height: 38px; padding: 0 16px; border-radius: 10px; background: var(--fg); color: #000; font-size: 14px; font-weight: 600; }
.search button:active { opacity: .8; }
.sec + .sec { margin-top: 32px; }
.h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); }
.h b { color: var(--fg-2); font-weight: 600; }
.rows { display: grid; gap: 16px; }
.row { display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 1fr); gap: 12px; align-items: start; }
.row:active .thumb img { opacity: .7; }
.thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--bg-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; transition: opacity .15s; }
.tag { position: absolute; left: 6px; top: 6px; padding: 0 5px; border-radius: 4px; background: var(--live); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; line-height: 17px; }
.vc { position: absolute; left: 6px; bottom: 6px; padding: 0 6px; border-radius: 4px; background: rgba(0,0,0,.72); color: #fff; font-size: 11.5px; font-weight: 600; line-height: 18px; font-variant-numeric: tabular-nums; }
.vc.r { left: auto; right: 6px; }
.meta { min-width: 0; }
.who { display: flex; align-items: center; gap: 7px; min-width: 0; }
.av { width: 22px; height: 22px; border-radius: 50%; background: var(--bg-2); object-fit: cover; flex: none; }
.nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt { margin-top: 3px; color: var(--fg-2); font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.gm { margin-top: 4px; color: var(--fg-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 760px) {
  .rows { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 26px 18px; }
  .row { grid-template-columns: 1fr; gap: 10px; }
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; height: 38px; padding-left: 5px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); font-size: 14px; max-width: 100%; }
.chip a { display: flex; align-items: center; gap: 8px; height: 100%; min-width: 0; }
.chip a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip img { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-3); }
.chip .x { width: 34px; height: 36px; display: grid; place-items: center; color: var(--fg-3); }
.chip .x svg { width: 15px; height: 15px; }
.offl { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 18px 6px; }
.offl a { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
.offl img { width: 52px; height: 52px; border-radius: 50%; background: var(--bg-2); filter: grayscale(.4); opacity: .85; }
.offl span { max-width: 100%; font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note { color: var(--fg-3); font-size: 14px; line-height: 1.5; }
.note button { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.sk { background: linear-gradient(90deg, var(--bg-2) 0, #202026 50%, var(--bg-2) 100%); background-size: 200% 100%; animation: sk 1.3s ease infinite; border-radius: 6px; }
.sk-line { height: 12px; margin-top: 8px; }
.foot { margin-top: 44px; color: var(--fg-3); font-size: 12.5px; line-height: 1.6; max-width: 520px; }

/* ── watch ────────────────────────────────────────── */
#watch { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: var(--sat); background: #000; }
.main { display: flex; flex-direction: column; flex: none; min-width: 0; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; }
.stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.stage video.off { visibility: hidden; }
.hud { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; opacity: 0; transition: opacity .18s; pointer-events: none;
  background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 58%, rgba(0,0,0,.66)); }
.stage.ui .hud { opacity: 1; }
.stage.ui .hud .bar { pointer-events: auto; }
.stage.vod .hud { display: none; }
.bar { display: flex; align-items: center; gap: 2px; padding: 4px max(6px, var(--sar)) 4px max(6px, var(--sal)); }
.cb { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: #fff; }
.cb:active { background: rgba(255,255,255,.14); }
.lat { display: flex; align-items: center; gap: 7px; height: 30px; margin: 0 4px; padding: 0 11px; border-radius: 999px; background: rgba(24,24,28,.6); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lat i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.lat.cdn i { background: var(--warn); }
.lat.ad i { background: var(--live); }
.mid { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.big { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: rgba(24,24,28,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; pointer-events: auto; }
.big svg { width: 30px; height: 30px; margin-left: 3px; }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; animation: rot .8s linear infinite; }
.banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); padding: 7px 13px; border-radius: 999px; background: rgba(24,24,28,.75); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; font-size: 12.5px; font-weight: 600; white-space: nowrap; pointer-events: none; transition: opacity .2s; }
.banner i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }
.banner span { overflow: hidden; text-overflow: ellipsis; }
.stage.ui .banner { opacity: 0; }
.unmute { position: absolute; right: max(12px, var(--sar)); bottom: 60px; display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 11px; border-radius: 999px; background: #fff; color: #000; font-size: 13.5px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.unmute svg { width: 18px; height: 18px; }
.toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 8px 14px; border-radius: 10px; background: rgba(24,24,28,.88); color: #fff; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; animation: fade .2s; }
.msgbox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px; text-align: center; background: #000; color: var(--fg-2); font-size: 14px; line-height: 1.45; }
.msgbox img { width: 60px; height: 60px; border-radius: 50%; background: var(--bg-2); }
.msgbox b { color: var(--fg); font-size: 16px; font-weight: 600; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line-2); font-size: 14px; font-weight: 600; color: var(--fg); }
.btn.pri { background: var(--fg); color: #000; border-color: transparent; }
.btn:active { opacity: .8; }
.info { display: flex; align-items: center; gap: 12px; padding: 11px max(14px, var(--sar)) 11px max(8px, var(--sal)); background: var(--bg); border-bottom: 1px solid var(--line); }
.info .cb { color: var(--fg-2); width: 36px; margin-right: -4px; }
.info .av { width: 40px; height: 40px; }
.info .meta { flex: 1; }
.info .nm { font-size: 16px; }
.info .tt { -webkit-line-clamp: 1; margin-top: 1px; }
.info .gm { margin-top: 2px; }
.side { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.tabs { display: flex; align-items: center; gap: 6px; padding: 8px max(12px, var(--sar)) 8px max(12px, var(--sal)); border-bottom: 1px solid var(--line); }
.tabs button { height: 32px; padding: 0 14px; border-radius: 999px; color: var(--fg-2); font-size: 13.5px; font-weight: 600; }
.tabs button.on { background: var(--bg-2); color: var(--fg); }
.tw { display: flex; align-items: center; gap: 5px; height: 32px; padding: 0 6px; color: var(--fg-3); font-size: 13px; }
.tw svg { width: 15px; height: 15px; }
.pane { position: relative; flex: 1; min-height: 0; }
.chat { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 0 calc(10px + var(--sab)); font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.m { padding: 2px max(14px, var(--sar)) 2px max(14px, var(--sal)); }
.m .n { font-weight: 700; }
.m .bd { display: inline-block; width: 18px; height: 18px; margin-right: 4px; vertical-align: -4px; }
.m .em { display: inline-block; height: 28px; width: auto; max-width: none; margin: -5px 0; vertical-align: middle; }
.m a { color: #9ec5ff; text-decoration: underline; text-underline-offset: 2px; }
.m.me .tx { font-style: italic; }
.m.sys { margin: 5px 0; padding-top: 6px; padding-bottom: 6px; color: var(--fg-2); background: rgba(255,255,255,.035); box-shadow: inset 2px 0 var(--fg-3); }
.m.sys .tx { display: block; color: var(--fg); margin-top: 2px; }
.m.note { color: var(--fg-3); font-size: 13px; }
.m.gone { opacity: .3; }
.more { position: absolute; left: 50%; bottom: calc(14px + var(--sab)); transform: translateX(-50%); height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fg); color: #000; font-size: 13px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.vods { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px max(14px, var(--sar)) calc(16px + var(--sab)) max(14px, var(--sal)); }
.vod { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 12px; padding: 6px 0; }
.vod:active { opacity: .7; }
.vod .thumb { border-radius: 8px; }
.vod .tt { margin-top: 0; color: var(--fg); font-size: 14px; }
.st { display: inline-block; margin-right: 6px; padding: 0 5px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: .04em; line-height: 16px; vertical-align: 1px; background: var(--bg-3); color: var(--fg-2); }
.st.lv { background: var(--live); color: #fff; }

/* any screen wider than tall with room for both (a phone on its side, an unfolded screen, a
   desktop window): video on the left, chat docked on the right */
@media (orientation: landscape) and (min-width: 640px) {
  #watch { flex-direction: row; }
  .main { flex: 1; min-height: 0; justify-content: center; }   /* picture and channel row as one block */
  .stage { flex: none; max-height: calc(100% - 64px); }
  .side { flex: none; width: clamp(300px, 32vw, 380px); border-left: 1px solid var(--line); }
  #watch.nochat .side { display: none; }
}
/* short screens give the channel row's height to the picture */
@media (orientation: landscape) and (max-height: 560px) { .info { display: none; } .stage { max-height: 100%; } }
@media not ((orientation: landscape) and (min-width: 640px)) { #bChat { display: none; } }

/* ── settings sheet ───────────────────────────────── */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: fade .2s; }
.panel { position: relative; width: 100%; max-width: 520px; max-height: 86dvh; overflow-y: auto; padding: 8px 16px calc(18px + var(--sab)); background: var(--bg-1); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; animation: up .25s cubic-bezier(.2,.8,.2,1); }
@media (min-width: 600px) and (min-height: 561px) { .sheet { align-items: center; } .panel { border-radius: 20px; border-bottom: 1px solid var(--line); } }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 2px auto 8px; }
.panel h3 { margin: 16px 4px 8px; font-size: 12.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); }
.opts { background: var(--bg-2); border-radius: 13px; overflow: hidden; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 10px 14px; text-align: left; }
.opt + .opt { border-top: 1px solid var(--line); }
.opt:active { background: var(--bg-3); }
.opt .l { flex: 1; min-width: 0; font-size: 15px; }
.opt .d { display: block; margin-top: 2px; color: var(--fg-3); font-size: 12.5px; line-height: 1.35; }
.opt .ck { width: 20px; height: 20px; visibility: hidden; }
.opt.on .ck { visibility: visible; }
.opt:disabled { opacity: .4; cursor: default; }
.stats { margin: 14px 4px 0; color: var(--fg-3); font-size: 12px; line-height: 1.75; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main id="home">
  <header class="top">
    <a class="brand" href="./" id="brand"><span id="logo"></span><span>wraith</span></a>
    <span class="sp"></span>
    <button class="ib" id="refresh" type="button" aria-label="Refresh" data-i="refresh"></button>
  </header>
  <form class="search" id="search" autocomplete="off">
    <span data-i="search"></span>
    <input id="q" type="search" enterkeyhint="go" placeholder="Watch any channel" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Channel name or Twitch link">
    <button type="submit">Watch</button>
  </form>
  <section class="sec"><div class="h">Live <b id="liveN"></b></div><div class="rows" id="live"></div></section>
  <section class="sec" id="secRecent" hidden><div class="h">Recent</div><div class="chips" id="recent"></div></section>
  <section class="sec" id="secOff" hidden><div class="h">Offline</div><div class="offl" id="off"></div></section>
  <p class="foot">Live streams play at low latency with Twitch’s ads cut out. Sub-only streams and past broadcasts play from Twitch’s CDN.</p>
</main>

<main id="watch" hidden>
  <div class="main">
    <div class="stage" id="stage">
      <video id="vLL" playsinline webkit-playsinline disableremoteplayback></video>
      <video id="vCDN" class="off" playsinline webkit-playsinline></video>
      <audio id="aBG" preload="none"></audio>
      <div class="hud">
        <div class="bar">
          <button class="cb" id="bBack" type="button" aria-label="Back" data-i="back"></button>
          <span class="sp"></span>
          <button class="cb" id="bChat" type="button" aria-label="Show or hide chat" data-i="chat"></button>
        </div>
        <div class="bar">
          <button class="cb" id="bPlay" type="button" aria-label="Play or pause" data-i="pause"></button>
          <button class="cb" id="bMute" type="button" aria-label="Mute or unmute" data-i="vol"></button>
          <button class="lat" id="bLat" type="button" aria-label="Playback settings"><i></i><span id="latTxt">Live</span></button>
          <span class="sp"></span>
          <button class="cb" id="bSet" type="button" aria-label="Quality" data-i="sliders"></button>
          <button class="cb" id="bFull" type="button" aria-label="Fullscreen" data-i="full"></button>
        </div>
      </div>
      <div class="mid"><div class="spin" id="spin" hidden></div><button class="big" id="bigPlay" type="button" aria-label="Play" data-i="play" hidden></button></div>
      <div class="banner" id="banner" hidden><i></i><span id="bannerTxt"></span></div>
      <button class="unmute" id="unmute" type="button" data-i="mute" hidden><span>Tap to unmute</span></button>
      <div class="toast" id="toast" hidden></div>
      <div class="msgbox" id="msgbox" hidden></div>
    </div>
    <div class="info">
      <button class="cb" id="bBack2" type="button" aria-label="Back" data-i="back"></button>
      <img class="av" id="iAv" alt="">
      <div class="meta"><div class="nm" id="iName"></div><div class="tt" id="iTitle"></div><div class="gm" id="iSub"></div></div>
    </div>
  </div>
  <aside class="side">
    <nav class="tabs">
      <button type="button" class="on" data-pane="chat">Chat</button>
      <button type="button" data-pane="vods">Videos</button>
      <span class="sp"></span>
      <a class="tw" id="twLink" target="_blank" rel="noopener">Twitch <span data-i="ext"></span></a>
    </nav>
    <div class="pane" id="paneChat"><div class="chat" id="chat"></div><button class="more" id="more" type="button" hidden>New messages</button></div>
    <div class="pane" id="paneVods" hidden><div class="vods" id="vods"></div></div>
  </aside>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Playback settings"><div class="grab"></div><div id="sheetBody"></div></div>
</div>

<script>
(() => {
'use strict';

const CID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';
// "Wraith relay" Apps Script. Twitch's playlist servers turn away browsers on other
// sites, so playlists come through it; the video itself loads straight from Twitch's CDN.
const RELAY = 'https://script.google.com/macros/s/AKfycbyXQaL8s2_Vo-DTpCZhQCaPvHPF6hSbW4W3-RcmzgicJVtYTP9rCJfzdP5gViglpEIJZA/exec';

async function gql(query, variables) {
  const r = await fetch('https://gql.twitch.tv/gql', {
    method: 'POST',
    headers: { 'Client-ID': CID, 'Content-Type': 'application/json', 'X-Device-Id': DEVICE },
    body: JSON.stringify({ query, variables }),
  });
  if (!r.ok) throw new Error(`Twitch answered ${r.status}`);
  const j = await r.json();
  if (!j.data) throw new Error(j.errors?.[0]?.message || 'Twitch error');
  return j.data;
}

// One users(logins:) field takes up to 100 names. (Aliasing user() per name is capped at 15 per
// request, which is what broke the old page's live list.)
async function getUsers(logins) {
  const batches = [];
  for (let i = 0; i < logins.length; i += 100) batches.push(logins.slice(i, i + 100));
  const out = await Promise.all(batches.map(async b => {
    const d = await gql(`query($l: [String!]) { users(logins: $l) { ${USER} } }`, { l: b });
    const byLogin = new Map((d.users || []).filter(Boolean).map(u => [u.login, Object.assign(u, { at: Date.now() })]));
    return b.map(l => byLogin.get(l) || null);
  }));
  return out.flat();
}

async function getToken(login) {

// Where the live stream's recording sits on Twitch's CloudFront CDN. The recording VOD names the
// exact path; without one, rebuild it with the TwitchRecover formula sha1(login_streamid_epoch).
async function cdnBase(u) {
  const v = u.videos?.edges?.[0]?.node, path = cdnPath(v?.seekPreviewsURL);
  if (path && v.status === 'RECORDING') return path;
  const host = path ? new URL(path).host : 'd2nvs31859zcd8.cloudfront.net';
  const raw = `${u.login}_${u.stream.id}_${Math.floor(Date.parse(u.stream.createdAt) / 1000)}`;
  const sha = new Uint8Array(await crypto.subtle.digest('SHA-1', new TextEncoder().encode(raw)));
  return `https://${host}/${Array.from(sha, b => b.toString(16).padStart(2, '0')).join('').slice(0, 20)}_${raw}`;

// Finished VODs list segments as N-unmuted.ts, which the CDN refuses; the files are N.ts (which also
// keeps the original audio where Twitch muted a stretch). Safari gets a corrected copy, as a blob and
// failing that as a data URL, with Twitch's own playlist as the last resort.
async function vodSources(base, rend = 'chunked') {
  const direct = `${base}/${rend}/index-dvr.m3u8`, text = await relayText(direct);
  if (!cdnLive || !text || !text.includes('#EXTINF')) return [direct];
  const fixed = text.split('\n').map(l => {
    const s = l.trim();
    return !s || s.startsWith('#') ? s : `${base}/${rend}/${s.replace(/-(un)?muted(?=\.ts$)/, '')}`;
  }).join('\n');

  return [URL.createObjectURL(new Blob([fixed], { type })), `data:${type};base64,${btoa(fixed)}`, direct];

// Twitch titles real segments "live" and stitched ads anything else ("Amazon|…"). Ads become
// EXT-X-GAP so the player never fetches them; the two upcoming segments Twitch advertises with
// EXT-X-TWITCH-PREFETCH become real entries, which is what makes the feed low latency.
function rewrite(text, quiet) {   // quiet: the background-audio player, which doesn't steer ad breaks
  const out = [], prefetch = [];
  let segDur = 2, tailAd = false, adEnd = 0;
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXT-X-TWITCH-PREFETCH:')) { prefetch.push(line.slice(23)); continue; }
    // Twitch declares 6 s for 2 s segments, and hls.js paces its playlist reloads on that number
    if (line.startsWith('#EXT-X-TARGETDURATION:')) { out.push('#EXT-X-TARGETDURATION:2'); continue; }
    if (line.startsWith('#EXT-X-DATERANGE') && /stitched-ad|X-TV-TWITCH-AD/.test(line)) {
      const start = Date.parse(attr(line, 'START-DATE')), len = parseFloat(attr(line, 'DURATION'));
      if (start && len) adEnd = Math.max(adEnd, start + len * 1000);
    }
    if (line.startsWith('#EXTINF:')) {
      const title = line.slice(line.indexOf(',') + 1).trim();
      segDur = parseFloat(line.slice(8)) || segDur;
      tailAd = line.includes(',') && title !== '' && !title.startsWith('live');
      if (tailAd) out.push('#EXT-X-GAP');
    }
    out.push(line);
  }
  if (!tailAd) for (const u of prefetch) out.push(`#EXTINF:${segDur.toFixed(3)},live`, u);
  if (!quiet) P.onAd(tailAd, adEnd);
  return out.join('\n') + '\n';
}

      sent++;

        .then(r => r.text())

          else if (sent < 2) send();

    this.timers.push(setTimeout(() => finish(() => callbacks.onTimeout(st, context, null)), config.timeout || 10000));

// Inside a tap, start-and-stop every player: Safari then lets any of them start with sound later
// (an ad break or leaving the app switches players with no tap to hang it on).
function unlock() {

    const was = v.paused;
    const p = v.play(); if (p) p.catch(() => {});

  qualities() {
    const g = [...this.groups].filter(x => x.h).sort((a, b) => b.br - a.br);
    return g.map(x => ({ id: x.id, label: x.id === 'chunked' ? `${x.h}p${x.fps > 30 ? x.fps : ''} · source` : x.id }));
  },

  levelIndex() {   // the hls.js level for the picked quality
    const top = this.groups.reduce((a, b) => (b.br > a.br ? b : a));
    return (this.q === 'source' ? top : this.groups.find(x => x.id === this.q) || top).i;
  },

  applyQuality() {
    const hls = this.hls;
    if (!hls || !this.groups.length) return;
    if (this.q === 'auto') { hls.currentLevel = -1; return; }
    const i = this.levelIndex();
    if (hls.currentLevel !== i) hls.currentLevel = i;
  },

  setQuality(id) {
    this.q = id; store.set('quality', id);
    if (this.feed === 'live') this.applyQuality();
    else if (this.feed === 'cdn') this.playCdn({ cover: this.cover, reload: true });
  },

  setPref(f) {
    this.pref = f; store.set('feed', f);
    if (!this.user?.stream || this.feed === 'vod') return;
    if (f === 'cdn' && this.feed === 'live') { this.destroyHls(); this.playCdn(); }
    else if (f === 'live' && this.feed === 'cdn' && !this.subOnly) this.playLive();
  },

  onError(d) {
    const Hls = window.Hls;
    this.noteErr(d);
    if (!d.fatal) return;
    if (d.type === Hls.ErrorTypes.MEDIA_ERROR && this.fixes++ < 2) return this.hls.recoverMediaError();
    const text = String(d.response?.text || d.error?.message || '');
    if (/too many times|quota/i.test(text)) return this.fallback('The relay hit Google’s daily limit');
    if (d.response?.code === 403 && d.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR) { this.subOnly = true; return this.fallback('Sub-only stream'); }
    if (this.retries++ < 3) {
      UI.spin(true);
      const gen = this.gen;
      setTimeout(() => { if (gen === this.gen && this.feed === 'live') { this.destroyHls(); this.playLive(); } }, 1500 * this.retries);
      return;
    }
    this.checkEnded().then(ended => { if (!ended) this.fallback('The low-latency feed keeps failing'); });
  },

  // Live isn't possible (sub-only, relay down, old browser): the CDN feed still is.
  fallback(why) {
    this.destroyHls();
    if (cdnLive && this.base) { UI.toast(`${why} · playing from the CDN`); return this.playCdn(); }
    UI.needsSafari(why);
  },

  onAd(on, end) {
    if (on) {
      if (end) this.adEnd = end;
      if (this.ad) return;
      this.ad = true; this.skipped++;
      // Safari can show the ad-free CDN feed through the break; elsewhere the picture holds.
      if (this.feed === 'live' && cdnLive && this.base) { this.cover = true; this.playCdn({ cover: true }); }
      UI.banner();
    } else if (this.ad) {
      this.ad = false; this.adEnd = 0;
      if (this.cover) { this.cover = false; this.stopCdn(); this.show('live'); }
      if (this.feed === 'live') { this.toLiveEdge(); this.play(vL); }
      UI.banner();
    }
  },

  playCdn({ cover = false, reload = false } = {}) {
    if (!this.base || !cdnLive) return cover ? null : UI.needsSafari(this.base ? 'The ad-free CDN feed needs Safari' : 'There’s no CDN copy of this stream');
    const g = this.q === 'source' || this.q === 'auto' || !this.groups.some(x => x.id === this.q) ? 'chunked' : this.q;
    const url = `${this.base}/${g}/index-dvr.m3u8`;
    if (reload || vC.dataset.url !== url) { vC.dataset.url = url; vC.src = url; this.seekPending = true; }
    vC.muted = Sound.muted;
    this.show('cdn');
    UI.spin(true);
    this.play(vC);
  },

  nextVodSource() {
    const u = this.vodSrcs?.shift();
    if (!u) return false;
    if (vC.dataset.url?.startsWith('blob:')) URL.revokeObjectURL(vC.dataset.url);
    vC.dataset.url = u; vC.src = u;
    this.play(vC);
    return true;
  },

  stopCdn() {
    if (!vC.dataset.url) return;
    if (vC.dataset.url.startsWith('blob:')) URL.revokeObjectURL(vC.dataset.url);
    this.vodSrcs?.forEach(u => u.startsWith('blob:') && URL.revokeObjectURL(u));
    this.vodSrcs = null;
    vC.pause(); vC.removeAttribute('src'); delete vC.dataset.url; vC.load();
  },

  cdnSeek() {
    const s = vC.seekable;
    if (!s.length) return;
    const end = s.end(s.length - 1), want = Date.now() / 1000 - this.start - TARGET.cdn;
    if (Number.isFinite(end)) vC.currentTime = Math.max(s.start(0), Math.min(want, end - 3));
    this.seekPending = false;
  },

  toLiveEdge() {
    const p = this.hls?.liveSyncPosition;
    if (Number.isFinite(p) && p > vL.currentTime + 1) vL.currentTime = p;
  },

  show(which) {
    this.feed = which;
    vL.classList.toggle('off', which !== 'live');
    vC.classList.toggle('off', which === 'live');
    (which === 'live' ? vC : vL).pause();
    this.rate = 'normal';
    UI.feed();
  },

  play(v) {
    v.muted = Sound.muted;
    const p = v.play();
    if (p) p.catch(err => {
      if (err.name !== 'NotAllowedError' || v.classList.contains('off')) return;
      v.muted = true; UI.unmute(true);          // browsers still allow muted autoplay
      v.play().catch(() => UI.big(true));
    });
  },

  active() { return this.feed === 'live' ? vL : this.feed ? vC : null; },

  latency() {
    if (this.feed === 'live') { const d = this.hls?.playingDate; return d ? (Date.now() - d.getTime()) / 1000 : null; }
    if (this.feed === 'cdn' && vC.readyState > 0) return Date.now() / 1000 - this.start - vC.currentTime;
    return null;
  },

  // Chat shows up as late as the picture: Twitch viewers sit ~2.5 s behind, so delay by the rest.
  chatDelay() {
    const l = this.feed === 'vod' ? null : this.latency();
    return l == null ? 0 : Math.max(0, l - 2.5) * 1000;
  },

  // Speed up a little when behind, slow down when the buffer runs thin. Discrete steps with
  // hysteresis: a continuously varying rate makes the audio pitch wander.
  tick() {
    UI.lat();
    const v = this.active();
    if (!v || this.feed === 'vod' || v.paused) return;
    // a picked quality stays picked, whatever hls.js decides after an error
    if (this.feed === 'live' && this.q !== 'auto' && this.hls?.autoLevelEnabled && this.groups.length) this.hls.loadLevel = this.levelIndex();
    if (v.readyState < 3) {   // stalled: hop the hole a cut-out ad leaves if picture is buffered past it
      const b = v.buffered;
      for (let i = 0; i < b.length; i++) if (b.start(i) > v.currentTime + 0.1) { v.currentTime = b.start(i) + 0.05; break; }
      return;
    }
    const lat = this.latency(), live = this.feed === 'live', T = live ? this.liveT : TARGET.cdn;
    if (lat == null) return;
    if (lat > T + 10) {
      if (live) this.toLiveEdge(); else this.cdnSeek();
      return;
    }
    if (live && this.liveT > TARGET.live && Date.now() - this.calm > 90e3) {   // smooth for 90 s: edge back in
      this.liveT = Math.max(TARGET.live, this.liveT - 0.25); this.calm = Date.now();
    }
    const ahead = bufAhead(v);
    let s = this.rate;
    // slow down when the buffer runs thin, or when live starts closer than the target (no cushion)
    if ((ahead < 0.5 && lat < T + 4) || (live && lat < T - 0.5)) s = 'slow';
    else if (s === 'slow') { if ((ahead > 1.2 || lat > T + 0.8) && !(live && lat < T - 0.1)) s = 'normal'; }
    else if (lat > T + (live ? 0.6 : 1.2)) s = 'fast';
    else if (s === 'fast' && lat < T + (live ? 0.15 : 0.3)) s = 'normal';
    this.rate = s;
    const r = s === 'fast' ? 1.1 : s === 'slow' ? 0.93 : 1;
    if (v.playbackRate !== r) v.playbackRate = r;
  },

  noteErr(d, where = '') {   // routine stall notices and the page's own aborts left out
    if (/^(buffer(StalledError|NudgeOnStall|SeekOverHole)|aborted)$/.test(d.details)) return;
    const k = where + d.details + (d.fatal ? ' (fatal)' : '');
    this.errs[k] = (this.errs[k] || 0) + 1;
  },

  noteStall() {
    if (this.feed !== 'live' || this.ad || !this.hls || Date.now() < this.quietUntil) return;
    const now = Date.now();
    this.liveT = Math.min(TARGET.liveMax, this.liveT + 0.5); this.calm = now;   // more cushion next time
    if (this.q === 'auto') return;
    this.stalls = this.stalls.filter(t => now - t < 60e3).concat(now);
    if (this.stalls.length < 3) return;
    const list = this.qualities(), i = list.findIndex(x => x.id === (this.q === 'source' ? list[0]?.id : this.q));
    if (i < 0 || i >= list.length - 1) return;
    this.stalls = [];
    this.setQuality(list[i + 1].id);
    UI.toast(`Dropped to ${list[i + 1].label} to stop the buffering`);
  },

  async refresh() {
    const gen = this.gen;
    try {
      const [u] = await getUsers([this.login]);
      if (gen !== this.gen || !u) return;
      if (u.stream && this.user?.stream && u.stream.id !== this.user.stream.id) return this.open(this.login);
      this.user = u; UI.info(u);
      if (!u.stream) this.ended(u);
    } catch {}
  },

  async checkEnded() {
    try { const [u] = await getUsers([this.login]); if (u && !u.stream) { this.ended(u); return true; } } catch {}
    return false;
  },

  ended(u) {
    BG.stop(true);
    this.destroyHls(); this.stopCdn(); vL.removeAttribute('src');
    UI.offline(u, true);
  },

  destroyHls() {
    if (this.hls) { this.hls.destroy(); this.hls = null; }
  },

  close() {
    this.gen++;
    clearInterval(this.timer);
    BG.stop(true);
    this.destroyHls(); this.stopCdn();
    this.vodAudio?.forEach(u => u.startsWith('blob:') && URL.revokeObjectURL(u));
    vC.controls = false; vL.pause(); vL.removeAttribute('src'); vL.load();
    Object.assign(this, { login: null, user: null, feed: null, groups: [], base: null, subOnly: false, ad: false, adEnd: 0,
      cover: false, rate: 'normal', stalls: [], retries: 0, fixes: 0, vod: null, tokenP: null, seekPending: false,
      liveT: TARGET.live, calm: Date.now(), userPaused: false, audioUrl: null, vodAudio: null, quietUntil: 0, errs: {} });
    primed = null;
    stage.classList.remove('vod');
    Chat.close(); UI.clear();
  },
};

// iPhone pauses a page's video the moment the app goes to the background but lets audio-only
// playback carry on. So while the page is hidden the sound moves to an audio element: Twitch's
// audio_only feed through the relay for live (fetched directly, it would get ads), or the CDN copy's
// audio_only playlist for sub-only streams and past broadcasts.
// iOS gives Control Center to the page's biggest player even while it sits paused, and never to a
// muted one, so the pictures are muted while away and the buttons there drive the sound.
const BG = {
  ios, on: false, hls: null, srcs: null,
  held: false,   // paused from the lock screen or Control Center: stays paused on return
  start() {
    const v = P.active();
    if (!this.ios || this.on || !v || Sound.muted || P.userPaused) return;
    if (P.feed === 'live' ? !(P.audioUrl && P.hls && window.Hls) : P.feed === 'cdn' ? !P.base : !P.vodAudio?.length) return;
    this.on = true; this.held = false;
    aBG.muted = false;
    if (P.feed === 'live') {
      // the picture's player lets go of its stream while away: the relay isn't polled twice, iOS gets
      // the memory back, and on return it starts clean at the live edge
      P.hls.stopLoad();
      P.hls.detachMedia();
      // it takes ~2.5 s to start, so it starts ~2.5 s further back: the sound resumes where the
      // picture stopped, with more cushion for the slower timers of a backgrounded page
      const h = this.hls = new window.Hls({ pLoader: QuietRelayLoader, progressive: true, liveSyncDuration: 6.5,
        liveMaxLatencyDuration: 25, maxLiveSyncPlaybackRate: 1, liveDurationInfinity: true, maxBufferLength: 12 });
      h.on(window.Hls.Events.ERROR, (_, d) => {   // nobody's looking at the page: keep retrying quietly
        P.noteErr(d, 'background ');
        if (!d.fatal || this.hls !== h) return;
        if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR) h.recoverMediaError();
        else setTimeout(() => { if (this.hls === h) h.startLoad(-1); }, 2000);
      });
      h.loadSource(P.audioUrl);
      h.attachMedia(aBG);
    } else {
      const at = vC.currentTime;   // the audio copy runs on the same clock: pick up where the picture is
      this.srcs = P.feed === 'cdn' ? [`${P.base}/audio_only/index-dvr.m3u8`] : [...P.vodAudio];
      aBG.addEventListener('loadedmetadata', () => { aBG.currentTime = at; }, { once: true });
      this.next();
    }
    const p = aBG.play(); if (p) p.catch(() => {});
    v.pause();
    vL.muted = vC.muted = true;
  },
  next() {
    const u = this.srcs?.shift();
    if (!u) return false;
    aBG.src = u;
    const p = aBG.play(); if (p) p.catch(() => {});
    return true;
  },
  stop(silent) {
    if (!this.on) return;
    this.on = false;
    const at = aBG.currentTime;
    if (this.hls) { this.hls.destroy(); this.hls = null; }
    aBG.pause(); aBG.removeAttribute('src'); aBG.load(); this.srcs = null;
    vL.muted = vC.muted = Sound.muted;
    if (silent) return;
    if (P.feed === 'live' && P.hls) {
      P.quietUntil = Date.now() + 6000;   // the restart's own buffering isn't a bad connection
      if (!P.hls.media) P.hls.attachMedia(vL);
      P.hls.once(window.Hls.Events.LEVEL_UPDATED, () => P.toLiveEdge());   // to the edge once the playlist is fresh
      P.hls.startLoad(-1);
      if (!this.held) UI.spin(true);
    }
    else if (P.feed === 'vod' && at) vC.currentTime = at;
    else if (P.feed === 'cdn') P.cdnSeek();
    if (this.held) P.userPaused = true;
    else { P.play(P.active()); if (!Sound.muted) UI.unmute(false); }
    UI.playIcon();
  },
};
aBG.addEventListener('error', () => { if (BG.on && BG.srcs) BG.next(); });
document.addEventListener('visibilitychange', () => {
  if ($('watch').hidden) return;
  if (document.hidden) BG.start(); else BG.stop();
});
if ('mediaSession' in navigator) {   // lock screen / Control Center buttons
  const ms = navigator.mediaSession;
  ms.setActionHandler('play', () => {
    if (BG.on) {
      BG.held = false;
      const h = BG.hls;
      if (h) {   // live: back at the edge as soon as the playlist has reloaded
        h.once(window.Hls.Events.LEVEL_UPDATED, () => {
          const p = h.liveSyncPosition;
          if (BG.hls === h && Number.isFinite(p) && p > aBG.currentTime + 3) aBG.currentTime = p;
        });
        h.startLoad(-1);
      }
      aBG.play().catch(() => {});
    } else if (P.active()?.paused) togglePlay();
  });
  ms.setActionHandler('pause', () => {
    if (BG.on) { BG.held = true; aBG.pause(); BG.hls?.stopLoad(); }   // stopped: no relay polling while paused
    else if (P.active() && !P.active().paused) togglePlay();
  });
}

const Sound = {
  muted: store.get('muted', false),
  set(m) {
    this.muted = m; store.set('muted', m);
    vL.muted = vC.muted = m;
    setIcon($('bMute'), m ? 'mute' : 'vol');
    if (!m) UI.unmute(false);
  },
};

for (const v of [vL, vC]) {
  v.addEventListener('timeupdate', () => P.tick());
  v.addEventListener('playing', () => {
    if (P.active() === v) { UI.spin(false); UI.big(false); }
    UI.playIcon();
    if (stage.classList.contains('ui')) hud(true);   // restart the auto-hide now that there's picture
  });
  v.addEventListener('pause', () => UI.playIcon());
  v.addEventListener('waiting', () => {
    if (P.active() !== v) return;
    UI.spin(true);
    if (v === vL && v.currentTime > 3) P.noteStall();
  });
}
vC.addEventListener('loadedmetadata', () => { if (P.seekPending && P.feed === 'cdn') P.cdnSeek(); });
vC.addEventListener('error', () => {
  if (!vC.dataset.url) return;
  if (P.feed === 'vod') {
    if (P.nextVodSource()) return;   // that copy didn't take: try the next
    return cdnLive ? UI.msg(null, 'The video wouldn’t play', 'Twitch’s CDN refused the playlist.') : UI.needsSafari(`https://www.twitch.tv/videos/${P.vod.id}`, true);
  }
  if (P.cover) { P.cover = false; P.show('live'); return; }
  if (P.feed === 'cdn') UI.msg(null, 'The CDN feed isn’t available', P.subOnly ? 'This channel’s stream isn’t being recorded, so there is no ad-free copy to play.' : 'Try the low-latency feed instead.', P.subOnly ? null : () => P.setPref('live'));
});
vC.addEventListener('timeupdate', () => {
  if (P.feed === 'vod' && P.vod && Math.floor(vC.currentTime) % 5 === 0) store.set('pos.' + P.vod.id, Math.floor(vC.currentTime));
});
setInterval(() => { if (P.feed) { P.tick(); UI.banner(); } }, 1000);

// ── chat ────────────────────────────────────────────
const COLORS = ['#FF4D4D', '#5B8CFF', '#3DDC97', '#FF8A3D', '#B3E35A', '#FF6B3D', '#3FBF7F', '#E8B23A', '#E07B39', '#5FB8BF', '#3DA0FF', '#FF7EB6', '#A877FF', '#3DFFA0', '#FFB13D'];
function nameColor(hex, name) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; hex = COLORS[h % COLORS.length]; }
  let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  if (lum < 0.5) { const k = (0.5 - lum) * 1.3; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }   // lift dark names off the black
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function parseIrc(line) {
  const m = { tags: {}, prefix: '', cmd: '', params: [], text: null };
  if (line[0] === '@') {
    const sp = line.indexOf(' ');
    for (const kv of line.slice(1, sp).split(';')) {
      const eq = kv.indexOf('=');
      m.tags[kv.slice(0, eq)] = kv.slice(eq + 1).replace(/\\(.)/g, (_, c) => ({ s: ' ', ':': ';', '\\': '\\', r: '\r', n: '\n' }[c] ?? c));
    }
    line = line.slice(sp + 1);
  }
  if (line[0] === ':') { const sp = line.indexOf(' '); m.prefix = line.slice(1, sp); line = line.slice(sp + 1); }
  const ti = line.indexOf(' :');
  if (ti >= 0) { m.text = line.slice(ti + 2); line = line.slice(0, ti); }
  [m.cmd, ...m.params] = line.split(' ');
  return m;
}

const Chat = {
  box: $('chat'), ws: null, login: null, uid: null, queue: [], stick: true, retry: 0, timer: 0,
  emotes: new Map(), global: null, badges: new Map(), gbadges: null,

  open(login) {
    this.close();
    this.login = login; this.stick = true; this.box.textContent = ''; $('more').hidden = true;
    this.note('Connecting to chat…');
    this.connect();
    this.timer = setInterval(() => this.flush(), 120);
    this.loadGlobal();
  },

  note(text) {
    const d = el('div', 'm note', text);
    this.box.appendChild(d);
    if (this.stick) this.box.scrollTop = this.box.scrollHeight;
  },

  connect() {
    const ws = this.ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + (10000 + Math.floor(Math.random() * 89999)));
      ws.send('JOIN #' + this.login);
    };
    ws.onmessage = e => { for (const l of e.data.split('\r\n')) if (l) this.line(l); };
    ws.onclose = () => {
      if (this.ws !== ws) return;
      this.ws = null;
      const login = this.login;
      setTimeout(() => { if (login && this.login === login && !this.ws) this.connect(); }, Math.min(15e3, 1000 * 2 ** this.retry++));
    };
  },

  line(raw) {
    const m = parseIrc(raw);
    switch (m.cmd) {
      case 'PING': this.ws?.send('PONG :' + (m.text || 'tmi.twitch.tv')); break;
      case 'RECONNECT': this.ws?.close(); break;
      case 'ROOMSTATE': if (this.retry || this.box.querySelector('.note')) { this.retry = 0; this.box.querySelectorAll('.m.note').forEach(n => n.remove()); } break;
      case 'PRIVMSG': case 'USERNOTICE': this.queue.push({ ts: +m.tags['tmi-sent-ts'] || Date.now(), m }); break;
      case 'CLEARCHAT': if (m.text) this.box.querySelectorAll(`[data-l="${CSS.escape(m.text)}"]`).forEach(n => n.classList.add('gone')); break;
      case 'CLEARMSG': if (m.tags['target-msg-id']) this.box.querySelector(`[data-id="${CSS.escape(m.tags['target-msg-id'])}"]`)?.classList.add('gone'); break;
    }
    if (this.queue.length > 800) this.queue.splice(0, this.queue.length - 800);
  },

  // Out of sight (app in the background, side chat hidden, Videos tab) nothing is drawn: lines
  // wait in the queue and only the newest screenful is drawn once chat is back in view.
  flush() {
    if (!this.queue.length || document.hidden || !this.box.offsetParent) return;
    const cut = Date.now() - P.chatDelay(), frag = document.createDocumentFragment();
    let n = 0;
    while (n < this.queue.length && this.queue[n].ts <= cut) n++;
    if (!n) return;
    for (const q of this.queue.splice(0, n).slice(-220)) frag.appendChild(this.render(q.m));
    this.box.appendChild(frag);
    if (this.stick) {
      const extra = this.box.children.length - 220;
      for (let i = 0; i < extra; i++) this.box.firstChild.remove();
      this.box.scrollTop = this.box.scrollHeight;
    } else $('more').hidden = false;
  },

  render(m) {
    const t = m.tags, login = m.prefix.split('!')[0];
    const d = el('div', 'm');
    if (t.id) d.dataset.id = t.id;
    if (login) d.dataset.l = login;
    if (m.cmd === 'USERNOTICE') {
      d.classList.add('sys');
      d.append(t['system-msg'] || '');
      if (m.text) { const tx = el('span', 'tx'); this.text(tx, m.text, t.emotes); d.append(tx); }
      return d;
    }
    for (const b of (t.badges || '').split(',')) {
      const src = b && (this.badges.get(b) || this.gbadges?.get(b));
      if (src) d.append(pic(src, 'bd'));
    }
    let text = m.text || '';

  // Twitch emotes arrive as code-point ranges in the tags; 7TV/BTTV/FFZ emotes are matched by word.
  text(node, text, emoteTag) {

      x.type = 'button'; x.setAttribute('aria-label', `Remove ${r.n || r.l}`); x.innerHTML = icon('x');
      x.onclick = () => Recent.remove(r.l);
      c.append(a, x); box.append(c);
    }
  },
};

document.querySelector('#home').addEventListener('click', e => {
  const a = e.target.closest('a[href^="?c="]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  go(a.getAttribute('href'), true);
});
$('refresh').onclick = () => Home.load(true);
$('brand').onclick = e => { e.preventDefault(); scrollTo(0, 0); Home.load(true); };
setInterval(() => { if (!document.hidden && !$('home').hidden) Home.load(); }, 60e3);
$('search').addEventListener('submit', e => {
  e.preventDefault();
  const login = norm($('q').value);
  if (!validLogin(login)) { $('q').focus(); return; }
  $('q').value = ''; $('q').blur();
  go(`?c=${login}`, true);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('home').hidden) Home.load(); });

// ── routing ─────────────────────────────────────────
let depth = 0;
function route(gesture) {
  const q = new URLSearchParams(location.search);
  const c = norm(q.get('c') || q.get('channel') || ''), v = q.get('v');
  if (Sheet && !$('sheet').hidden) Sheet.close();
  if (validLogin(c)) P.open(c, gesture, Home.find(c));
  else if (/^\d+$/.test(v || '')) P.openVod(v, gesture);
  else {
    P.close();
    $('watch').hidden = true; $('home').hidden = false;
    document.title = 'Wraith';
    Home.load();
  }
}
function go(url, gesture) { history.pushState(null, '', url); depth++; route(gesture); }
function back() {
  if (depth > 0) history.back();
  else { history.replaceState(null, '', location.pathname); route(false); }
}
window.addEventListener('popstate', () => { depth = Math.max(0, depth - 1); route(false); });

Sound.set(Sound.muted);
window.wraith = { P, Chat, Home, BG };   // for poking at playback from devtools
route(false);
})();
</script>
</body>
