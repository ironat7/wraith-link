<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Wraith Link</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>👻</text></svg>">
<style>
  :root {
    --bg: #0e0e10;
    --card: #18181b;
    --border: #2a2a30;
    --text: #efeff1;
    --muted: #8b8b95;
    --accent: #9147ff;
    --accent-hover: #772ce8;
    --live: #eb0400;
    --offline: #53535f;
    --ok: #00d066;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  body {
    padding: max(env(safe-area-inset-top), 24px) 16px max(env(safe-area-inset-bottom), 24px);
    max-width: 560px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .sub {
    color: var(--muted);
    font-size: 14px;
  }
  form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type=text] {
    flex: 1;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 17px;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type=text]:focus {
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; }
  .result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    display: none;
  }
  .result.shown { display: block; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--offline);
    flex-shrink: 0;
  }
  .dot.live {
    background: var(--live);
    box-shadow: 0 0 0 0 rgba(235, 4, 0, 0.7);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(235, 4, 0, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(235, 4, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(235, 4, 0, 0); }
  }
  .channel {
    color: var(--text);
    font-weight: 600;
  }
  .url {
    background: #0a0a0c;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 8px 0 12px;
    font: 12px ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-all;
    color: var(--muted);
    user-select: all;
    -webkit-user-select: all;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .actions a, .actions button.secondary {
    flex: 1;
    min-width: 0;
    background: #26262c;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .actions a:active, .actions button.secondary:active { background: #36363e; }
  .actions a.primary {
    background: var(--accent);
    border-color: var(--accent);
  }
  .actions a.primary:active { background: var(--accent-hover); }
  .error {
    color: #ff8080;
  }
  .recent {
    margin-top: 32px;
  }
  .recent-label {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:active { background: #26262c; }
  .chip .x {
    color: var(--muted);
    margin-left: 6px;
    font-size: 12px;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .copied {
    color: var(--ok);
    font-size: 13px;
    margin-left: 8px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .copied.shown { opacity: 1; }
  .vods {
    margin-top: 36px;
  }
  .vods-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .vods-title {
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .vods-count {
    color: var(--muted);
    font-size: 12px;
  }
  .vod {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .vod-head {
    padding: 12px 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .vod-head:active { background: #1e1e22; }
  .vod-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
  }
  .vod-meta {
    margin-top: 5px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .vod-actions {
    display: none;
    gap: 8px;
    padding: 0 14px 12px;
    flex-wrap: wrap;
  }
  .vod.open .vod-actions { display: flex; }
  .vod-actions a, .vod-actions button {
    flex: 1;
    min-width: 0;
    background: #26262c;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .vod-actions a.primary {
    background: var(--accent);
    border-color: var(--accent);
  }
  .vod-actions a:active, .vod-actions button:active { background: #36363e; }
  .vod-actions a.primary:active { background: var(--accent-hover); }
  .vods-msg {
    font-size: 14px;
    color: var(--muted);
    padding: 4px 0;
  }
  .vods-msg.error { color: #ff8080; }
  .vods-retry {
    margin-left: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
  <header>
    <h1>Wraith Link</h1>
    <span class="sub">Twitch CDN bypass</span>
  </header>

  <form id="f">
    <input type="text" id="ch" placeholder="channel" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
    <button type="submit" id="go">Go</button>
  </form>

  <div class="result" id="result"></div>

  <div class="recent">
    <div class="recent-label">Recent</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="vods" id="vods">
    <div class="vods-head">
      <span class="vods-title">Ikumi · sub-only VODs</span>
      <span class="vods-count" id="vodsCount"></span>
    </div>
    <div id="vodsList"><div class="vods-msg"><span class="spinner"></span> Loading…</div></div>
  </div>

<script>
const CLIENT_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';
const $ = id => document.getElementById(id);
const result = $('result');

const recent = {
  get() { try { return JSON.parse(localStorage.getItem('recent') || '[]'); } catch { return []; } },
  add(ch) {
    const list = this.get().filter(c => c !== ch);
    list.unshift(ch);
    localStorage.setItem('recent', JSON.stringify(list.slice(0, 8)));
    this.render();
  },
  remove(ch) {
    localStorage.setItem('recent', JSON.stringify(this.get().filter(c => c !== ch)));
    this.render();
  },
  render() {
    const chips = $('chips');
    const list = this.get();
    chips.innerHTML = list.length ? list.map(c =>
      `<span class="chip" data-ch="${c}">${c}<span class="x" data-rm="${c}">×</span></span>`
    ).join('') : '<span class="sub">none yet</span>';
  },
};

async function gql(query) {
  const r = await fetch('https://gql.twitch.tv/gql', {
    method: 'POST',
    headers: { 'Client-ID': CLIENT_ID, 'Content-Type': 'application/json' },
    body: JSON.stringify({ query }),
  });
  return r.json();
}

async function sha1hex(s) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function timeAgo(iso) {
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m`;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return m ? `${h}h ${m}m` : `${h}h`;
}

function showError(msg) {
  result.className = 'result shown';
  result.innerHTML = `<div class="status"><span class="dot"></span><span class="error">${msg}</span></div>`;
}

async function discoverCfDist(channel) {
  const r = await gql(`{ user(login: "${channel}") { videos(first:1, sort:TIME) { edges { node { seekPreviewsURL } } } } }`);
  const url = r?.data?.user?.videos?.edges?.[0]?.node?.seekPreviewsURL;
  if (!url) return null;
  const m = url.match(/https:\/\/([^.]+)\.cloudfront\.net\//);
  return m ? m[1] : null;
}

async function buildLink(channel) {
  channel = channel.toLowerCase().trim().replace(/^https?:\/\/(www\.)?twitch\.tv\//, '').replace(/\/.*$/, '');
  if (!channel) return;

  $('ch').value = channel;
  result.className = 'result shown';
  result.innerHTML = `<div class="status"><span class="spinner"></span><span>Checking ${channel}…</span></div>`;
  $('go').disabled = true;

  try {
    const meta = await gql(`{ user(login: "${channel}") { id login stream { id createdAt type } } }`);
    const user = meta?.data?.user;
    if (!user) { showError(`Channel "${channel}" not found.`); return; }
    if (!user.stream) {
      result.innerHTML = `<div class="status"><span class="dot"></span><span><span class="channel">${channel}</span> is offline.</span></div>`;
      recent.add(channel);
      return;
    }

    const cfDist = await discoverCfDist(channel);
    if (!cfDist) { showError(`No past VODs on ${channel} — can't discover CDN distribution.`); return; }

    const streamId = user.stream.id;
    const ts = Math.floor(new Date(user.stream.createdAt).getTime() / 1000);
    const hash = (await sha1hex(`${channel}_${streamId}_${ts}`)).substring(0, 20);
    const m3u8 = `https://${cfDist}.cloudfront.net/${hash}_${channel}_${streamId}_${ts}/chunked/index-dvr.m3u8`;
    const vlc = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(m3u8)}`;
    const ago = timeAgo(user.stream.createdAt);

    result.innerHTML = `
      <div class="status">
        <span class="dot live"></span>
        <span><span class="channel">${channel}</span> live · started ${ago} ago</span>
      </div>
      <div class="url" id="urlbox">${m3u8}</div>
      <div class="actions">
        <a class="primary" href="${m3u8}">Play in Safari</a>
        <a href="${vlc}">Open in VLC</a>
        <button class="secondary" type="button" id="copy">Copy<span class="copied" id="copied">✓</span></button>
      </div>
    `;

    $('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(m3u8);
        $('copied').classList.add('shown');
        setTimeout(() => $('copied').classList.remove('shown'), 1500);
      } catch {
        const range = document.createRange();
        range.selectNode($('urlbox'));
        getSelection().removeAllRanges();
        getSelection().addRange(range);
      }
    };

    recent.add(channel);
  } catch (e) {
    showError(`Error: ${e.message}`);
  } finally {
    $('go').disabled = false;
  }
}

// ── Ikumi ASMR VOD library ──────────────────────────────
// Her ASMR streams archive as Twitch VODs, many flipped to sub-only ("members").
// The CloudFront CDN serves the segments with zero auth, so we list every VOD and
// build its index-dvr.m3u8 straight from the seekPreviewsURL path — no sub needed.
const IKUMI = 'ikumi';

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function fmtDur(sec) {
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function cleanTitle(t) {
  // strip her trailing brand boilerplate: chat commands (!Patreon !yt !gg), ⭐, and a dangling "ASMR"
  let s = t.replace(/!\S+/g, '').replace(/⭐/g, '').replace(/\s+/g, ' ').trim();
  return s.replace(/\s*ASMR\s*$/i, '').trim() || t;
}

function vodM3u8(seek) {
  // seekPreviewsURL: https://{cf}.cloudfront.net/{path}/storyboards/{id}-info.json
  const m = seek && seek.match(/https:\/\/([^.]+)\.cloudfront\.net\/([^/]+)\/storyboards\//);
  return m ? `https://${m[1]}.cloudfront.net/${m[2]}/chunked/index-dvr.m3u8` : null;
}

async function loadVods(login) {
  const list = $('vodsList');
  list.innerHTML = `<div class="vods-msg"><span class="spinner"></span> Loading…</div>`;
  try {
    const r = await gql(`{ user(login: "${login}") { videos(first: 100, sort: TIME) { edges { node { id title lengthSeconds createdAt resourceRestriction { type } seekPreviewsURL } } } } }`);
    const vods = (r?.data?.user?.videos?.edges || [])
      .map(e => ({ ...e.node, m3u8: vodM3u8(e.node.seekPreviewsURL) }))
      .filter(v => v.m3u8 && v.resourceRestriction);  // sub-only ("members") VODs only
    if (!vods.length) { list.innerHTML = `<div class="vods-msg">No sub-only VODs right now.</div>`; return; }
    $('vodsCount').textContent = vods.length;
    list.innerHTML = vods.map(v => {
      const vlc = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(v.m3u8)}`;
      return `<div class="vod">
        <div class="vod-head">
          <div class="vod-title">${esc(cleanTitle(v.title))}</div>
          <div class="vod-meta">${fmtDate(v.createdAt)} · ${fmtDur(v.lengthSeconds)}</div>
        </div>
        <div class="vod-actions">
          <a class="primary" href="${v.m3u8}">Play</a>
          <a href="${vlc}">VLC</a>
          <button class="secondary" type="button" data-copy="${v.m3u8}">Copy</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<div class="vods-msg error">Couldn't load VODs.<button class="vods-retry" id="vodsRetry">Retry</button></div>`;
    const rt = $('vodsRetry'); if (rt) rt.onclick = () => loadVods(login);
  }
}

$('vodsList').addEventListener('click', e => {
  const copyUrl = e.target.dataset.copy;
  if (copyUrl) {
    e.stopPropagation();
    const b = e.target, old = b.textContent;
    const done = () => { b.textContent = 'Copied ✓'; setTimeout(() => { b.textContent = old; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(copyUrl).then(done).catch(() => {});
    else {
      const ta = document.createElement('textarea');
      ta.value = copyUrl; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch {}
      ta.remove();
    }
    return;
  }
  if (e.target.closest('.vod-actions')) return;
  const head = e.target.closest('.vod-head');
  if (head) head.parentElement.classList.toggle('open');
});

$('f').addEventListener('submit', e => {
  e.preventDefault();
  buildLink($('ch').value);
});

$('chips').addEventListener('click', e => {
  const rm = e.target.dataset.rm;
  if (rm) { recent.remove(rm); return; }
  const ch = e.target.closest('[data-ch]')?.dataset.ch;
  if (ch) buildLink(ch);
});

recent.render();
loadVods(IKUMI);

const params = new URLSearchParams(location.search);
const initial = params.get('c') || params.get('channel');
if (initial) buildLink(initial);
</script>
</body>
</html>
