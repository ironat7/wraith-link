  retryLive() {
    const gen = this.gen;
    setTimeout(async () => {
      if (gen !== this.gen || this.feed !== 'cdn' || this.pref !== 'live') return;
      if (BG.on) return this.retryLive();
      const tok = await getToken(this.login).catch(() => null);
      const master = tok && !tok.authorization?.isForbidden ? await relayText(usherUrl(this.login, tok)) : null;
      if (gen !== this.gen || this.feed !== 'cdn') return;
      if (!master?.includes('#EXT-X-STREAM-INF')) return this.retryLive();
      this.retries = 0; this.tokenP = Promise.resolve(tok);
      this.playLive();
    }, 180e3);
  },

  onAd(on, end) {
    if (on) {
      if (end) this.adEnd = end;
      if (this.ad) return;
      this.ad = true; this.skipped++;
      this.dodge();
      UI.banner();
    } else if (this.ad) {
      this.ad = false; this.adEnd = 0; this.dodged.clear();
      if (this.cover) { this.cover = false; this.stopCdn(); this.show('live'); }
      if (BG.on) this.hls?.stopLoad();   // away, on the CDN's sound: it all comes back with the picture
      else if (this.feed === 'live') { this.toLiveEdge(); this.play(vL); }
      UI.banner();
    }
  },

  // An ad on this session. Another kind of session usually isn't getting it (your account's Turbo never is),
  // so look for one that comes back clean and move to it. Only if all have ads does the break play out:
  // Safari can show the ad-free CDN feed through it, also while the looking takes a while; elsewhere the picture holds.
  async dodge() {
    if (this.dodging) return;
    this.dodging = true;
    const gen = this.gen, login = this.login;
    const cover = () => { if (gen === this.gen && this.ad && this.feed === 'live' && !BG.on && cdnLive && this.base) { this.cover = true; this.playCdn({ cover: true }); UI.banner(); } };
    const slow = setTimeout(cover, 5000);
    try {
      for (const kind of [...PLAYER_TYPES, 'account']) {
        if (kind === this.playerType || this.dodged.has(kind)) continue;
        this.dodged.add(kind);
        const tok = kind === 'account' ? await Me.streamToken(login) : await getToken(login, kind).catch(() => null);
        if (gen !== this.gen || !this.ad || BG.on) return;
        if (!tok || tok.authorization?.isForbidden) continue;
        const master = await relayText(usherUrl(login, tok)), media = master && master.match(/#EXT-X-STREAM-INF[^\n]*\n(\S+)/)?.[1];
        const text = media && await relayText(media);
        if (gen !== this.gen || !this.ad || BG.on) return;
        if (!text?.includes('#EXTINF') || /stitched-ad|X-TV-TWITCH-AD|,Amazon/.test(text)) continue;
        if (kind !== 'account') { this.playerType = kind; store.set('playerType', kind); }
        this.ad = false; this.adEnd = 0; this.dodged.clear();
        this.destroyHls();
        this.tokenP = Promise.resolve(tok);
        UI.banner();
        return this.playLive();
      }
      cover();
    } finally { clearTimeout(slow); if (gen === this.gen) this.dodging = false; }
  },

  playCdn({ cover = false, reload = false } = {}) {
    if (!this.base || !cdnLive) return cover ? null : UI.needsSafari(this.base ? 'The ad-free CDN feed needs Safari' : 'There’s no CDN copy of this stream');
    const g = this.q === 'source' || this.q === 'auto' || !this.groups.some(x => x.id === this.q) ? 'chunked' : this.q;
    const url = `${this.base}/${g}/index-dvr.m3u8`;
    if (reload || vC.dataset.url !== url) { vC.dataset.url = url; vC.src = url; this.seekPending = true; }
    vC.muted = Sound.muted;
    this.show('cdn');
    UI.spin(vC.paused || vC.readyState < 3);
    this.play(vC);
  },

  nextVodSource() {
    const u = this.vodSrcs?.shift();
    if (!u) return false;
    if (vC.dataset.url?.startsWith('blob:')) URL.revokeObjectURL(vC.dataset.url);
    vC.dataset.url = u; vC.src = u;
    this.play(vC);
    return true;
  },

  stopCdn() {
    if (!vC.dataset.url) return;
    if (vC.dataset.url.startsWith('blob:')) URL.revokeObjectURL(vC.dataset.url);
    this.vodSrcs?.forEach(u => u.startsWith('blob:') && URL.revokeObjectURL(u));
    this.vodSrcs = null;
    vC.pause(); vC.removeAttribute('src'); delete vC.dataset.url; vC.load();
  },

  cdnSeek() {
    const s = vC.seekable;
    if (!s.length) return;
    const end = s.end(s.length - 1), want = Date.now() / 1000 - this.start - TARGET.cdn;
    if (Number.isFinite(end)) vC.currentTime = Math.max(s.start(0), Math.min(want, end - 3));
    this.seekPending = false;
  },

  toLiveEdge() {
    const p = this.hls?.liveSyncPosition;
    if (Number.isFinite(p) && p > vL.currentTime + 1) vL.currentTime = p;
  },

  show(which) {
    this.feed = which;
    vL.classList.toggle('off', which !== 'live');
    vC.classList.toggle('off', which === 'live');
    (which === 'live' ? vC : vL).pause();
    this.rate = 'normal';
    UI.feed();
  },

  play(v) {
    if (this.userPaused) return;   // a pause you chose holds until you undo it
    v.muted = Sound.muted;
    const p = v.play();
    if (p) p.catch(err => {
      if (err.name !== 'NotAllowedError' || v.classList.contains('off')) return;
      v.muted = true; UI.unmute(true);          // browsers still allow muted autoplay
      v.play().catch(() => UI.big(true));
    });
  },

  active() { return this.feed === 'live' ? vL : this.feed ? vC : null; },

  latency() {
    if (this.feed === 'live') { const d = this.hls?.playingDate; return d ? (Date.now() - d.getTime()) / 1000 : null; }
    if (this.feed === 'cdn' && vC.readyState > 0) return Date.now() / 1000 - this.start - vC.currentTime;
    return null;
  },

  // Chat shows up as late as the picture: Twitch viewers sit ~2.5 s behind, so delay by the rest.
  chatDelay() {
    const l = this.feed === 'vod' ? null : this.latency();
    return l == null ? 0 : Math.max(0, l - 2.5) * 1000;
  },

  // Speed up a little when behind, slow down when the buffer runs thin. Discrete steps with
  // hysteresis: a continuously varying rate makes the audio pitch wander.
  tick() {
    UI.lat();
    const v = this.active(), now = Date.now();
    if (!v || this.feed === 'vod' || this.feed === 'clip') return;
    this.watch(v, now);
    if (v.paused) return;
    // a picked quality stays picked, whatever hls.js decides after an error
    if (this.feed === 'live' && this.q !== 'auto' && this.hls?.autoLevelEnabled && this.groups.length) this.hls.loadLevel = this.levelIndex();
    if (v.readyState < 3) {   // stalled: hop the hole a cut-out ad leaves if picture is buffered past it
      const b = v.buffered;
      for (let i = 0; i < b.length; i++) if (b.start(i) > v.currentTime + 0.1) { v.currentTime = b.start(i) + 0.05; break; }
      return;
    }
    const lat = this.latency(), live = this.feed === 'live', T = live ? this.liveT : TARGET.cdn;
    if (lat == null) return;
    if (lat > T + 10) {
      if (live) this.toLiveEdge(); else this.cdnSeek();
      return;
    }
    if (live && this.liveT > TARGET.live && now - this.calm > 45e3) {   // smooth for a while: edge back in
      this.liveT = Math.max(TARGET.live, this.liveT - 0.5); this.calm = now;
    }
    if (live && this.cap && now - this.lastStall > this.capWait) {   // and try the quality it stepped down from
      this.cap--; this.capWait = Math.min(this.capWait * 2, 1800e3); this.lastStall = now;
      this.applyQuality(true);
      if (!this.cap) UI.toast('Back to the quality you picked');
    }
    const ahead = bufAhead(v);
    let s = this.rate;
    // slow down when the buffer runs thin, or when live starts closer than the target (no cushion)
    if ((ahead < 0.5 && lat < T + 4) || (live && lat < T - 0.5)) s = 'slow';
    else if (s === 'slow') { if ((ahead > 1.2 || lat > T + 0.8) && !(live && lat < T - 0.1)) s = 'normal'; }
    else if (lat > T + (live ? 0.6 : 1.2)) s = 'fast';
    else if (s === 'fast' && lat < T + (live ? 0.15 : 0.3)) s = 'normal';
    this.rate = s;
    const r = s === 'fast' ? 1.1 : s === 'slow' ? 0.93 : 1;
    if (v.playbackRate !== r) v.playbackRate = r;
  },

  noteErr(d, where = '') {   // routine stall notices, the page's own aborts and cut-out ads left out
    if (/^(buffer(StalledError|NudgeOnStall|SeekOverHole)|aborted|fragGap)$/.test(d.details)) return;
    const k = where + d.details + (d.fatal ? ' (fatal)' : '');
    this.errs[k] = (this.errs[k] || 0) + 1;
  },

  noteStall() {
    if (this.feed !== 'live' || this.ad || !this.hls || Date.now() < this.quietUntil) return;
    const now = Date.now();
    this.liveT = Math.min(TARGET.liveMax, this.liveT + 0.5); this.calm = this.lastStall = now;   // more cushion next time
    if (this.q === 'auto') return;
    this.stalls = this.stalls.filter(t => now - t < 60e3).concat(now);
    if (this.stalls.length < 3) return;
    const list = this.qualities(), at = Math.max(0, list.findIndex(x => x.id === this.q)) + this.cap;
    if (at >= list.length - 1) return;
    this.stalls = [];
    this.cap++;   // not your setting: the next stream starts on what you picked, and so does this one once it's calm
    this.applyQuality(true);
    UI.toast(`Dropped to ${list[at + 1].label} to stop the buffering`);
  },

  // The player can wedge in ways that raise no error (a socket left dead by a network change, a buffer
  // iOS threw away). A picture that hasn't moved for 10 s while it should be playing starts over.
  watch(v, now) {
    const moving = v.currentTime !== this.pos;
    this.pos = v.currentTime;
    if (moving && this.feed === 'live' && now - this.began > 8e3) this.retries = this.fixes = 0;   // it really is playing: the last restart worked
    if (this.feed !== 'live' || !this.hls || BG.on || document.hidden || v.paused || this.ad || !navigator.onLine || moving) { this.moved = now; return; }
    if (now - this.moved < 10e3) return;
    this.moved = now;
    this.noteErr({ details: 'stuck' });
    this.restart();
  },

  async refresh() {
    const gen = this.gen;
    try {
      const [u] = await getUsers([this.login]);
      if (gen !== this.gen || !u) return;
      if (u.stream && this.user?.stream && u.stream.id !== this.user.stream.id) { const paused = this.userPaused; this.open(this.login); this.userPaused = paused; return; }
      // Twitch's directory blinks now and then, so a stream only counts as over once it's been asked twice
      if (!u.stream && this.user?.stream && ++this.gone < 2) { setTimeout(() => { if (gen === this.gen) this.refresh(); }, 20e3); return; }
      this.gone = 0;
      this.user = u; UI.info(u);
      if (!u.stream) this.ended(u);
    } catch {}
  },

  // Offline: look every so often, and start by itself the moment the channel goes live.
  awaitLive() {
    const gen = this.gen;
    clearInterval(this.timer);
    this.timer = setInterval(async () => {
      if (document.hidden) return;
      try { const [u] = await getUsers([this.login]); if (gen === this.gen && u?.stream) this.open(this.login, false, u); } catch {}
    }, 30e3);
  },

  async checkEnded() {
    const gen = this.gen;
    try { const [u] = await getUsers([this.login]); if (gen === this.gen && u && !u.stream) { this.ended(u); return true; } } catch {}
    return false;
  },

  ended(u) {
    BG.stop(true);
    this.destroyHls(); this.stopCdn(); vL.removeAttribute('src');
    this.feed = null; this.cover = this.ad = false; this.adEnd = 0; UI.banner();
    UI.offline(u, true);
    Awake.sync();
    this.awaitLive();
  },

  destroyHls() {
    this.liveRun++;   // and any start still under way
    if (this.hls) { this.hls.destroy(); this.hls = null; }
  },

  close() {
    this.gen++;
    clearInterval(this.timer);
    BG.stop(true);
    this.destroyHls(); this.stopCdn();
    this.vodAudio?.forEach(u => u.startsWith('blob:') && URL.revokeObjectURL(u));
    vC.controls = false; vL.pause(); vL.removeAttribute('src'); vL.load();
    Object.assign(this, { login: null, user: null, feed: null, groups: [], base: null, subOnly: false, ad: false, adEnd: 0,
      cover: false, rate: 'normal', stalls: [], retries: 0, fixes: 0, vod: null, tokenP: null, seekPending: false,
      liveT: TARGET.live, calm: Date.now(), userPaused: false, audioUrl: null, vodAudio: null, quietUntil: 0, errs: {},
      cap: 0, capWait: 180e3, lastStall: 0, pos: -1, moved: 0, gone: 0, dodging: false });
    this.dodged = new Set();
    primed = null; shownSegs.clear();
    stage.classList.remove('vod'); $('watch').classList.remove('vodw');
    Replay.close();
    Awake.sync();
    Chat.close(); UI.clear();
  },
};

// iPhone pauses a page's video the moment the app goes to the background but lets audio-only
// playback carry on. So while the page is hidden the sound moves to an audio element: Twitch's
// audio_only feed through the relay for live (fetched directly, it would get ads), or the CDN copy's
// audio_only playlist for sub-only streams and past broadcasts.
// iOS gives Control Center to the page's biggest player even while it sits paused, and never to a
// muted one, so the pictures are muted while away and the buttons there drive the sound. WebKit
// makes that choice as the app leaves, before the sound has started, finds no player it can use and
// drops the page; nothing makes it look again, so Control Center stays on whatever app played last.
// Setting the track details again once the sound is playing makes it look again.
const BG = {
  ios, on: false, hls: null, srcs: null,
  held: false,   // paused from the lock screen or Control Center: stays paused on return
  claim() {
    const ms = navigator.mediaSession, m = ms?.metadata;
    if (!ms) return;
    try { ms.metadata = m ? new MediaMetadata({ title: m.title, artist: m.artist, album: m.album, artwork: [...m.artwork] }) : null; } catch {}
  },
  start() {
    const v = P.active();
    if (!this.ios || this.on || !v || Sound.muted || P.userPaused) return;
    if (P.feed === 'live' ? !(P.audioUrl && P.hls && window.Hls) : P.feed === 'cdn' ? !P.base : !P.vodAudio?.length) return;
    this.on = true; this.held = false;
    aBG.muted = false;
    if (P.feed === 'live') {
      // the picture's player lets go of its stream while away: the relay isn't polled twice, iOS gets
      // the memory back, and on return it starts clean at the live edge
      P.hls.stopLoad();
      P.hls.detachMedia();
      // it takes ~2.5 s to start, so it starts ~2.5 s further back: the sound resumes where the
      // picture stopped, with more cushion for the slower timers of a backgrounded page
      const h = this.hls = new window.Hls({ ...LOADING, pLoader: QuietRelayLoader, progressive: true, liveSyncDuration: 6.5,
        liveMaxLatencyDuration: 25, maxLiveSyncPlaybackRate: 1, liveDurationInfinity: true, maxBufferLength: 12 });
      h.on(window.Hls.Events.ERROR, (_, d) => {   // nobody's looking at the page: keep retrying quietly
        P.noteErr(d, 'background ');
        if (!d.fatal || this.hls !== h) return;
        if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR) h.recoverMediaError();
        else setTimeout(() => { if (this.hls === h) h.startLoad(-1); }, 2000);
      });
      h.loadSource(P.audioUrl);
      h.attachMedia(aBG);
    } else {
      const at = vC.currentTime;   // the audio copy runs on the same clock: pick up where the picture is
      const srcs = this.srcs = P.feed === 'cdn' ? [`${P.base}/audio_only/index-dvr.m3u8`] : [...P.vodAudio];
      aBG.addEventListener('loadedmetadata', () => { if (this.srcs === srcs) aBG.currentTime = at; }, { once: true });
      this.next();
    }
    const p = aBG.play(); if (p) p.catch(() => {});
    v.pause();
    vL.muted = vC.muted = true;
  },
  next() {
    const u = this.srcs?.shift();
    if (!u) return false;
    aBG.src = u;
    const p = aBG.play(); if (p) p.catch(() => {});
    return true;
  },
  stop(silent) {
    if (!this.on) return;
    this.on = false;
    const at = aBG.currentTime;
    if (this.hls) { this.hls.destroy(); this.hls = null; }
    aBG.pause(); aBG.removeAttribute('src'); aBG.load(); this.srcs = null;
    vL.muted = vC.muted = Sound.muted;
    if (silent) return;
    P.moved = Date.now();
    if (P.feed === 'live' && P.hls) {
      P.quietUntil = Date.now() + 6000;   // the restart's own buffering isn't a bad connection
      if (!P.hls.media) P.hls.attachMedia(vL);
      P.hls.once(window.Hls.Events.LEVEL_UPDATED, () => P.toLiveEdge());   // to the edge once the playlist is fresh
      P.hls.startLoad(-1);
      if (!this.held) UI.spin(true);
    }
    else if (P.feed === 'vod' && at) vC.currentTime = at;
    else if (P.feed === 'cdn') P.cdnSeek();
    if (this.held) P.userPaused = true;
    else { P.play(P.active()); if (!Sound.muted) UI.unmute(false); }
    UI.playIcon();
  },
};
aBG.addEventListener('error', () => { if (BG.on && BG.srcs) BG.next(); });
aBG.addEventListener('playing', () => {
  if (!BG.on) return;
  BG.claim();
  setTimeout(() => { if (BG.on) BG.claim(); }, 2000);   // and again, in case it wasn't ready for the first
});
document.addEventListener('visibilitychange', () => {
  if ($('watch').hidden) return;
  if (document.hidden) BG.start(); else BG.stop();
});
if ('mediaSession' in navigator) {   // lock screen / Control Center buttons
  const ms = navigator.mediaSession;
  ms.setActionHandler('play', () => {
    if (BG.on) {
      BG.held = false;
      const h = BG.hls;
      if (h) {   // live: back at the edge as soon as the playlist has reloaded
        h.once(window.Hls.Events.LEVEL_UPDATED, () => {
          const p = h.liveSyncPosition;
          if (BG.hls === h && Number.isFinite(p) && p > aBG.currentTime + 3) aBG.currentTime = p;
        });
        h.startLoad(-1);
      }
      aBG.play().catch(() => {});
    } else if (P.active()?.paused) togglePlay();
  });
  ms.setActionHandler('pause', () => {
    if (BG.on) { BG.held = true; aBG.pause(); BG.hls?.stopLoad(); }   // stopped: no relay polling while paused
    else if (P.active() && !P.active().paused) togglePlay();
  });
}

const Sound = {
  muted: store.get('muted', false),
  level: store.get('volume', 1),     // iPhone ignores this: its buttons set the volume
  set(m) {
    this.muted = m; store.set('muted', m);
    vL.muted = vC.muted = m;
    setIcon($('bMute'), m ? 'mute' : 'vol');
    if (!m) UI.unmute(false);
  },
  setLevel(x, touched) {
    this.level = x = Math.min(1, Math.max(0, x)); store.set('volume', x);
    vL.volume = vC.volume = aBG.volume = x;
    $('vol').value = x;
    if (touched && x > 0 && this.muted) this.set(false);
  },
};

// The screen stays on while a picture is playing, sound or no sound.
const Awake = {
  lock: null, asking: false,
  async sync() {
    const v = P.active(), want = !!v && !v.paused && !document.hidden;
    if (!want) { const l = this.lock; this.lock = null; l?.release().catch(() => {}); return; }
    if (this.lock || this.asking || !navigator.wakeLock) return;
    this.asking = true;
    try { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener('release', () => { this.lock = null; }); } catch {}
    this.asking = false;
  },
};
document.addEventListener('visibilitychange', () => Awake.sync());

// A network change leaves connections hanging: with little left in the buffer, start clean rather than wait them out.
window.addEventListener('online', () => {
  if (P.feed === 'live' && P.hls && !BG.on && !vL.paused && bufAhead(vL) < 1) { P.retries = 0; P.restart(); }
  if (!document.hidden && !$('home').hidden) Home.load(true);
});

for (const v of [vL, vC]) {
  v.addEventListener('timeupdate', () => P.tick());
  v.addEventListener('playing', () => {
    if (P.active() === v) { UI.spin(false); UI.big(false); }
    UI.playIcon(); Awake.sync();
    if (stage.classList.contains('ui')) hud(true);   // restart the auto-hide now that there's picture
  });
  v.addEventListener('pause', () => { UI.playIcon(); Awake.sync(); });
  v.addEventListener('waiting', () => {
    if (P.active() !== v) return;
    UI.spin(true);
    if (v === vL && v.currentTime > 3) P.noteStall();
  });
}
vC.addEventListener('loadedmetadata', () => { if (P.seekPending && P.feed === 'cdn') P.cdnSeek(); });
vC.addEventListener('error', () => {
  if (!vC.dataset.url) return;
  if (P.feed === 'clip') return UI.msg(null, 'The clip wouldn’t play', 'Twitch’s CDN refused it.');
  if (P.feed === 'vod') {
    if (P.nextVodSource()) return;   // that copy didn't take: try the next
    return cdnLive ? UI.msg(null, 'The video wouldn’t play', 'Twitch’s CDN refused the playlist.') : UI.needsSafari(`https://www.twitch.tv/videos/${P.vod.id}`, true);
  }
  if (P.cover) { P.cover = false; P.stopCdn(); P.show('live'); UI.spin(false); UI.banner(); return; }
  if (P.feed === 'cdn') UI.msg(null, 'The CDN feed isn’t available', P.subOnly ? 'This channel’s stream isn’t being recorded, so there is no ad-free copy to play.' : 'Try the low-latency feed instead.', P.subOnly ? null : () => P.setPref('live'));
});
vC.addEventListener('timeupdate', () => {
  if (P.feed !== 'vod' || !P.vod) return;
  if (Math.floor(vC.currentTime) % 5 === 0) store.set('pos.' + P.vod.id, Math.floor(vC.currentTime));
  Replay.tick(vC.currentTime);
});
setInterval(() => { if (P.feed) { P.tick(); UI.banner(); } }, 1000);

// ── chat ────────────────────────────────────────────
const COLORS = ['#FF4D4D', '#5B8CFF', '#3DDC97', '#FF8A3D', '#B3E35A', '#FF6B3D', '#3FBF7F', '#E8B23A', '#E07B39', '#5FB8BF', '#3DA0FF', '#FF7EB6', '#A877FF', '#3DFFA0', '#FFB13D'];
function nameColor(hex, name) {
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; hex = COLORS[h % COLORS.length]; }
  let [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  if (lum < 0.5) { const k = (0.5 - lum) * 1.3; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }   // lift dark names off the black
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function parseIrc(line) {
  const m = { tags: {}, prefix: '', cmd: '', params: [], text: null };
  if (line[0] === '@') {
    const sp = line.indexOf(' ');
    for (const kv of line.slice(1, sp).split(';')) {
      const eq = kv.indexOf('=');
      m.tags[kv.slice(0, eq)] = kv.slice(eq + 1).replace(/\\(.)/g, (_, c) => ({ s: ' ', ':': ';', '\\': '\\', r: '\r', n: '\n' }[c] ?? c));
    }
    line = line.slice(sp + 1);
  }
  if (line[0] === ':') { const sp = line.indexOf(' '); m.prefix = line.slice(1, sp); line = line.slice(sp + 1); }
  const ti = line.indexOf(' :');
  if (ti >= 0) { m.text = line.slice(ti + 2); line = line.slice(0, ti); }
  [m.cmd, ...m.params] = line.split(' ');
  return m;
}

const Chat = {
  box: $('chat'), ws: null, login: null, uid: null, queue: [], stick: true, retry: 0, timer: 0, pinger: 0,
  emotes: new Map(), global: null, badges: new Map(), gbadges: null, zero: new Set(),
  chanEmotes: [], globalEmotes: [],     // the same emotes as lists, for the picker
  seen: new Set(), rx: 0, behind: false,  // ids already handled; when the socket last said anything; a gap to fill in
  room: {}, names: new Map(),             // chat modes; who has been talking, for @ completion
  newest: 0,                              // the time of the latest line drawn

  open(login) {
    this.close();
    this.login = login; this.stick = true; this.box.textContent = ''; $('more').hidden = true;
    this.note('Connecting to chat…').classList.add('wait');
    this.connect();
    this.history(60);
    this.timer = setInterval(() => this.flush(), 120);
    this.pinger = setInterval(() => this.ping(), 25e3);
    this.loadGlobal();
    Talk.show();
  },

  note(text) {
    const d = el('div', 'm note', text);
    this.box.appendChild(d);
    if (this.stick) this.box.scrollTop = this.box.scrollHeight;
    return d;
  },

  connect() {
    const ws = this.ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    this.rx = Date.now();
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + (10000 + Math.floor(Math.random() * 89999)));
      ws.send('JOIN #' + this.login);
    };
    ws.onmessage = e => { this.rx = Date.now(); for (const l of e.data.split('\r\n')) if (l) this.line(l); };
    ws.onclose = () => {
      if (this.ws !== ws) return;
      this.ws = null; this.behind = true;
      const login = this.login;
      setTimeout(() => { if (login && this.login === login && !this.ws) this.connect(); }, Math.min(15e3, 1000 * 2 ** this.retry++));
    };
  },

  // A socket can die without saying so, above all while iOS has the page suspended. Anything arriving
  // proves it's alive, so ask for something when it's been quiet, and reconnect if that gets no answer.
  ping() {
    if (this.ws?.readyState !== 1) return;
    const quiet = Date.now() - this.rx;
    if (quiet > 70e3) this.reconnect();
    else if (quiet > 20e3) this.ws.send('PING :wraith');
  },
  wake() {   // back from the background, or the network changed
    if (this.login && (!this.ws || Date.now() - this.rx > 15e3)) this.reconnect();
  },
  reconnect() {
    if (this.ws) { const w = this.ws; this.ws = null; w.onclose = null; w.close(); }
    this.behind = true; this.retry = 0;
    this.connect();
  },

  line(raw) {
    const m = parseIrc(raw);
    switch (m.cmd) {
      case 'PING': this.ws?.send('PONG :' + (m.text || 'tmi.twitch.tv')); break;
      case 'RECONNECT': this.ws?.close(); break;
      case 'ROOMSTATE':
        Object.assign(this.room, m.tags);
        Talk.hint();
        this.retry = 0;
        this.box.querySelectorAll('.wait').forEach(n => n.remove());
        if (this.behind) { this.behind = false; this.history(300); }
        break;
      case 'PRIVMSG': case 'USERNOTICE': this.add(m); break;
      case 'CLEARCHAT':   // on screen, and among the lines still waiting for the picture
        if (m.text) {
          this.box.querySelectorAll(`[data-l="${CSS.escape(m.text)}"]`).forEach(n => n.classList.add('gone'));
          for (const q of this.queue) if (q.m.prefix.startsWith(m.text + '!')) q.m.tags['rm-deleted'] = '1';
        }
        break;
      case 'CLEARMSG':
        if (m.tags['target-msg-id']) {
          this.box.querySelector(`[data-id="${CSS.escape(m.tags['target-msg-id'])}"]`)?.classList.add('gone');
          for (const q of this.queue) if (q.m.tags.id === m.tags['target-msg-id']) q.m.tags['rm-deleted'] = '1';
        }
        break;
    }
    if (this.queue.length > 800) this.queue.splice(0, this.queue.length - 800);
  },

  fresh(m) {   // not seen before, and not from someone you've blocked
    const id = m.tags.id;
    if (Me.blocks.has(m.tags['user-id'])) return false;
    if (!id) return true;
    if (this.seen.has(id)) return false;
    this.seen.add(id);
    if (this.seen.size > 4000) this.seen = new Set([...this.seen].slice(-2000));
    return true;
  },

  add(m) {
    if (!this.fresh(m)) return;
    // what you send shows at once, rather than waiting with everyone else's for the picture
    if (m.cmd === 'PRIVMSG' && Me.acct && m.tags['user-id'] === Me.acct.id) { this.queue.unshift({ ts: 0, m }); Talk.ircWait?.({ ok: true }); }
    else this.queue.push({ ts: +m.tags['tmi-sent-ts'] || Date.now(), m });
  },

  // A reader gets nothing from Twitch about what was said before it joined. recent-messages.robotty.de
  // keeps the last stretch of most channels, which fills chat on opening and the gap after a reconnect.
  async history(limit) {
    const login = this.login;
    try {
      const r = await fetch(`https://recent-messages.robotty.de/api/v2/recent-messages/${login}?limit=${limit}&hide_moderation_messages=true`);
      const lines = (await r.json()).messages || [];
      if (login !== this.login) return;
      const old = [];
      for (const raw of lines) {
        const m = parseIrc(raw);
        if ((m.cmd !== 'PRIVMSG' && m.cmd !== 'USERNOTICE') || !this.fresh(m)) continue;
        m.old = true;
        old.push({ ts: +m.tags['tmi-sent-ts'] || 0, m });
      }
      this.queue = [...old, ...this.queue].sort((a, b) => a.ts - b.ts);
    } catch {}
  },

  // Out of sight (app in the background, side chat hidden, Videos tab) nothing is drawn: lines
  // wait in the queue and only the newest screenful is drawn once chat is back in view.
  flush() {
    if (!this.queue.length || document.hidden || !this.box.offsetParent) return;
    const cut = Date.now() - P.chatDelay();
    let n = 0;
    while (n < this.queue.length && this.queue[n].ts <= cut) n++;
    if (!n) return;
    const lines = this.queue.splice(0, n).slice(-220);
    if (!this.stick && this.box.children.length > 1200) { $('more').hidden = false; return; }   // scrolled up for ages: stop growing
    // history can come back after newer lines are up, and goes in above them, where its times say
    const late = lines.filter(q => q.m.old && q.ts < this.newest), next = late.length ? lines.filter(q => !late.includes(q)) : lines;
    if (late.length) this.insert(late);
    for (const q of next) if (q.ts > this.newest) this.newest = q.ts;
    this.append(next.map(q => this.render(q.m)));
  },

  insert(late) {   // both in time order
    const drawn = [...this.box.querySelectorAll('[data-ts]')];
    let i = 0;
    for (const q of late) {
      while (i < drawn.length && +drawn[i].dataset.ts <= q.ts) i++;
      this.box.insertBefore(this.render(q.m), drawn[i] || null);
    }
  },

  append(nodes) {
    const frag = document.createDocumentFragment();
    for (const n of nodes) frag.appendChild(n);
    this.box.appendChild(frag);
    if (this.stick) {
      const extra = this.box.children.length - 220;
      for (let i = 0; i < extra; i++) this.box.firstChild.remove();
      this.box.scrollTop = this.box.scrollHeight;
    } else $('more').hidden = false;
  },

  render(m) {
    const t = m.tags, login = m.prefix.split('!')[0];
    const d = el('div', 'm');
    if (t.id) d.dataset.id = t.id;
    if (t['tmi-sent-ts']) d.dataset.ts = t['tmi-sent-ts'];
    if (login) d.dataset.l = login;
    if (t['user-id']) d.dataset.u = t['user-id'];
    if (m.old) d.classList.add('old');
    if (t['rm-deleted'] === '1') d.classList.add('gone');
    if (m.cmd === 'USERNOTICE') {
      d.classList.add('sys');
      d.append(t['system-msg'] || '');
      if (m.text) { const tx = el('span', 'tx'); this.text(tx, m.text, t.emotes); d.append(tx); }
      return d;
    }
    let text = m.text || '', skip = 0;
    if (t['msg-id'] === 'highlighted-message') d.classList.add('hl');
    else if (Me.mentions?.test(text) && t['user-id'] !== Me.acct?.id) d.classList.add('at');
    else if (t['first-msg'] === '1') d.classList.add('first');
    const to = t['reply-parent-user-login'];
    if (to) {   // the text opens with @name, which the line above it already says
      d.append(el('span', 'rp', `↳ ${t['reply-parent-display-name'] || to}: ${t['reply-parent-msg-body'] || ''}`));
      if (text.toLowerCase().startsWith(`@${to.toLowerCase()} `)) skip = to.length + 2;
    }
    for (const b of (t.badges || '').split(',')) {
      const src = b && (this.badges.get(b) || this.gbadges?.get(b));
      if (src) d.append(pic(src, 'bd'));
    }
    const action = text.startsWith('\x01ACTION ') && text.endsWith('\x01');
    if (action) { text = text.slice(8, -1); d.classList.add('me'); }
    const name = t['display-name'] || login;
    const n = el('span', 'n', /^[\x20-\x7e]+$/.test(name) || !login ? name : `${name} (${login})`);
    n.style.color = nameColor(t.color, login || name);
    if (login) { this.names.delete(login); this.names.set(login, name); if (this.names.size > 500) this.names.delete(this.names.keys().next().value); }
    d.append(n, action ? ' ' : ': ');
    const tx = el('span', 'tx');
    if (action) tx.style.color = n.style.color;
    this.text(tx, text, t.emotes, skip);
    d.append(tx);
    return d;
  },

  // Twitch emotes arrive as code-point ranges in the tags; 7TV/BTTV/FFZ emotes are matched by word.
  text(node, text, emoteTag, skip = 0) {
    const cps = Array.from(text), ranges = [];
    if (emoteTag) for (const part of emoteTag.split('/')) {
      const [id, pos] = part.split(':');
      for (const r of (pos || '').split(',')) { const [s, e] = r.split('-').map(Number); if (e >= s) ranges.push([s, e, id]); }
    }
    ranges.sort((a, b) => a[0] - b[0]);
    let i = skip;
    for (const [s, e, id] of ranges) {
      if (s < i) continue;
      if (s > i) this.words(node, cps.slice(i, s).join(''));
      this.emote(node, emoteUrl(id), cps.slice(s, e + 1).join(''));
      i = e + 1;
    }
    if (i < cps.length) this.words(node, cps.slice(i).join(''));
  },

  words(node, str) {
    let buf = '';
    for (const w of str.split(/(\s+)/)) {
      const em = w && this.emotes.get(w);
      const link = !em && /^https?:\/\/\S+\.\S+/i.test(w);
      const at = !em && !link && /^@\w{2,}/.test(w);
      if (!em && !link && !at) { buf += w; continue; }
      if (buf) { node.append(buf); buf = ''; }
      if (em) this.emote(node, em, w);
      else if (at) node.append(el('b', 'mn', w));
      else { const a = el('a', null, w); a.href = w; a.target = '_blank'; a.rel = 'noopener noreferrer'; node.append(a); }
    }
    if (buf) node.append(buf);
  },

  emote(node, src, name) {
    const i = pic(src, 'em'); i.alt = i.title = name;
    if (this.zero.has(name)) {   // a 7TV overlay: stacks on the emote before it
      let prev = node.lastChild;
      if (prev?.nodeType === 3 && !prev.data.trim()) { prev.remove(); prev = node.lastChild; }
      if (prev?.matches?.('.em,.emw')) {
        let w = prev;
        if (!prev.matches('.emw')) { w = el('span', 'emw'); prev.replaceWith(w); w.append(prev); }
        w.append(i);
        return;
      }
    }
    node.append(i);
  },

  // One line of a past broadcast's chat, in the same look as a live one.
  renderReplay(c) {
    const d = el('div', 'm'), who = c.commenter, msg = c.message || {};
    if (who?.login) d.dataset.l = who.login;
    if (who?.id) d.dataset.u = who.id;
    for (const b of msg.userBadges || []) {
      const k = `${b.setID}/${b.version}`, src = this.badges.get(k) || this.gbadges?.get(k);
      if (src) d.append(pic(src, 'bd'));
    }
    const name = who?.displayName || who?.login || 'someone';
    const n = el('span', 'n', name);
    n.style.color = nameColor(msg.userColor, who?.login || name);
    d.append(n, ': ');
    const tx = el('span', 'tx');
    for (const f of msg.fragments || []) {
      if (f.emote?.emoteID) this.emote(tx, emoteUrl(f.emote.emoteID), f.text);
      else this.words(tx, f.text || '');
    }
    d.append(tx);
    return d;
  },

  async loadGlobal() {
    if (this.global) return;
    this.global = new Map();
    const add = (name, url) => { if (name && url) { this.global.set(name, url); this.globalEmotes.push({ name, url }); } };
    const j = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
    const [ffz, bttv, stv, badges] = await Promise.all([
      j('https://api.frankerfacez.com/v1/set/global'), j('https://api.betterttv.net/3/cached/emotes/global'), j('https://7tv.io/v3/emote-sets/global'),
      gql('query { badges { setID version imageURL(size: DOUBLE) } }').catch(() => null),
    ]);
    for (const id of ffz?.default_sets || []) for (const e of ffz.sets?.[id]?.emoticons || []) add(e.name, e.urls?.['2'] || e.urls?.['1']);
    for (const e of bttv || []) add(e.code, `https://cdn.betterttv.net/emote/${e.id}/2x`);
    for (const e of stv?.emotes || []) { add(e.name, e.data?.host?.url && `https:${e.data.host.url}/2x.webp`); if (e.flags & 1 || e.data?.flags & 256) this.zero.add(e.name); }
    this.gbadges = new Map((badges?.badges || []).map(b => [`${b.setID}/${b.version}`, b.imageURL]));
    for (const [k, v] of this.global) if (!this.emotes.has(k)) this.emotes.set(k, v);
  },

  async channel(uid) {
    this.uid = uid;
    const list = [], add = (name, url) => { if (name && url) list.push({ name, url }); };
    const j = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
    const [ffz, bttv, stv, badges] = await Promise.all([
      j(`https://api.frankerfacez.com/v1/room/id/${uid}`), j(`https://api.betterttv.net/3/cached/users/twitch/${uid}`), j(`https://7tv.io/v3/users/twitch/${uid}`),
      gql('query($id: ID!) { user(id: $id) { broadcastBadges { setID version imageURL(size: DOUBLE) } } }', { id: uid }).catch(() => null),
    ]);
    if (this.uid !== uid) return;
    for (const s of Object.values(ffz?.sets || {})) for (const e of s.emoticons || []) add(e.name, e.urls?.['2'] || e.urls?.['1']);
    for (const e of [...(bttv?.channelEmotes || []), ...(bttv?.sharedEmotes || [])]) add(e.code, `https://cdn.betterttv.net/emote/${e.id}/2x`);
    for (const e of stv?.emote_set?.emotes || []) { add(e.name, e.data?.host?.url && `https:${e.data.host.url}/2x.webp`); if (e.flags & 1 || e.data?.flags & 256) this.zero.add(e.name); }
    this.emotes = new Map([...(this.global || []), ...list.map(e => [e.name, e.url])]); this.chanEmotes = list;
    this.badges = new Map((badges?.user?.broadcastBadges || []).map(b => [`${b.setID}/${b.version}`, b.imageURL]));
  },

  close() {
    clearInterval(this.timer); clearInterval(this.pinger);
    if (this.ws) { const w = this.ws; this.ws = null; w.onclose = null; w.close(); }
    this.login = null; this.uid = null; this.queue = []; this.retry = 0; this.behind = false; this.room = {}; this.chanEmotes = []; this.newest = 0;
    this.seen = new Set(); this.names = new Map();
    this.badges = new Map(); this.emotes = new Map(this.global || []);
    Picker.show(false);
    Talk.show();
  },
};
Chat.box.addEventListener('click', e => { const n = e.target.closest('.n'); if (n) Card.open(n.closest('.m')); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) Chat.wake(); });
window.addEventListener('online', () => Chat.wake());
let chatResized = 0;   // turning the phone or unfolding moves the scroll position; that isn't you scrolling up
new ResizeObserver(() => { chatResized = performance.now(); if (Chat.stick) Chat.box.scrollTop = Chat.box.scrollHeight; }).observe(Chat.box);
Chat.box.addEventListener('scroll', () => {
  if (performance.now() - chatResized < 250) return;
  Chat.stick = Chat.box.scrollHeight - Chat.box.scrollTop - Chat.box.clientHeight < 40;
  if (Chat.stick) $('more').hidden = true;
}, { passive: true });
$('more').onclick = () => { Chat.stick = true; Chat.box.scrollTop = Chat.box.scrollHeight; $('more').hidden = true; };

// ── past broadcast chat ─────────────────────────────
// Twitch hands out a video's chat from a position, then page by page, about a minute of a quiet chat at a time.
const Replay = {
  id: null, q: [], seen: new Set(), at: 0, cursor: null, last: -1, busy: false, done: false, dead: false, run: 0, wait: 0,
  open(id) { this.close(); this.id = id; },
  close() { this.run++; this.id = null; this.q = []; this.seen = new Set(); this.cursor = null; this.last = -1; this.busy = this.done = this.dead = false; this.wait = 0; },
  tick(t) {
    if (!this.id || this.dead) return;
    if (this.last < 0 || t < this.last - 2 || t > this.last + 8) {   // just started, or a seek
      this.run++; this.busy = false; this.wait = 0;
      this.q = []; this.seen = new Set(); this.at = Math.floor(t); this.cursor = null; this.done = false;
      Chat.box.textContent = '';
    }
    this.last = t;
    let n = 0;
    while (n < this.q.length && this.q[n].contentOffsetSeconds <= t) n++;
    if (n && !document.hidden && Chat.box.offsetParent) Chat.append(this.q.splice(0, n).slice(-120).map(c => Chat.renderReplay(c)));
    else if (n > 400) this.q.splice(0, n - 120);
    if (!this.busy && !this.done && Date.now() >= this.wait && (!this.q.length || this.q[this.q.length - 1].contentOffsetSeconds < t + 15)) this.fetch();
  },
  async fetch() {
    this.busy = true;
    const run = this.run, vars = this.cursor ? { id: this.id, c: this.cursor } : { id: this.id, o: this.at };
    const head = this.cursor ? '$c: Cursor' : '$o: Int', from = this.cursor ? 'after: $c' : 'contentOffsetSeconds: $o';
    try {
      const d = await gql(`query($id: ID!, ${head}) { video(id: $id) { comments(${from}) { edges { cursor node { id contentOffsetSeconds commenter { id login displayName } message { fragments { text emote { emoteID } } userColor userBadges { setID version } } } } pageInfo { hasNextPage } } } }`, vars, TV_CID);
      if (run !== this.run) return;
      const c = d.video?.comments;
      if (!c) { this.dead = true; return void Chat.note('Twitch isn’t sharing this video’s chat.'); }
      for (const { node: n } of c.edges) {
        if (n.contentOffsetSeconds < this.last - 3 || this.seen.has(n.id) || Me.blocks.has(n.commenter?.id)) continue;
        this.seen.add(n.id);
        this.q.push(n);
      }
      this.q.sort((a, b) => a.contentOffsetSeconds - b.contentOffsetSeconds);
      this.cursor = c.edges[c.edges.length - 1]?.cursor || null;
      if (!c.pageInfo?.hasNextPage || !this.cursor) this.done = true;
    } catch { this.wait = Date.now() + 5e3; }
    finally { if (run === this.run) this.busy = false; }
  },
};

// ── your account ────────────────────────────────────
// Signing in is the device flow of Twitch's TV app: the page shows a code, you approve it on Twitch (on
// this device or any other), and the page gets a token. It needs no registered app and no trip away from
// the page, which matters in the Home Screen app, whose storage Safari doesn't share. Playback and
// reading chat stay anonymous; the account is for what only it can see or do. The token only goes to Twitch.
const SCOPES = 'channel_read chat:read chat:edit user_read user_follows_edit user_blocks_read user_blocks_edit user:write:chat user:read:follows user:read:blocked_users user:manage:blocked_users user:read:emotes';
const Me = {
  acct: store.get('me', null),         // { token, refresh, exp, id, login, name, pic }
  follows: store.get('follows', null), // your follow list from Twitch, newest first
  blocks: new Set(store.get('blocks', [])),
  emotes: store.get('myEmotes', []),   // [{ name, url, owner }]
  mentions: null,                      // matches your name in chat
  at: {}, notes: {},                   // when each list was last fetched; why one last failed, for the account sheet

  post(url, params) { return fetch(url, { method: 'POST', body: new URLSearchParams(params) }); },

  tokens(j) { return { token: j.access_token, refresh: j.refresh_token || this.acct?.refresh || null, exp: j.expires_in ? Date.now() + j.expires_in * 1000 : 0 }; },
  async accept(j) {   // a first sign-in
    const r = await fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + j.access_token } });
    if (!r.ok) throw new Error(`Twitch answered ${r.status}`);
    const v = await r.json();
    this.save({ ...this.tokens(j), id: v.user_id, login: v.login, name: v.login, pic: null });
    this.at.check = Date.now();
  },
  save(a) {
    this.acct = a;
    store.set('me', a);
    this.mentions = a ? new RegExp(`(^|[^\\w])@?${a.login}($|[^\\w])`, 'i') : null;
    UI.account();
  },

  // A usable token, renewed first if it's about to lapse. Renewals go one at a time: a refresh token works once.
  async token() {
    if (this.acct?.exp && Date.now() > this.acct.exp - 120e3) await this.renew();
    return this.acct?.token || null;
  },
  renew() {
    if (!this.renewing) this.renewing = this.renewNow().finally(() => { this.renewing = null; });
    return this.renewing;
  },
  async renewNow() {
    const a = this.acct;
    if (!a?.refresh) return this.out('Twitch signed you out. Sign in again.');
    try {
      const r = await this.post('https://id.twitch.tv/oauth2/token', { client_id: TV_CID, grant_type: 'refresh_token', refresh_token: a.refresh });
      if (r.ok) {   // the old refresh token is spent, so the new one is kept before anything else can go wrong
        const j = await r.json();
        if (j.access_token && this.acct?.id === a.id) this.save({ ...this.acct, ...this.tokens(j) });
      } else if (r.status === 400 || r.status === 401) {
        const there = store.get('me', null);   // another tab may have got there first
        if (there?.refresh && there.refresh !== a.refresh) this.save(there);
        else this.out('Twitch signed you out. Sign in again.');
      }
    } catch {}
  },
  async check() {   // Twitch asks apps to re-validate hourly
    if (!this.acct) return;
    this.at.check = Date.now();
    try {
      const r = await fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + this.acct.token } });
      if (r.status === 401) await this.renew();
    } catch {}
  },
  out(why) {
    this.save(null);
    this.follows = null; this.blocks = new Set(); this.emotes = []; this.at = {}; this.notes = {};
    store.set('follows', null); store.set('blocks', []); store.set('myEmotes', []);
    Talk.ircDrop(); Talk.useIrc = false;   // that socket is signed in as whoever opened it
    Talk.show();
    if (!$('home').hidden) Home.load(true);
    if (why) { if (Chat.login) Chat.note(why).classList.add('err'); else UI.toast(why); }
  },
  signOut() {
    const token = this.acct?.token;
    if (token) this.post('https://id.twitch.tv/oauth2/revoke', { client_id: TV_CID, token }).catch(() => {});
    this.out();
  },

  async gql(body) {
    const send = t => fetch('https://gql.twitch.tv/gql', { method: 'POST', headers: { 'Client-ID': TV_CID, Authorization: 'OAuth ' + t, 'Content-Type': 'application/json', 'X-Device-Id': DEVICE }, body: JSON.stringify(body) });
    let r = await send(await this.token());
    if (r.status === 401 && this.acct?.refresh) { await this.renew(); if (this.acct) r = await send(this.acct.token); }
    return r.json();
  },
  async helix(path, init = {}) {
    const t = await this.token();
    return fetch('https://api.twitch.tv/helix' + path, { ...init, headers: { 'Client-Id': TV_CID, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' } });
  },
  async helixAll(path, field) {   // every page of a list
    const out = [];
    let after = '';
    for (let i = 0; i < 60; i++) {
      const r = await this.helix(`${path}&first=100${after ? '&after=' + after : ''}`);
      if (!r.ok) throw new Error(`Helix ${r.status}`);
      const j = await r.json();
      for (const x of j.data || []) out.push(field(x));
      after = j.pagination?.cursor || '';
      if (!after) break;
    }
    return out;
  },

  // Keeps your lists current: all of them on launch, then each at its own pace.
  async sync(force) {
    if (!this.acct) return;
    const due = (k, ms) => force || !this.at[k] || Date.now() - this.at[k] > ms;
    const jobs = [];
    if (due('profile', 216e5)) jobs.push(this.loadProfile());
    if (due('follows', 3e5)) jobs.push(this.loadFollows());
    if (due('blocks', 36e5)) jobs.push(this.loadBlocks());
    if (due('emotes', 216e5)) jobs.push(this.loadEmotes());
    await Promise.allSettled(jobs);
  },
  async loadProfile() {
    this.at.profile = Date.now();
    const u = (await this.gql({ query: 'query { currentUser { login displayName profileImageURL(width: 70) } }' }))?.data?.currentUser;
    if (u && this.acct) this.save({ ...this.acct, name: u.displayName || u.login, pic: u.profileImageURL });
  },
  async loadFollows() {
    this.at.follows = Date.now();
    const me = this.acct?.id, before = (this.follows || []).join();
    let list = null;
    try {
      const logins = [];
      let cursor = null;
      for (let i = 0; i < 30; i++) {
        const j = await this.gql({ operationName: 'ChannelFollows', variables: { limit: 100, order: 'DESC', cursor },
          extensions: { persistedQuery: { version: 1, sha256Hash: 'eecf815273d3d949e5cf0085cc5084cd8a1b5b7b6f7990cf43cb0beadf546907' } } });
        const f = j?.data?.user?.follows;
        if (!f) throw new Error(j?.errors?.[0]?.message || 'no follow list');
        logins.push(...f.edges.map(e => e.node.login));
        cursor = f.pageInfo?.hasNextPage ? f.edges[f.edges.length - 1]?.cursor : null;
        if (!cursor) break;
      }
      list = logins; this.notes.follows = null;
    } catch (e) {
      try { list = await this.helixAll(`/channels/followed?user_id=${me}`, x => x.broadcaster_login); this.notes.follows = null; }
      catch (e2) { this.notes.follows = `${e.message}; ${e2.message}`; }
    }
    if (this.acct?.id !== me) return;   // signed out meanwhile
    if (list) this.follows = list;
    store.set('follows', this.follows);
    UI.owner();
    if ((this.follows || []).join() !== before && !$('home').hidden) Home.load(true);
  },
  async loadBlocks() {   // Twitch's own query stops at 1,000; the API pages through the rest
    this.at.blocks = Date.now();
    const me = this.acct?.id, ids = new Set();
    let sure = false;   // an empty list is only believed from the API
    try {
      const list = (await this.gql({ query: 'query { currentUser { blockedUsers { id } } }' }))?.data?.currentUser?.blockedUsers;
      for (const u of list || []) ids.add(u.id);
      sure = ids.size > 0 && ids.size < 1000;
    } catch {}
    if (!sure) {
      try { for (const id of await this.helixAll(`/users/blocks?broadcaster_id=${me}`, x => x.user_id)) ids.add(id); sure = true; }
      catch (e) { if (!ids.size) this.notes.blocks = e.message; }
    }
    if ((sure || ids.size) && this.acct?.id === me) { this.blocks = ids; this.notes.blocks = null; store.set('blocks', [...ids]); }
  },
  async loadEmotes() {
    this.at.emotes = Date.now();
    const me = this.acct?.id;
    try {
      const sets = (await this.gql({ query: 'query { currentUser { emoteSets { owner { login } emotes { id token } } } }' }))?.data?.currentUser?.emoteSets;
      if (!sets) throw new Error('no emote sets');
      if (this.acct?.id !== me) return;
      const out = new Map();
      for (const s of sets) for (const e of s.emotes || []) if (/^\w+$/.test(e.token)) out.set(e.token, { name: e.token, url: emoteUrl(e.id), owner: s.owner?.login || '' });
      this.emotes = [...out.values()];
      this.notes.emotes = null;
      store.set('myEmotes', this.emotes);
    } catch (e) { this.notes.emotes = e.message; }
  },

  following(login) { return (this.follows || FOLLOWS).includes(login); },
  async setFollow(u, on) {
    const j = await this.gql(on
      ? { query: 'mutation($i: FollowUserInput!) { followUser(input: $i) { follow { user { id } } error { code } } }', variables: { i: { targetID: u.id, disableNotifications: false } } }
      : { query: 'mutation($i: UnfollowUserInput!) { unfollowUser(input: $i) { follow { user { id } } } }', variables: { i: { targetID: u.id } } });
    if (j?.errors?.length || j?.data?.followUser?.error) throw new Error(j.errors?.[0]?.message || j.data.followUser.error.code);
    this.follows = on ? [u.login, ...(this.follows || FOLLOWS).filter(x => x !== u.login)] : (this.follows || FOLLOWS).filter(x => x !== u.login);
    store.set('follows', this.follows);
    Home.at = 0;
  },
  async block(uid) {
    let ok = false;
    try { ok = (await this.helix(`/users/blocks?target_user_id=${uid}&source_context=chat`, { method: 'PUT' })).ok; } catch {}
    if (!ok) {
      const j = await this.gql({ query: 'mutation($input: BlockUserInput!) { blockUser(input: $input) { targetUser { login } } }', variables: { input: { targetUserID: uid, sourceContext: 'CHAT' } } }).catch(() => null);
      ok = !!j?.data?.blockUser && !j.errors?.length;
    }
    if (!ok) return false;
    this.blocks.add(uid);
    store.set('blocks', [...this.blocks]);
    Chat.box.querySelectorAll(`[data-u="${CSS.escape(uid)}"]`).forEach(n => n.remove());
    Chat.queue = Chat.queue.filter(q => q.m.tags['user-id'] !== uid);
    return true;
  },
  // A sub-only stream, or an ad break Turbo skips: Twitch decides by account, so this asks as you.
  async streamToken(login) {
    if (!this.acct) return null;
    try {
      const j = await this.gql({ query: 'query($l: String!) { streamPlaybackAccessToken(channelName: $l, params: { platform: "web", playerBackend: "mediaplayer", playerType: "site" }) { value signature authorization { isForbidden forbiddenReasonCode } } }', variables: { l: login } });
      return j?.data?.streamPlaybackAccessToken || null;
    } catch { return null; }
  },
};

// The code screen. Twitch keeps the code valid for half an hour; the page asks every few seconds whether it's been approved.
const SignIn = {
  flow: null,
  async start() {
    this.flow = null;
    Sheet.show(body => this.draw(body));
    try {
      const r = await Me.post('https://id.twitch.tv/oauth2/device', { client_id: TV_CID, scopes: SCOPES });
      const j = await r.json();
      if (!r.ok) throw new Error(j.message || `Twitch answered ${r.status}`);
      this.flow = { device: j.device_code, code: j.user_code, every: (j.interval || 5) * 1000, until: Date.now() + (j.expires_in || 1800) * 1000 };
      this.wait();
    } catch (e) { this.flow = { error: e.message }; }
    if ($('sheet').hidden) return;
    Sheet.render();
  },
  draw(body) {
    body.append(el('h3', null, 'Sign in with Twitch'));
    const f = this.flow;
    if (!f) return body.append(el('p', 'sgn', 'Asking Twitch for a code…'));
    if (f.error) {
      body.append(el('p', 'sgn', `Couldn’t start: ${f.error}`));
      const b = el('button', 'btn pri wide', 'Try again'); b.type = 'button'; b.onclick = () => this.start(); body.append(b);
      return;
    }
    const code = el('button', 'code', f.code); code.type = 'button'; code.setAttribute('aria-label', 'Copy the code');
    code.onclick = () => { navigator.clipboard?.writeText(f.code).then(() => UI.toast('Code copied')).catch(() => {}); };
    const go = el('a', 'btn pri wide', 'Approve on Twitch');
    go.href = `https://www.twitch.tv/activate?device-code=${encodeURIComponent(f.code)}`; go.target = '_blank'; go.rel = 'noopener';
    body.append(code, go, el('p', 'sgn', 'Or enter the code at twitch.tv/activate on any device that’s signed in. This screen moves on by itself once you’ve approved it.'));
    body.append(el('p', 'sgn dim', 'Lets you send chat, keeps your follow list in sync, hides chatters you’ve blocked, and adds a follow button. Watching stays anonymous.'));
  },
  wait() {
    const f = this.flow;
    clearTimeout(this.timer);
    if (f?.device) this.timer = setTimeout(() => this.poll(f), f.every);
  },
  async poll(f) {
    if (f !== this.flow || $('sheet').hidden) return;
    if (Date.now() > f.until) return this.start();
    try {
      const r = await Me.post('https://id.twitch.tv/oauth2/token', { client_id: TV_CID, device_code: f.device, grant_type: 'urn:ietf:params:oauth:grant-type:device_code', scopes: SCOPES });
      const j = await r.json().catch(() => ({}));
      if (f !== this.flow) return;
      if (r.ok && j.access_token) {
        await Me.accept(j);
        this.flow = null;
        Sheet.close();
        UI.toast(`Signed in as ${Me.acct.login}`);
        Talk.show();
        await Me.sync(true);
        if (!$('home').hidden) Home.load(true);
        return;
      }
      if (/invalid device code|expired/i.test(j.message || '')) return this.start();
    } catch {}
    this.wait();
  },
  cancel() { clearTimeout(this.timer); this.flow = null; },
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && SignIn.flow?.device) SignIn.poll(SignIn.flow); });   // back from approving it

// ── sending chat ────────────────────────────────────
// The API says outright whether a message went out and why not, so it goes first. If it turns this
// client away, chat's own socket does the job: a second connection used only for sending, while the
// messages you read (your own included) keep coming through the anonymous one.
const atName = (login, name) => '@' + (/^[\x20-\x7e]+$/.test(name) ? name : login);   // Twitch only links a mention by a name in plain letters
const Talk = {
  busy: false, tx: $('sayTx'), go: $('sayGo'), reply: null,
  irc: null, ircOk: false, ircRx: 0, ircQ: [], ircWait: null, useIrc: false,

  show() {
    const me = !!Me.acct;
    $('paneChat').classList.toggle('talk', !!Chat.login);
    this.tx.hidden = this.go.hidden = $('bEmote').hidden = !me;
    $('signin').hidden = me;
    this.go.disabled = this.busy || !this.tx.value.trim();
    if (!me || !Chat.login) { this.setReply(null); $('ac').hidden = true; }
    this.hint();
  },
  hint() {
    const r = Chat.room, bits = [];
    if (r['subs-only'] === '1') bits.push('subscribers only');
    if (r['emote-only'] === '1') bits.push('emotes only');
    if (r['followers-only'] !== undefined && +r['followers-only'] >= 0) bits.push('followers only');
    if (+r.slow > 0) bits.push(`slow mode ${r.slow} s`);
    this.tx.placeholder = bits.length ? bits.join(' · ') : 'Send a message';
  },
  setReply(r) {
    this.reply = r;
    $('rpb').hidden = !r;
    if (r) $('rpbT').textContent = `Replying to ${r.name}`;
  },
  insert(word) {
    const v = this.tx.value;
    this.tx.value = (v && !/\s$/.test(v) ? v + ' ' : v) + word + ' ';
    this.show();
  },

  // Finishes the word being typed: @names from who's been talking, anything else from the emotes.
  complete() {
    const box = $('ac'), m = this.tx.value.match(/(?:^|\s)(@?)([\w-]{2,})$/);
    box.textContent = '';
    box.hidden = true;
    if (!m) return;
    const low = m[2].toLowerCase(), hits = [];
    if (m[1]) { for (const [l, n] of [...Chat.names].reverse()) if (l.startsWith(low)) hits.push({ word: atName(l, n) }); }
    else for (const e of [...Chat.chanEmotes, ...Me.emotes, ...Chat.globalEmotes]) if (e.name.toLowerCase().startsWith(low)) hits.push({ word: e.name, url: e.url });
    for (const x of hits.slice(0, 16)) {
      const b = el('button'); b.type = 'button'; b.dataset.w = x.word;
      if (x.url) { const i = pic(x.url, 'em'); i.alt = ''; b.append(i); }
      b.append(x.word);
      box.append(b);
    }
    box.hidden = !hits.length;
  },

  async send() {
    const text = this.tx.value.trim(), room = Chat.uid, login = Chat.login, reply = this.reply?.id;
    if (!text || !Me.acct || !room || this.busy) return;
    this.busy = true; this.show();
    const res = (!this.useIrc && !text.startsWith('/') && await this.viaApi(text, room, reply)) || await this.viaIrc(text, reply, login);
    this.busy = false;
    if (res.ok) {
      if (this.tx.value.trim() === text) this.tx.value = '';
      this.setReply(null);
      $('ac').hidden = true;
      Chat.stick = true; Chat.box.scrollTop = Chat.box.scrollHeight; $('more').hidden = true;
    } else Chat.note('Not sent: ' + res.why).classList.add('err');
    this.show();
  },
  async viaApi(text, room, reply) {   // null means try the socket
    try {
      const r = await Me.helix('/chat/messages', { method: 'POST',
        body: JSON.stringify({ broadcaster_id: room, sender_id: Me.acct.id, message: text, ...(reply ? { reply_parent_message_id: reply } : {}) }) });
      const j = await r.json().catch(() => null), d = j?.data?.[0];
      if (r.ok) return d?.is_sent ? { ok: true } : { ok: false, why: d?.drop_reason?.message || 'Twitch dropped it' };
      if (r.status === 401 || r.status === 403) { this.useIrc = r.status === 401; return null; }
      return { ok: false, why: j?.message || `Twitch answered ${r.status}` };
    } catch { return { ok: false, why: 'couldn’t reach Twitch' }; }
  },
  viaIrc(text, reply, login) {
    return new Promise(resolve => {
      const done = r => { clearTimeout(t); if (this.ircWait === done) this.ircWait = null; resolve(r); };
      // Twitch answers a line it takes, chat's own socket sees it arrive, or Twitch says why not. Silence means it never left.
      const t = setTimeout(() => { this.ircDrop(); done({ ok: false, why: 'Twitch didn’t answer' }); }, 6000);
      this.ircWait = done;
      this.ircSend(`${reply ? `@reply-parent-msg-id=${reply} ` : ''}PRIVMSG #${login} :${text}`);
    });
  },
  ircDrop() {
    const ws = this.irc;
    this.irc = null; this.ircOk = false; this.ircQ = [];
    ws?.close();
  },
  async ircSend(line) {
    // iOS can kill a socket while the app is away without anyone hearing of it, so a quiet one isn't trusted
    if (this.ircOk && (this.irc?.readyState !== 1 || Date.now() - this.ircRx > 60e3)) this.ircDrop();
    if (this.ircOk) return this.irc.send(line);
    this.ircQ.push(line);
    if (this.irc) return;
    const token = await Me.token();
    if (!token) return;
    const ws = this.irc = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS oauth:' + token);
      ws.send('NICK ' + Me.acct?.login);
    };
    ws.onmessage = e => {
      this.ircRx = Date.now();
      for (const raw of e.data.split('\r\n')) {
        if (!raw) continue;
        const m = parseIrc(raw);
        if (m.cmd === 'PING') ws.send('PONG :' + (m.text || 'tmi.twitch.tv'));
        else if (m.cmd === 'RECONNECT') ws.close();
        else if (m.cmd === 'GLOBALUSERSTATE') { this.ircOk = true; for (const l of this.ircQ.splice(0)) ws.send(l); }
        else if (m.cmd === 'USERSTATE') this.ircWait?.({ ok: true });
        else if (m.cmd === 'NOTICE') {
          if (/authentication failed|improperly formatted/i.test(m.text || '')) { this.ircQ = []; this.ircWait?.({ ok: false, why: 'Twitch refused the sign-in' }); Me.check(); ws.close(); }
          else this.ircWait?.({ ok: /_(success|on|off)$/.test(m.tags['msg-id'] || ''), why: m.text });   // this socket joins no channel, so any notice is about what it just sent
        }
      }
    };
    ws.onclose = () => {
      if (this.irc !== ws) return;
      this.irc = null; this.ircOk = false; this.ircQ = [];
      this.ircWait?.({ ok: false, why: 'the connection to chat dropped' });
    };
  },
};
$('say').addEventListener('submit', e => { e.preventDefault(); Talk.send(); });
Talk.tx.addEventListener('input', () => { Talk.show(); Talk.complete(); });
for (const n of [Talk.go, $('ac'), $('bEmote'), $('rpbX')]) n.addEventListener('mousedown', e => e.preventDefault());   // tapping these leaves the keyboard up
$('signin').onclick = () => SignIn.start();

$('ac').addEventListener('click', e => {

  $('ac').hidden = true;

});

// The emote picker, above the box. Picking one leaves the keyboard down, so several in a row is one tap each.

    section(name, Chat.chanEmotes);
    section('Your Twitch emotes', mine);
    section('Global', Chat.globalEmotes);
    if (!box.children.length) box.append(el('p', 'note', 'No emotes match.'));
  },
};
$('bEmote').onclick = () => Picker.show(!Picker.on);

  },

// iPhone's keyboard covers the page instead of shrinking it, and slides the page up to keep the box

function hud(on) {
  stage.classList.toggle('ui', on);
  clearTimeout(hudTimer);
  if (on) hudTimer = setTimeout(() => { const v = P.active(); if (v && !v.paused && $('sheet').hidden) stage.classList.remove('ui'); }, 3500);
}
let lastTap = 0;
stage.addEventListener('click', e => {
  if (e.target.closest('.msgbox')) return;
  if (e.target.closest('button,a,input')) return hud(true);
  const now = performance.now();
  if (now - lastTap < 300) {   // a double tap: fullscreen, without the controls the first tap brought up
    lastTap = 0;
    if (!stage.classList.contains('vod')) { $('bFull').click(); hud(false); }
    return;
  }
  lastTap = now;
  hud(!stage.classList.contains('ui'));
});
stage.addEventListener('mousemove', () => hud(true));

function togglePlay() {
  const v = P.active();
  if (!v) return;
  if (v.paused) {
    if (P.feed === 'live') P.toLiveEdge(); else if (P.feed === 'cdn') P.cdnSeek();
    P.userPaused = false;
    P.play(v);
  } else { P.userPaused = true; v.pause(); }   // a pause you chose: leaving the app won't start the sound
  hud(true);
}
$('bPlay').onclick = togglePlay;
$('bigPlay').onclick = () => { UI.big(false); unlock(); P.userPaused = false; P.play(P.active() || vL); };
$('bMute').onclick = () => { unlock(); Sound.set(!Sound.muted); };
$('vol').addEventListener('input', e => { Sound.setLevel(+e.target.value, true); hud(true); });
$('unmute').onclick = e => { e.stopPropagation(); unlock(); Sound.set(false); P.play(P.active()); };
$('bBack').onclick = $('bBack2').onclick = () => back();
$('bFollow').onclick = async () => {
  const u = UI.chan, on = !Me.following(u?.login);
  if (!u) return;
  $('bFollow').disabled = true;
  try { await Me.setFollow(u, on); UI.toast(on ? `Following ${u.displayName}` : `Unfollowed ${u.displayName}`); }
  catch (e) { UI.toast(`Twitch didn’t take it (${e.message})`); }
  $('bFollow').disabled = false;
  UI.owner();
};
$('watch').classList.toggle('nochat', !store.get('sideChat', false));   // side chat: hidden until you show it, then as you left it

$('bFull').onclick = () => {
  if ($('watch').classList.contains('full')) return UI.fill(false);

  if (stage.requestFullscreen) stage.requestFullscreen().catch(() => UI.fill(true));
  else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('sheet').hidden) return Sheet.close();
  if ($('watch').hidden || e.target.closest('input') || e.metaKey || e.ctrlKey) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
