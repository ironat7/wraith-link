    return !!this.rend;
  },

  // The CDN's copy wouldn't load, or stopped.
  cdnFailed() {
    if (this.cover) {
      if (this.nextRendition()) return;
      this.uncover(); UI.spin(false); UI.banner();
      return;
    }
    if (this.feed !== 'cdn' || BG.on) return;   // while away the sound does the asking, and coming back loads the picture again
    const again = () => askAgain(vC, () => { if (!BG.on) this.playCdn({ reload: true }); });
    this.noteErr({ details: `cdn ${this.cdnRendition()} ${vC.error?.code ?? ''}`.trim() });
    if (!navigator.onLine) { UI.spin(true); return again(); }   // no network: it says nothing about the copy, so no going down the names
    // A copy that has played hasn't gone anywhere: a network or player hiccup, which it can wait out.
    if (this.played === vC.dataset.url) {

    if (!(Date.now() / 1000 - this.start > 180) && this.asks++ < 2) return again();

  },

  nextVodSource() {
    const u = this.vodSrcs?.shift();
    if (!u) return false;
    if (vC.currentTime > 1) this.vodAt = vC.currentTime;   // the last one got this far
    revoke([vC.dataset.url]);
    vC.dataset.url = u; vC.src = u;
    this.asks = 0;
    this.play(vC);
    return true;
  },

  // The video's playlist wouldn't load, or playing it stopped.
  vodFailed() {
    // One that has played gets a couple of chances to pick up where it was, in case that's a hiccup. It may be a
    // file the CDN doesn't have, so not many: the next one on the list starts from there too. A hiccup long after the last one
    // gets its own couple, or hours of a long video would use them up and move on to a copy that can't play its muted parts.
    if (this.played === vC.dataset.url && Date.now() - this.failedAt > 120e3) this.asks = 0;
    this.failedAt = Date.now();
    if (this.played === vC.dataset.url && this.asks++ < 2) {
      const url = vC.dataset.url;
      if (vC.currentTime > 1) this.vodAt = vC.currentTime;
      UI.spin(true);
      return askAgain(vC, () => { vC.src = url; this.play(vC); });

    if (this.nextVodSource()) return;
    const id = this.vod.id;
    if (cdnLive) UI.msg(null, 'The video wouldn’t play', 'Twitch’s CDN refused the playlist.', () => this.openVod(id));

  },

  stopCdn() {
    if (!vC.dataset.url) return;
    revoke([vC.dataset.url]); revoke(this.vodSrcs);

    vC.pausing = !vC.paused;   // the page's own doing, unlike a pause from outside (see play)
    vC.pause(); vC.removeAttribute('src'); delete vC.dataset.url; vC.load();
  },

  // To where the CDN feed should be: behind the clock by its target, and a little short of the copy's end. Past its first
  // load it only ever moves on, and by enough to be worth it: a copy with gaps in it stays behind the clock for good, and
  // going back to its end every time that's noticed plays the same second over and over.
  cdnSeek() {
    if (!vC.seekable.length) return;
    const to = this.cdnSpot(vC);
    if (to !== null && (this.seekPending || to > vC.currentTime + 3)) { vC.currentTime = to; this.sought = Date.now(); }
    this.seekPending = false;
  },
  cdnSpot(m) {   // for the picture's copy or the sound's, which run on the same clock

  toLiveEdge() {

  },

  show(which) {

    leaveNative(out);
    out.pause();
    this.rate = 'normal';
    UI.feed();
    Pill.sync();
  },

  play(v) {
    if (!v || this.userPaused || BG.on) return;   // a pause you chose holds until you undo it, and the pictures stay out of the background sound
    // iOS won't start a picture out of sight, and its refusal isn't the autoplay rule's: taken for one, it left the picture muted on your
    // return, and then nothing to carry on the next time you left. Coming back starts it (wake).
    if (ios && document.hidden) { this.playBack = true; return; }
    // A stopped picture doesn't start itself with nobody here: something outside the page stopped it, likely another app taking the sound, or
    // it's been stopped a while with nobody touching the screen. On a page iOS keeps going where you can't see it, starting anyway is Wraith's
    // sound over whatever you're doing (Jerry, 2026-11-08: "It's just playing it in the background over a YouTube video. It just took it over.").
    // A tap or coming back plays it (Pages.see), and iOS playing again what it paused itself is iOS's to do. A restart with the picture going
    // a moment ago isn't held: that's a stream you're watching hiccuping, however long it's been since you touched the screen.
    if (v.paused && (this.taken || (Pages.idle() && this.stuck()))) { this.waitsForYou = true; UI.spin(false); UI.big(true); return; }

      v.muted = true; UI.unmute(true); Sound.icon(true);   // browsers still allow muted autoplay
      v.play().catch(() => UI.big(true));
    });
  },

  // Back in the app with no sound of its own going: a picture that should be playing, but that iOS wouldn't start out of sight, starts now.
  // One that was paused as you left stays as it was: iOS plays again what it paused itself.
  wake() {

  active() { return this.feed === 'live' ? vL : this.feed ? vC : null; },

  // Whether the picture is getting anywhere, for the screen lock: looked at once a second, and each time it plays. Only with a frame to
  // show: a start over, or a jump to the live edge with nothing loaded, moves the clock without getting anywhere, and on a dead network
  // the starts over would go on for as long as it's dead.

  stuck() { return Date.now() - this.ranAt > 60e3; },

  // a page iOS keeps out of sight while calling it visible (which is how a page nobody could see started Asmongold, 2026-11-05). Left

  nobodyHere() {

    Away.add(muted ? 'paused: muted, and untouched for 30 min' : 'paused: untouched for 4 hours');
    togglePlay();
    UI.big(true);
    UI.toast(muted ? 'Paused: it was muted, and nobody had touched the screen for 30 minutes' : 'Paused: nobody had touched the screen for 4 hours');
  },

  latency() {
    if (this.feed === 'live') {

      const d = this.hls?.playingDate;

  // Chat shows up as late as the picture: Twitch viewers sit ~2.5 s behind, so delay by the rest. A picture
  // that's paused, or held through an ad break, has no pace to keep. Kick's chat comes every 2 s (Chat.kickPoll):
  // held 3 s, its lines go up one by one, as they were said, rather than in lumps.
  chatDelay() {
    const least = this.src === 'kick' ? 3000 : 0;
    if (BG.back) { const l = BG.lag(); return Math.max(least, l == null ? 0 : Math.max(0, l - 2.5) * 1000); }   // what you hear is still the sound's
    const v = this.active();

  // Speed up a little when behind, slow down when the buffer runs thin. Discrete steps with
  // hysteresis: a continuously varying rate makes the audio pitch wander.
  tick() {

      if (!this.cap) UI.toast('Back to the quality you picked');

    // in one step, once it has gone a few seconds without choking.

  // What the picture's player loads follows the picture. Left alone, a paused live stream goes on loading as fast as a playing one: hls.js
  // has the picture jump ahead each time it falls too far behind, and fetches what's there. So loading stops after a few seconds paused,
  // or at once with the app away and the sound on its own player, so the relay isn't polled twice. The player itself stays as it is: taking
  // it apart on the way out reloads the video, which cancels what iOS's fullscreen player is waiting to hear (see checkFull), and a new
  // MediaSource on the way back looks to bring a reset from hls.js (two returns on the sheet, two mediaSourceRequiresReset, 2026-11-04).
  // Away with the sound on its own player, it stops at once, also under an ad break's cover (coming back starts live again); away with no
  // sound, nobody's waiting on it either (now).
  rest(now) {
    const h = this.hls;

    if (BG.on) { h.stopLoad(); if (this.feed === 'live') this.dropBuffer(); }   // nobody's looking, and iOS may as well have the memory

  },
  // Playing or coming back, it starts up again at the live edge, with nothing old to play first. A fresh playlist takes the relay most of a
  // second, and till then hls.js would fetch and play what's old: so on from where it was, by however long that's been.
  resume() {
    const h = this.hls;
    if (this.feed !== 'live' || !h?.levels.length || h.loadingEnabled || BG.on) return;
    this.resumedAt = performance.now();
    this.quietUntil = Date.now() + 6000;   // its own buffering isn't a bad connection
    this.dropBuffer();
    const at = vL.currentTime > 0 ? vL.currentTime + (this.resumedAt - this.pausedAt) / 1000 : -1;
    if (at > 0) vL.currentTime = at;
    h.once(window.Hls.Events.LEVEL_UPDATED, () => this.toLiveEdge());

  },
  dropBuffer() { this.hls.trigger(window.Hls.Events.BUFFER_FLUSHING, { startOffset: 0, endOffset: Infinity, type: null }); },

  // Slows down when the buffer runs thin, or when it starts closer than the target (no cushion).
  liveRate(lat, T, ahead) {
    const s = this.rate;
    if ((ahead < 0.5 && lat < T + 4) || lat < T - 0.5) return 'slow';
    if (s === 'slow') return (ahead > 1.2 || lat > T + 0.8) && lat >= T - 0.1 ? 'normal' : s;
    if (lat > T + 0.6) return ahead > 1 ? 'fast' : 'normal';   // however far behind, speeding up needs something to speed through
    return s === 'fast' && lat < T + 0.15 ? 'normal' : s;
  },

  // The CDN adds 10 s at a time, so what's loaded swings by that much whatever the speed, and catching up can only
  // use what's over one swing, or it runs out before the next ten arrive.
  cdnRate(lat, T, ahead) {
    const s = this.rate;
    if (ahead < 1) return 'slow';
    if (s === 'slow') return ahead > 3 ? 'normal' : s;
    if (ahead > 13 && lat > T + 1.2) return 'fast';
    return s === 'fast' && (ahead < 11 || lat < T + 0.3) ? 'normal' : s;

  // The CDN's copy grows 10 s at a time, and iOS's player looks for more when it chooses. Both streams looked at on 2026-11-12 had a new
  // segment every 10.0 s, the copy's end 4.5 s behind the clock just after one and 14.5 s just before the next: at 16 s behind that's 1.5 s
  // in hand at most, less however long the player takes to hear of the segment and load it. Aimed there regardless, it ran dry, fell
  // behind, was sped up or moved on to the end again, and ran dry again (Jerry, that day: "The CDN is also pretty buggy"). So each time
  // it runs dry by itself it aims 4 s further back, for as long as this stream's open. A wait the page's own move caused doesn't count.
  noteDry() {
    const now = Date.now();
    if (this.feed !== 'cdn' || !this.started || vC.seeking || this.seekPending || vC.currentTime < 3 || now - this.sought < 8000 || now - this.cdnDry < 8000) return;
    this.cdnDry = now;
    this.cdnT = Math.min(TARGET.cdnMax, this.cdnT + 4);
    this.noteErr({ details: 'cdn ran dry' });
  },

  noteErr(d, where = '') {   // routine stall notices, the page's own aborts and cut-out ads left out
    if (/^(buffer(StalledError|NudgeOnStall|SeekOverHole)|aborted|fragGap)$/.test(d.details)) return;
    const k = where + d.details + (d.fatal ? ' (fatal)' : '');
    this.errs[k] = (this.errs[k] || 0) + 1;
  },

  // The share of frames dropped over the last half minute or so, from counts kept every 5 s while it plays (0 where the browser keeps none).
  frames(v, now) {

    if (f.length && q.totalVideoFrames < f.at(-1).n) f.length = 0;   // a new player counts from nothing

  },
  dropShare() {

    return (q.droppedVideoFrames - a.d) / (q.totalVideoFrames - a.n);
  },
  // A stall with seconds still loaded, on a picture that's been dropping frames, isn't the connection: the device can't decode this rendition

  // 6–8 s loaded, 11% of frames dropped, 41 a second on screen). What a slow connection gets made that worse: more cushion did nothing, 1.1× to
  // catch up asked for more frames still, and three minutes on it went back up to the rendition that had just failed. So two of those within
  // a minute rule that rendition out, and all as heavy or heavier, on every stream until the page reloads or a quality is picked; the switch
  // is at once, since what's loaded is what it can't play; and nothing plays fast (tick). Both signs are needed, so a phone's odd stall with
  // a full buffer, which drops no frames, stays what it was.
  tooMuch(now) {

    if (share < 0.03) return false;
    this.chokedAt = now;
    this.choked = this.choked.filter(t => now - t < 60e3).concat(now);
    const g = this.groups.find(x => x.i === (this.hls.currentLevel >= 0 ? this.hls.currentLevel : this.hls.loadLevel));
    if (this.choked.length < 2 || !g?.h || (this.heavy && weight(g) >= this.heavy.w)) return true;
    if (!this.ladder().some(x => weight(x) < weight(g))) return true;   // nothing lighter to go to
    const name = x => x.id === 'chunked' ? `${x.h}p${x.fps > 30 ? x.fps : ''}` : x.id;
    this.heavy = { w: weight(g), name: name(g) }; this.choked = []; this.fq = [];
    this.quietUntil = now + 6000;   // the switch's own buffering
    this.applyQuality();
    const to = this.q !== 'auto' && this.groups.find(x => x.i === this.levelIndex());
    UI.toast(to ? `Dropped to ${name(to)}: this device can’t keep up with ${name(g)}` : `Staying below ${name(g)}: this device can’t keep up with it`);
    Away.add(`couldn’t keep up with ${name(g)}, ${Math.round(share * 100)}% of frames dropped`);

  },

  noteStall() {
    if (this.feed !== 'live' || this.ad || !this.hls || Date.now() < this.quietUntil) return;
    const now = Date.now();
    if (this.tooMuch(now)) return;

    if (this.q === 'auto') return;

  async channel(uid) {

Chat.box.addEventListener('click', e => { const n = e.target.closest('.n'); if (n) Card.open(n.closest('.m')); });

window.addEventListener('online', () => Chat.wake());

new ResizeObserver(() => { chatResized = performance.now(); if (Chat.stick) Chat.box.scrollTop = Chat.box.scrollHeight; }).observe(Chat.box);
Chat.box.addEventListener('scroll', () => {
  const b = Chat.box, up = b.scrollTop < Chat.top, now = performance.now();
  Chat.top = b.scrollTop;
  if (now - chatResized < 250) return;
  if (b.scrollHeight - b.scrollTop - b.clientHeight < 40) { Chat.stick = true; $('more').hidden = true; }
  // Short of the end without moving up is only lines growing as their emotes load. Moved up, it's you only with a hand on it or just off

  // over it (Jerry, 2026-11-09: "you kind of have to drag the chat back down").

for (const ev of ['touchstart', 'touchmove', 'touchend', 'touchcancel', 'wheel', 'pointerdown']) Chat.box.addEventListener(ev, e => { chatHand = performance.now(); if (e.type === 'pointerdown') Chat.grab = true; }, { passive: true });
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, () => { if (Chat.grab) { Chat.grab = false; chatHand = performance.now(); } }, { passive: true });

// ── past broadcast chat ─────────────────────────────
// Twitch hands out a video's chat from a position, then page by page, about a minute of a quiet chat at a time.
const Replay = {
  id: null, q: [], seen: new Set(), at: 0, cursor: null, last: -1, busy: false, done: false, dead: false, run: 0, wait: 0,
  open(id) { this.close(); this.id = id; },
  reset() { this.run++; this.q = []; this.seen = new Set(); this.cursor = null; this.busy = this.done = false; this.wait = 0; },   // what a seek and closing both drop
  close() { this.reset(); this.id = null; this.last = -1; this.dead = false; },
  tick(t) {
    if (!this.id || this.dead) return;
    if (this.last < 0 || t < this.last - 2 || t > this.last + 8) {   // just started, or a seek
      this.reset(); this.at = Math.floor(t);
      Chat.clear();
    }
    this.last = t;
    let n = 0;
    while (n < this.q.length && this.q[n].contentOffsetSeconds <= t) n++;
    if (n && !document.hidden && Chat.box.offsetParent) Chat.append(this.q.splice(0, n).slice(-120).map(c => Chat.renderReplay(c)));
    else if (n > 400) this.q.splice(0, n - 120);
    if (!this.busy && !this.done && Date.now() >= this.wait && (!this.q.length || this.q[this.q.length - 1].contentOffsetSeconds < t + 15)) this.fetch();
  },
  async fetch() {
    this.busy = true;
    const run = this.run, vars = this.cursor ? { id: this.id, c: this.cursor } : { id: this.id, o: this.at };
    const head = this.cursor ? '$c: Cursor' : '$o: Int', from = this.cursor ? 'after: $c' : 'contentOffsetSeconds: $o';
    try {
      const d = await gql(`query($id: ID!, ${head}) { video(id: $id) { comments(${from}) { edges { cursor node { id contentOffsetSeconds commenter { id login displayName } message { fragments { text emote { emoteID } } userColor userBadges { setID version } } } } pageInfo { hasNextPage } } } }`, vars, TV_CID);
      if (run !== this.run) return;
      const c = d.video?.comments;
      if (!c) { this.dead = true; return void Chat.note('Twitch isn’t sharing this video’s chat.'); }
      for (const { node: n } of c.edges) {
        if (n.contentOffsetSeconds < this.last - 3 || this.seen.has(n.id) || Me.blocks.has(n.commenter?.id)) continue;
        this.seen.add(n.id);
        if (this.seen.size > 5000) this.seen = new Set([...this.seen].slice(-2000));   // hours of a busy chat would otherwise all stay
        this.q.push(n);
      }

  },
};

// ── your account ────────────────────────────────────
// Signing in is the device flow of Twitch's TV app: the page shows a code, you approve it on Twitch (on
// this device or any other), and the page gets a token. It needs no registered app and no trip away from
// the page, which matters in the Home Screen app, whose storage Safari doesn't share. Playback and
// reading chat stay anonymous; the account is for what only it can see or do. The token only goes to Twitch.
// Twitch won't renew that client's tokens without a secret only its own apps hold ("missing client secret"), so
// the token is all there is and losing a good one means a trip back to Twitch. Only Twitch saying no about the
// token itself, twice, ends a sign-in.
const SCOPES = 'channel_read chat:read chat:edit user_read user_follows_edit user_blocks_read user_blocks_edit user:write:chat user:read:follows user:read:blocked_users user:manage:blocked_users user:read:emotes';
const Me = {
  acct: store.get('me', null),         // { token, id, login, name, pic }
  follows: store.get('follows', null), // your follow list from Twitch, newest first
  blocks: new Set(store.get('blocks', [])),
  emotes: store.get('myEmotes', []),   // [{ name, url, owner, by, sub }]
  mentions: null,                      // matches your name in chat
  at: {}, notes: {},                   // when each list was last fetched; why one last failed, for the account sheet
  doubt: 0, checking: null,            // when Twitch first said no to this token; the check under way

  post(url, params) { return fetch(url, { method: 'POST', body: new URLSearchParams(params), signal: AbortSignal.timeout(15e3) }); },   // like gqlPost: one a dead connection holds would hold sending, the hourly check or the sign-in's wait for good

  validate(token) { return fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + token }, signal: AbortSignal.timeout(15e3) }); },

  async accept(j) {   // a first sign-in

    const again = () => { if (this.doubt) setTimeout(() => this.check(), 60e3); };

    this.at.blocks = Date.now();
    const me = this.acct?.id, ids = new Set();
    let sure = false, why = null;   // an empty list is only believed from the API, and one at the cap only adds to what you had
    try {
      const list = (await this.gql({ query: 'query { currentUser { blockedUsers { id } } }' }))?.data?.currentUser?.blockedUsers;
      for (const u of list || []) ids.add(u.id);
      sure = ids.size > 0 && ids.size < 1000;
    } catch {}
    if (!sure) {
      try { for (const id of await this.helixAll(`/users/blocks?broadcaster_id=${me}`, x => x.user_id)) ids.add(id); sure = true; }
      catch (e) { why = e.message; }
    }
    if (this.acct?.id !== me) return;
    if (!sure) for (const id of this.blocks) ids.add(id);
    this.blocks = ids; this.notes.blocks = why;
    store.set('blocks', [...ids]);
  },
  async loadEmotes() {
    this.at.emotes = Date.now();
    const me = this.acct?.id, out = new Map();
    const add = (name, id, owner, sub) => { if (/^\w+$/.test(name)) out.set(name, { name, url: emoteUrl(id), owner: owner?.login || '', by: owner?.displayName || owner?.login || '', sub }); };
    try {
      const sets = (await this.gql({ query: 'query { currentUser { emoteSets { owner { login displayName } emotes { id token type } } } }' }))?.data?.currentUser?.emoteSets;
      if (!sets?.length) throw new Error('no emote sets');
      for (const s of sets) for (const e of s.emotes || []) add(e.token, e.id, s.owner, e.type === 'SUBSCRIPTIONS');
    } catch (e) {
      try {
        const list = await this.helixAll(`/chat/emotes/user?user_id=${me}`, x => x);
        const ids = [...new Set(list.map(x => x.owner_id).filter(x => /^[1-9]\d*$/.test(x)))].slice(0, 100);
        const who = ids.length ? await gql('query($ids: [ID!]) { users(ids: $ids) { id login displayName } }', { ids }).catch(() => null) : null;
        const owners = new Map((who?.users || []).filter(Boolean).map(u => [u.id, u]));
        for (const x of list) add(x.name, x.id, owners.get(x.owner_id), x.emote_type === 'subscriptions');
      } catch (e2) { this.notes.emotes = `${e.message}; ${e2.message}`; return; }
    }
    if (this.acct?.id !== me) return;
    this.emotes = [...out.values()];
    this.notes.emotes = null;
    store.set('myEmotes', this.emotes);
    Picker.refresh();
  },

  following(login) { return (this.follows || FOLLOWS).includes(login); },
  async setFollow(u, on) {
    const j = await this.gql(on
      ? { query: 'mutation($i: FollowUserInput!) { followUser(input: $i) { follow { user { id } } error { code } } }', variables: { i: { targetID: u.id, disableNotifications: false } } }
      : { query: 'mutation($i: UnfollowUserInput!) { unfollowUser(input: $i) { follow { user { id } } } }', variables: { i: { targetID: u.id } } });
    const did = on ? j?.data?.followUser : j?.data?.unfollowUser;
    if (!did || did.error) throw new Error(j?.errors?.[0]?.message || did?.error?.code || j?.message || 'no answer');
    const rest = (this.follows || FOLLOWS).filter(x => x !== u.login);
    this.follows = on ? [u.login, ...rest] : rest;
    store.set('follows', this.follows);
    Home.at = 0;
  },
  async block(uid) {
    let ok = false;
    try { ok = (await this.helix(`/users/blocks?target_user_id=${uid}&source_context=chat`, { method: 'PUT' })).ok; } catch {}
    if (!ok) {
      const j = await this.gql({ query: 'mutation($input: BlockUserInput!) { blockUser(input: $input) { targetUser { login } } }', variables: { input: { targetUserID: uid, sourceContext: 'CHAT' } } }).catch(() => null);
      ok = !!j?.data?.blockUser && !j.errors?.length;
    }
    if (!ok) return false;
    this.blocks.add(uid);
    store.set('blocks', [...this.blocks]);
    Chat.box.querySelectorAll(`[data-u="${CSS.escape(uid)}"]`).forEach(n => n.remove());
    Chat.queue = Chat.queue.filter(q => q.m.tags['user-id'] !== uid);
    Replay.q = Replay.q.filter(c => c.commenter?.id !== uid);
    return true;
  },
  // A sub-only stream, or an ad break Turbo skips: Twitch decides by account, so this asks as you.
  async streamToken(login) {
    if (!this.acct) return null;
    try {
      const j = await this.gql({ query: TOKEN_QUERY, variables: { l: login, t: 'site' } });
      return j?.data?.streamPlaybackAccessToken || null;
    } catch { return null; }
  },
};

// The code screen. Twitch keeps the code valid for half an hour; the page asks every few seconds whether it's been approved.
const SignIn = {
  flow: null,
  async start() {
    this.flow = null;
    const fn = body => this.draw(body), gone = () => $('sheet').hidden || Sheet.fn !== fn;   // shut, or another sheet by now: a code left waiting would be asked after under it
    Sheet.show(fn);
    try {
      const r = await Me.post('https://id.twitch.tv/oauth2/device', { client_id: TV_CID, scopes: SCOPES });
      const j = await r.json();
      if (!r.ok) throw new Error(j.message || `Twitch answered ${r.status}`);
      if (gone()) return;
      this.flow = { device: j.device_code, code: j.user_code, every: (j.interval || 5) * 1000, until: Date.now() + (j.expires_in || 1800) * 1000 };
      this.wait();
    } catch (e) { if (gone()) return; this.flow = { error: e.message }; }
    Sheet.render();
  },
  draw(body) {
    body.append(el('h3', null, 'Sign in with Twitch'));
    const f = this.flow;
    if (!f) return body.append(el('p', 'sgn', 'Asking Twitch for a code…'));
    if (f.error || f.over) {
      body.append(el('p', 'sgn', f.error ? `Couldn’t start: ${f.error}` : 'That code ran out.'));
      const b = el('button', 'btn pri wide', f.error ? 'Try again' : 'Get a new code'); b.type = 'button'; b.onclick = () => this.start(); body.append(b);
      return;
    }
    const code = el('button', 'code', f.code); code.type = 'button'; code.setAttribute('aria-label', 'Copy the code');
    code.onclick = () => { navigator.clipboard?.writeText(f.code).then(() => UI.toast('Code copied')).catch(() => {}); };
    const go = el('a', 'btn pri wide', 'Approve on Twitch');
    go.href = `https://www.twitch.tv/activate?device-code=${encodeURIComponent(f.code)}`; go.target = '_blank'; go.rel = 'noopener';
    body.append(code, go, el('p', 'sgn', 'Or enter the code at twitch.tv/activate on any device that’s signed in. This screen moves on by itself once you’ve approved it.'));
    body.append(el('p', 'sgn dim', 'Lets you send chat, keeps your follow list in sync, hides chatters you’ve blocked, and adds a follow button. Watching stays anonymous.'));
  },
  wait() {
    const f = this.flow;
    clearTimeout(this.timer);
    if (f?.device) this.timer = setTimeout(() => this.poll(f), f.every);
  },
  async poll(f) {
    // coming back from approving it asks at the same moment as the timer, and a code only works once. Out of sight it waits, as coming back asks
    if (f !== this.flow || $('sheet').hidden || f.polling || document.hidden) return;
    if (Date.now() > f.until) return this.again();
    clearTimeout(this.timer);
    f.polling = true;
    let spent = false;
    try {
      const r = await Me.post('https://id.twitch.tv/oauth2/token', { client_id: TV_CID, device_code: f.device, grant_type: 'urn:ietf:params:oauth:grant-type:device_code', scopes: SCOPES });
      const j = await r.json().catch(() => ({}));
      if (f !== this.flow) return;
      if (r.ok && j.access_token) {
        spent = true; this.flow = null;
        await Me.accept(j);
        Sheet.close();
        UI.toast(`Signed in as ${Me.acct.login}`);
        Talk.show();
        await Me.sync(true);
        if (!$('home').hidden) Home.load(true);
        if (P.subOnly && P.login) P.open(P.login);   // your account may be in
        return;
      }
      if (/invalid device code|expired/i.test(j.message || '')) return this.again();
    } catch (e) {
      if (spent) { this.flow = { error: e.message }; if (!$('sheet').hidden) Sheet.render(); return; }
    } finally { f.polling = false; }
    this.wait();
  },
  // A code that ran out gets a new one if someone's about to use it. A sheet left open with nobody there would ask Twitch every few
  // seconds for good, a new code every half hour.
  again() {
    if (Date.now() - Pages.seenAt < IDLE) return this.start();
    this.flow = { over: true };
    if (!$('sheet').hidden) Sheet.render();
  },
  cancel() { clearTimeout(this.timer); this.flow = null; },
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && SignIn.flow?.device) SignIn.poll(SignIn.flow); });   // back from approving it

// ── sending chat ────────────────────────────────────
// The API says outright whether a message went out and why not, so it goes first. If it turns this
// client away, chat's own socket does the job: a second connection used only for sending, while the
// messages you read (your own included) keep coming through the anonymous one.
const atName = (login, name) => '@' + (plain(name) ? name : login);   // Twitch only links a mention by a name in plain letters
const Talk = {
  busy: false, tx: $('sayTx'), go: $('sayGo'), reply: null, draftFor: null,
  irc: null, ircOk: false, ircRx: 0, ircQ: [], ircWait: null, useIrc: false,

  show() {
    const me = !!Me.acct, kick = !!Chat.kick;   // Kick's chat is to read only
    $('paneChat').classList.toggle('talk', !!Chat.login && !kick);
    this.tx.hidden = this.go.hidden = $('bEmote').hidden = !me || kick;
    $('signin').hidden = me || kick;
    this.go.disabled = this.busy || !this.tx.value.trim();
    if (!me || !Chat.login) { this.setReply(null); $('ac').hidden = true; }
    this.hint();
  },
  hint() {
    const r = Chat.room, bits = [];
    if (r['subs-only'] === '1') bits.push('subs only');
    if (r['emote-only'] === '1') bits.push('emotes only');
    if (r['followers-only'] !== undefined && +r['followers-only'] >= 0) bits.push('followers');
    if (+r.slow > 0) bits.push(`slow ${r.slow} s`);
    this.tx.placeholder = bits.length ? bits.join(' · ') : 'Send a message';
  },
  setReply(r) {
    this.reply = r;
    $('rpb').hidden = !r;
    if (r) $('rpbT').textContent = `Replying to ${r.name}`;
  },
  insert(word) {
    const v = this.tx.value;
    this.tx.value = (v && !/\s$/.test(v) ? v + ' ' : v) + word + ' ';
    $('ac').hidden = true;
    this.show();
  },

  // Finishes the word being typed: @names from who's been talking, anything else from the emotes.
  complete() {
    const box = $('ac'), m = this.tx.value.match(/(?:^|\s)(@?)([\w-]{2,})$/);
    box.textContent = '';
    box.hidden = true;
    if (!m) return;
    const low = m[2].toLowerCase(), hits = [];
    if (m[1]) { for (const [l, n] of [...Chat.names].reverse()) if (l.startsWith(low)) hits.push({ word: atName(l, n) }); }
    else for (const e of [...Chat.popular(), ...Me.emotes.filter(e => e.sub), ...Chat.chanEmotes, ...Me.emotes, ...Chat.globalEmotes]) if (e.name.toLowerCase().startsWith(low) && !unwanted(e.name) && !hits.some(h => h.word === e.name)) hits.push({ word: e.name, url: e.url });
    for (const x of hits.slice(0, 16)) {
      const b = el('button'); b.type = 'button'; b.dataset.w = x.word;
      if (x.url) { b.append(pic(x.url, 'em')); }
      b.append(x.word);
      box.append(b);
    }
    box.hidden = !hits.length;
  },

  async send() {
    const text = this.tx.value.trim(), room = Chat.uid, login = Chat.login, reply = this.reply?.id;
    if (!text || !Me.acct || !room || this.busy) return;
    this.busy = true; this.show();
    const res = (!this.useIrc && !text.startsWith('/') && await this.viaApi(text, room, reply)) || await this.viaIrc(text, reply, login);
    this.busy = false;
    if (Chat.login !== login) {   // you've moved on since: nothing here to touch
      if (!res.ok) UI.toast(`Not sent to ${login}: ${res.why}`);
    } else if (res.ok) {
      if (this.tx.value.trim() === text) this.tx.value = '';
      this.setReply(null);
      $('ac').hidden = true;
      Chat.follow();
    } else Chat.note('Not sent: ' + res.why).classList.add('err');
    this.show();
  },
  async viaApi(text, room, reply) {   // null means try the socket
    try {
      const r = await Me.helix('/chat/messages', { method: 'POST',
        body: JSON.stringify({ broadcaster_id: room, sender_id: Me.acct.id, message: text, ...(reply ? { reply_parent_message_id: reply } : {}) }) });
      const j = await r.json().catch(() => null), d = j?.data?.[0];
      if (r.ok) return d?.is_sent ? { ok: true } : { ok: false, why: d?.drop_reason?.message || 'Twitch dropped it' };
      if (r.status === 401 || r.status === 403) { this.useIrc = r.status === 401; return null; }
      return { ok: false, why: j?.message || `Twitch answered ${r.status}` };
    } catch { return { ok: false, why: 'couldn’t reach Twitch' }; }
  },
  viaIrc(text, reply, login) {
    return new Promise(resolve => {
      const done = r => { clearTimeout(t); if (this.ircWait === done) this.ircWait = null; resolve(r); };
      // Twitch answers a line it takes, chat's own socket sees it arrive, or Twitch says why not. Silence means it never left.
      const t = setTimeout(() => { this.ircDrop(); done({ ok: false, why: 'Twitch didn’t answer' }); }, 6000);
      this.ircWait = done;
      this.ircSend(`${reply ? `@reply-parent-msg-id=${reply} ` : ''}PRIVMSG #${login} :${text}`);
    });
  },
  ircDrop() {
    const ws = this.irc;
    this.irc = null; this.ircOk = false; this.ircQ = [];
    ws?.close();
  },
  async ircSend(line) {
    // iOS can kill a socket while the app is away without anyone hearing of it, so a quiet one isn't trusted
    if (this.ircOk && (this.irc?.readyState !== 1 || Date.now() - this.ircRx > 60e3)) this.ircDrop();
    if (this.ircOk) return this.irc.send(line);
    this.ircQ.push(line);
    if (this.irc) return;
    const token = Me.acct?.token;
    if (!token) return;
    const ws = this.irc = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS oauth:' + token);
      ws.send('NICK ' + Me.acct?.login);
    };
    ws.onmessage = e => {
      this.ircRx = Date.now();
      for (const raw of e.data.split('\r\n')) {
        if (!raw) continue;
        const m = parseIrc(raw);
        if (m.cmd === 'PING') ws.send('PONG :' + (m.text || 'tmi.twitch.tv'));
        else if (m.cmd === 'RECONNECT') ws.close();
        else if (m.cmd === 'GLOBALUSERSTATE') { this.ircOk = true; for (const l of this.ircQ.splice(0)) ws.send(l); }
        else if (m.cmd === 'USERSTATE') this.ircWait?.({ ok: true });
        else if (m.cmd === 'NOTICE') {
          if (/authentication failed|improperly formatted/i.test(m.text || '')) { this.ircQ = []; this.ircWait?.({ ok: false, why: 'Twitch refused the sign-in' }); Me.check(); ws.close(); }
          else this.ircWait?.({ ok: /_(success|on|off)$/.test(m.tags['msg-id'] || ''), why: m.text });   // this socket joins no channel, so any notice is about what it just sent
        }
      }
    };
    ws.onclose = () => {
      if (this.irc !== ws) return;
      this.irc = null; this.ircOk = false; this.ircQ = [];
      this.ircWait?.({ ok: false, why: 'the connection to chat dropped' });
    };
  },
};
$('say').addEventListener('submit', e => { e.preventDefault(); Talk.send(); });
Talk.tx.addEventListener('input', () => { Talk.show(); Talk.complete(); });
Talk.tx.addEventListener('focus', () => Talk.complete());
for (const n of [Talk.go, $('ac'), $('bEmote'), $('rpbX')]) n.addEventListener('mousedown', e => e.preventDefault());   // tapping these leaves the keyboard up
$('signin').onclick = () => SignIn.start();
$('rpbX').onclick = () => Talk.setReply(null);
$('ac').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  Talk.tx.value = Talk.tx.value.replace(/(@?[\w-]+)$/, '') + b.dataset.w + ' ';
  $('ac').hidden = true;
  Talk.show();
});

// The emote picker, above the box. Picking one leaves the keyboard down, so several in a row is one tap each.
const Picker = {
  on: false,
  show(on) {
    this.on = on;
    $('ep').hidden = !on;
    $('bEmote').classList.toggle('on', on);
    if (on) { Talk.tx.blur(); $('epq').value = ''; Chat.sample(); this.draw(); }
  },
  refresh() {   // something it draws from has arrived while it's open
    if (!this.on) return;
    const box = $('epl'), top = box.scrollTop;
    this.draw();
    box.scrollTop = top;
  },
  draw() {
    const box = $('epl'), term = $('epq').value.trim().toLowerCase(), shown = new Set();
    box.textContent = '';
    const section = (title, list) => {
      const items = list.filter(e => !shown.has(e.name) && !unwanted(e.name) && (!term || e.name.toLowerCase().includes(term)));
      if (!items.length) return;
      box.append(el('h4', null, title));
      const g = el('div', 'epg');
      for (const e of items.slice(0, 400)) {
        shown.add(e.name);
        const b = el('button'), i = pic(e.url, null, true);
        b.type = 'button'; b.dataset.w = e.name; b.title = e.name;
        i.alt = e.name;
        b.append(i); g.append(b);
      }
      box.append(g);
    };
    // What people here use, short enough that your subs show under it, then yours from this channel and your other subs.
    // Only a search goes further.
    const here = Me.emotes.filter(e => e.owner === Chat.login), subs = new Map();
    for (const e of Me.emotes) if (e.sub && e.owner !== Chat.login) subs.set(e.by, [...(subs.get(e.by) || []), e]);
    section('Used in this chat', Chat.popular());
    section(P.user?.displayName || 'This channel', term ? [...here, ...Chat.chanEmotes] : here);
    for (const by of [...subs.keys()].sort((a, b) => a.localeCompare(b))) section(by || 'Your subs', subs.get(by));
    if (term) { section('Your other emotes', Me.emotes); section('Global', Chat.globalEmotes); }
    if (!box.children.length) box.append(el('p', 'note', term ? 'No emotes match.' : 'Nobody here has used an emote lately. Search finds the rest.'));
  },
};
$('bEmote').onclick = () => Picker.show(!Picker.on);
$('epq').addEventListener('input', () => Picker.draw());
$('epl').addEventListener('click', e => { const b = e.target.closest('button'); if (b) Talk.insert(b.dataset.w); });

// A chatter's card: tap their name in chat.
const Card = {
  async open(line) {
    const login = line?.dataset.l, uid = line?.dataset.u, msg = line?.dataset.id;
    if (!login || uid?.startsWith('kick')) return;   // someone on Kick's chat has no Twitch card
    const name = line.querySelector('.n')?.textContent || login;
    let u = null;
    Sheet.show(body => {
      const head = el('div', 'card');
      head.append(pic(u?.profileImageURL, 'cav'));
      const meta = el('div', 'meta');
      meta.append(el('div', 'nm', name));
      if (u) meta.append(el('div', 'gm', [u.stream ? 'Live now' : null, u.followers ? `${count(u.followers.totalCount)} followers` : null, u.createdAt ? `joined ${new Date(u.createdAt).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })}` : null].filter(Boolean).join(' · ')));
      head.append(meta);
      body.append(head);
      const said = [...Chat.box.querySelectorAll(`[data-l="${CSS.escape(login)}"] .tx`)].slice(-4);
      if (said.length) { const box = el('div', 'said'); for (const s of said) box.append(el('div', null, s.textContent)); body.append(box); }
      const items = [];
      if (Me.acct && Chat.login) {
        if (msg) items.push({ label: 'Reply', pick: () => { Talk.setReply({ id: msg, name }); Sheet.close(); Talk.tx.focus(); } });
        items.push({ label: 'Mention', pick: () => { Talk.insert(atName(login, name)); Sheet.close(); Talk.tx.focus(); } });
      }
      items.push({ label: 'Go to their channel', pick: () => go(`?c=${login}`, true) });
      if (Me.acct && uid && uid !== Me.acct.id) items.push({ label: 'Block', desc: 'Hides them everywhere on Twitch, here included.', pick: async () => {
        Sheet.close();
        UI.toast(await Me.block(uid) ? `Blocked ${name}` : 'Twitch didn’t take the block');
      } });
      Sheet.group(body, null, items);
    });
    try { u = (await gql('query($l: String!) { user(login: $l) { createdAt profileImageURL(width: 70) followers { totalCount } stream { id } } }', { l: login })).user; if (!$('sheet').hidden) Sheet.render(); } catch {}
  },
};

// iPhone's keyboard covers the page instead of shrinking it, and slides the page up to keep the box
// in view, which takes the picture off the top. While it's up, the watch screen fits the part of the
// screen above it, the channel row and tabs making room for chat.
const vv = window.visualViewport;
function fitKeyboard() {
  const w = $('watch'), at = document.activeElement, up = !!vv && (at === Talk.tx || at === $('epq')) && vv.scale < 1.05
    && vv.height > 0 && vv.height < document.documentElement.clientHeight - 80;   // the closed screen can say -33554432 after a trip to the background (coder/xum#8042)
  w.classList.toggle('kb', up);
  w.style.height = up ? vv.height + 'px' : '';
  w.style.transform = up && vv.offsetTop ? `translateY(${vv.offsetTop}px)` : '';
  if (up && Picker.on && at === Talk.tx) Picker.show(false);
  if (at !== Talk.tx) $('ac').hidden = true;   // gone with the keyboard: they'd sit on the channel row, and the way back
}
vv?.addEventListener('resize', fitKeyboard);
vv?.addEventListener('scroll', fitKeyboard);
document.addEventListener('visibilitychange', fitKeyboard);   // the keyboard can go while you're away, with no word of it
for (const n of [Talk.tx, $('epq')]) n.addEventListener('blur', () => setTimeout(fitKeyboard, 100));
$('watch').addEventListener('click', e => { if (!e.target.closest('#say,#ac,#ep,#rpb')) { Talk.tx.blur(); $('epq').blur(); } });   // a tap elsewhere puts the keyboard away

// ── videos tab ──────────────────────────────────────
const Vods = {
  login: null, loaded: null,
  channel(login) { this.login = login; this.loaded = null; $('vods').textContent = ''; if (!$('paneVods').hidden) this.load(); },
  async load() {
    const login = this.login, box = $('vods');
    if (!login || this.loaded === login) return;
    this.loaded = login;
    box.textContent = '';
    box.append(el('p', 'note', 'Loading…'));
    try {
      const d = await gql(`query($l: String!) { user(login: $l) { videos(first: 40, sort: TIME, type: ARCHIVE) { edges { node { id title lengthSeconds createdAt status previewThumbnailURL(width: 320, height: 180) resourceRestriction { type } game { displayName } } } } } }`, { l: login });
      if (this.login !== login) return;
      const vids = (d.user?.videos?.edges || []).map(e => e.node);
      box.textContent = '';
      if (!vids.length) return box.append(el('p', 'note', 'No past broadcasts. The channel may not save them.'));

  if (e.target.closest('button,a,input')) return hud(true);

function togglePlay() {
  const v = P.active();
  if (!v) return;
  P.pausedAway = false;
  if (BG.back) {   // the picture still on its way back in, with the sound going: that's a pause
    BG.carry = false; BG.stop(true);
    P.userPaused = true; v.pause(); UI.spin(false);
    if (Pill.hiding) v.muted = true;
    UI.playIcon(); hud(true);
    return;
  }
  if (v.paused) {
    // a player still loading jumps to the edge now; one rested after a long pause does that itself as it starts up again (resume)
    if (P.feed === 'live') { if (P.hls?.loadingEnabled) P.toLiveEdge(); } else if (P.feed === 'cdn') P.cdnSeek();
    P.userPaused = false;
    P.play(v);
  } else {   // a pause you chose: leaving the app won't start the sound
    P.userPaused = true; v.pause(); UI.spin(false);
    if (Pill.hiding) v.muted = true;   // a paused picture with sound is one WebKit would publish, pill and all; playing restores it
  }
  hud(true);
}

    more.type = 'button'; more.setAttribute('aria-expanded', String(!!this.details));
    more.insertAdjacentHTML('beforeend', icon('back'));
    more.onclick = () => { this.details = !this.details; more.classList.toggle('on', this.details); more.setAttribute('aria-expanded', String(this.details)); stats.hidden = !this.details; this.stats(); };
    stats.hidden = !this.details;
    body.append(more, stats);
    this.stats();
  },
  accountItems(body) {
    const me = Me.acct, s = store.get('signin', {});
    const when = t => new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const span = ms => ms > 1728e5 ? `${Math.round(ms / 864e5)} days` : `${(Math.max(ms, 0) / 36e5).toFixed(1)} hours`;
    if (!me) {
      this.group(body, 'Account', [{ label: 'Sign in with Twitch', desc: 'Send chat, your real follow list, hide chatters you’ve blocked.', pick: () => SignIn.start() }]);
      if (s.ended) body.append(el('div', 'stats', `Last sign-in ended ${when(s.ended)}: ${s.why}${s.since ? `, after ${span(s.ended - s.since)}` : ''}.`));
      return;
    }
    const name = me.name || me.login;
    const facts = [`${Home.roster().length} follows`, `${Me.blocks.size} blocked`, `${Me.emotes.filter(e => e.sub).length} sub emotes`].join(' · ');
    this.group(body, 'Account', [{ label: `Sign out ${name}`, desc: facts, pick: () => this.show(b => this.group(b, `Sign out ${name}?`, [
      { label: 'Sign out', pick: () => { this.close(); Me.signOut(); } },
      { label: 'Stay signed in', pick: () => this.close() },
    ])) }]);
    const life = [
      s.since && `Signed in ${when(s.since)}`,
      s.until === 0 ? 'Twitch gives it no end date' : s.until && `Twitch gives it another ${span(s.until - Date.now())}`,
      s.refused && `Twitch last refused it ${when(s.refused)}`,
    ].filter(Boolean).join(' · ');
    if (life) body.append(el('div', 'stats', life));
    const trouble = Object.entries(Me.notes).filter(([, v]) => v);
    if (trouble.length) { const t = el('div', 'stats'); for (const [k, v] of trouble) t.append(el('div', null, `${k}: ${v}`)); body.append(t); }
  },
  stats() {
    const s = $('sheetBody').querySelector('.stats:last-child');
    // nobody reads it shut, out of sight or with nobody about, and its look at a frame (look) would keep the picture's player going while away
    if (!s || s.hidden || !this.fn || !P.feed || document.hidden || Pages.idle()) return;
    const v = P.active(), l = P.latency(), lines = [];
    const lvl = P.hls?.levels?.[P.hls.currentLevel];
    lines.push(`Playing: ${P.cover ? 'ad-free feed (ad break)' : { live: 'low-latency feed', cdn: 'CDN feed', vod: 'past broadcast' }[P.feed]}`);
    if (l != null) lines.push(`Behind live: ${l.toFixed(1)} s${P.feed === 'live' ? ` (aiming for ${P.liveT} s)` : P.feed === 'cdn' ? ` (aiming for ${P.cdnT} s)` : ''}`);
    if (v && v.videoHeight) lines.push(`Picture: ${v.videoWidth}×${v.videoHeight}${lvl ? ` · ${(lvl.bitrate / 1e6).toFixed(1)} Mbps · ${lvl.details?.fragments?.[0]?.initSegment ? 'fMP4' : 'TS'}` : ''}${v.playbackRate !== 1 ? ` · speed ${v.playbackRate}×` : ''}`);
    if (v) lines.push(...this.look(v));
    if (P.cap) lines.push(`Held ${P.cap} step${P.cap > 1 ? 's' : ''} below your pick after buffering`);
    if (P.heavy) lines.push(`Staying below ${P.heavy.name}: this device couldn’t keep up with it (picking a quality tries it again)`);
    if (v) lines.push(`Buffered: ${bufAhead(v).toFixed(1)} s`);
    if (P.skipped) lines.push(`Ad breaks skipped: ${P.skipped}`);
    if (Quota.n) lines.push(`Relay today: ${Quota.n.toLocaleString()} of 20,000`);
    const errs = Object.entries(P.errs).sort((a, b) => b[1] - a[1]).slice(0, 4);
    if (errs.length) lines.push(`Hiccups: ${errs.map(([k, n]) => n > 1 ? `${k} ×${n}` : k).join(', ')}`);
    if (ios) lines.push(Awake.say());
    s.textContent = '';
    for (const x of lines) s.append(el('div', null, x));
    // what each page did about leaving, coming back and the screen, newest last, a line each
    const away = store.get('away', []).slice(-16);
    if (away.length) { const log = el('div', 'log'); log.append(el('div', null, 'Away: '), ...away.map(x => el('div', null, x))); s.append(log); }
  },
  // What the player says about the picture, so a screenshot with the sound going and no picture says which part let go. Reading a frame
  // has iOS count the player as needed while away, so that's only done with this sheet open.
  look(v) {
    const q = v.getVideoPlaybackQuality?.(), b = v.getBoundingClientRect(), x = b.x + b.width / 2, y = b.y + b.height / 2;
    const stack = document.elementsFromPoint(x, y), over = stack.slice(0, stack.indexOf(v)).filter(n => !n.closest('#sheet'));
    if (performance.now() - (this.litAt ?? -1e9) > 5000) {
      this.litAt = performance.now();
      setTimeout(() => {
        try {
          const c = this.probe ??= Object.assign(document.createElement('canvas'), { width: 8, height: 8 }).getContext('2d');
          c.drawImage(v, 0, 0, 8, 8);
          this.lit = Math.round(c.getImageData(0, 0, 8, 8).data.reduce((a, d, i) => i % 4 === 3 ? a : a + d, 0) / 192);
        } catch { this.lit = null; }
      }, 300);
    }
    const lit = this.lit;
    return [
      `Page: ${Pages.id} · build ${BUILD} · ${document.visibilityState} · ${document.hasFocus() ? 'focused' : 'not focused'}`,
      `Frames: ${q ? `${q.totalVideoFrames.toLocaleString()} decoded, ${q.droppedVideoFrames.toLocaleString()} dropped${q.displayCompositedVideoFrames ? `, ${q.displayCompositedVideoFrames.toLocaleString()} composited` : ''}` : 'no count'} · last one ${lit == null ? 'unread' : `${lit} of 255 bright`}`,
      `Player: ${Math.round(b.width)}×${Math.round(b.height)} at ${Math.round(b.x)},${Math.round(b.y)} · ${getComputedStyle(v).visibility} · ${v.id === 'vLL' ? (inView ? 'in view' : 'out of view') : 'CDN'} · ready ${v.readyState}${v.webkitPresentationMode && v.webkitPresentationMode !== 'inline' ? ` · ${v.webkitPresentationMode}` : ''}${over.length ? ` · under ${over.map(n => n.id || n.className || n.tagName).join(', ')}` : ''}`,
    ];
  },
};
$('scrim').onclick = () => Sheet.close();

const Recent = {
  list() { return store.get('recent', []); },
  add(u) {

    store.set('recent', [{ l: u.login, n: u.displayName, p: u.profileImageURL }, ...this.list().filter(x => x.l !== u.login)].slice(0, 12));

// A channel's thumbnail, keeping the last one on screen until its replacement has loaded so the list never blinks.
const thumbs = new Map();
function thumb(login, url) {
  const img = pic(thumbs.get(login) || url);
  if (url && thumbs.get(login) !== url) { const n = new Image(); n.onload = () => { thumbs.set(login, url); img.src = url; }; n.src = url; }
  return img;
}
function streamRow(x) {
  const a = el('a', 'row');
  a.href = `?c=${x.login}`;
  const th = el('div', 'thumb');
  th.append(thumb(x.login, x.thumb), el('span', 'tag', String(x.type || 'live').toUpperCase()), el('span', 'vc', count(x.viewers)));
  if (x.since) th.append(el('span', 'vc r', uptime(x.since)));
  const meta = el('div', 'meta'), who = el('div', 'who');
  who.append(pic(x.avatar, 'av'), el('span', 'nm', x.name));
  meta.append(who, el('div', 'tt', x.title || ''), el('div', 'gm', x.game || ''));
  a.append(th, meta);
  return a;
}

const Home = {
  users: [], live: new Set(), at: 0, busy: false, view: store.get('homeView', 'follow'), y: { follow: 0, browse: 0, game: 0 },
  before: null,   // the view a category was opened from: it's a visit, and back goes back there
  roster() { return Me.follows || FOLLOWS; },
  find(login) { return this.users.find(u => u.login === login) || null; },
  setView(view) {
    if (view !== this.view) { if (this.before == null) this.y[this.view] = scrollY; this.view = view; }   // a category's place isn't its list's
    document.querySelectorAll('.seg [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
    $('vFollow').hidden = view !== 'follow';
    $('vBrowse').hidden = view !== 'browse';
    if (view === 'browse') Browse.load();
    scrollTo(0, this.y[Browse.game ? 'game' : view]);
  },
  // force: your follows, now. Only asking (refresh) reloads Browse, which would lose your place in a long list.
  async load(force) {
    this.renderRecent();
    if (Me.acct) Me.sync();
    if (this.view === 'browse') Browse.load();
    if (this.busy) { if (force) this.again = true; return; }   // asked for afresh meanwhile (your follows just came in, Refresh): once this one's done
    if (!force && Date.now() - this.at < 45e3) return;
    this.busy = true;
    $('refresh').classList.add('busy');
    if (!this.at) this.skeleton();
    try {
      const roster = this.roster(), recent = Recent.list().map(r => r.l);
      const all = (await getUsers([...new Set([...roster, ...recent])])).filter(Boolean);
      // a channel on Kick too (KICK), offline on Twitch, is live if it's live there
      await Promise.all(all.filter(u => KICK[u.login] && !u.stream).map(async u => { const k = await kickChannel(KICK[u.login]).catch(() => null); u.kick = k?.live ? k : null; }));
      const mine = new Set(roster);
      this.users = all.filter(u => mine.has(u.login));
      this.live = new Set(all.filter(u => u.stream || u.kick).map(u => u.login));
      this.at = Date.now();
      this.render();
      this.renderRecent();
    } catch (e) {
      if (!this.at) {
        const box = $('live'); box.textContent = '';
        const p = el('p', 'note', `Couldn’t reach Twitch (${e.message}). `), b = el('button', null, 'Retry');
        b.type = 'button'; b.onclick = () => this.load(true); p.append(b); box.append(p);
      }
    } finally {
      this.busy = false;
      $('refresh').classList.remove('busy');
      if (this.again) { this.again = false; this.load(true); }
    }
  },
  skeleton() {
    const box = $('live'); box.textContent = '';
    for (let i = 0; i < 3; i++) {
      const r = el('div', 'row'), m = el('div', 'meta');
      r.append(el('div', 'thumb sk'));
      m.append(el('div', 'sk sk-line'), el('div', 'sk sk-line')); m.lastChild.style.width = '60%';
      r.append(m); box.append(r);
    }
  },
  render() {
    const viewers = u => u.stream ? u.stream.viewersCount : u.kick.viewers;
    const live = this.users.filter(u => u.stream || u.kick).sort((a, b) => viewers(b) - viewers(a));
    const last = u => Date.parse(u.lastBroadcast?.startedAt || 0) || 0;
    const off = this.users.filter(u => !u.stream && !u.kick).sort((a, b) => last(b) - last(a));
    const box = $('live'), bust = Math.floor(Date.now() / 300e3);
    box.textContent = '';
    $('liveN').textContent = live.length || '';
    if (!live.length) box.append(el('p', 'note', 'Nobody you follow is live right now.'));
    for (const u of live) {
      const s = u.stream, k = u.kick;
      box.append(s ? streamRow({ login: u.login, name: u.displayName, avatar: u.profileImageURL, title: u.broadcastSettings?.title, game: s.game?.displayName,
        viewers: s.viewersCount, since: s.createdAt, thumb: s.previewImageURL ? `${s.previewImageURL}?t=${bust}` : '', type: s.type })
        : streamRow({ login: u.login, name: u.displayName, avatar: u.profileImageURL, title: k.title, game: k.game, viewers: k.viewers, since: k.since,
          thumb: k.thumb ? `${k.thumb}?t=${bust}` : '', type: 'kick' }));
    }
    const offBox = $('off'); offBox.textContent = '';
    $('secOff').hidden = !off.length;
    for (const u of off) {
      const a = el('a'); a.href = `?c=${u.login}`;
      a.append(pic(u.profileImageURL, null, true), el('span', null, u.displayName));
      if (last(u)) a.append(el('small', null, ago(u.lastBroadcast.startedAt)));
      offBox.append(a);
    }
  },
  renderRecent() {
    const roster = this.roster(), list = Recent.list().filter(r => !roster.includes(r.l)), box = $('recent');
    $('secRecent').hidden = !list.length;
    box.textContent = '';
    for (const r of list) {
      const c = el('span', 'chip' + (this.live.has(r.l) ? ' on' : '')), a = el('a'), x = el('button', 'x');
      a.href = `?c=${r.l}`; a.append(pic(r.p), el('span', null, r.n || r.l));
      x.type = 'button'; x.setAttribute('aria-label', `Remove ${r.n || r.l}`); x.innerHTML = icon('x');
      x.onclick = () => Recent.remove(r.l);
      c.append(a, x); box.append(c);
    }
  },
};

// Browse: what's on across Twitch, by category, most watched first, in English unless the chip says all languages.
// Twitch will filter its list by a tag or by language, and either way it leaves streams out. On 2026-11-12 its list tagged English never
// had 33 of the 189 tagged streams its plain list had (one with 11,000 watching), 671 rows down, and 66 of 187 a few minutes earlier,
// different ones each time; its language filter lost as many. Everything the filtered lists had, the plain one had too. So Browse reads
// the plain list and keeps a stream set to the language or carrying its tag (6 in 152 English streams didn't carry it, and a few in
// other languages do). Where that keeps under 1 row in 8, a category mostly in another language say, Twitch's tagged list takes over.
const STREAM = 'viewersCount type createdAt title language freeformTags { name } previewImageURL(width: 440, height: 248) game { displayName } broadcaster { login displayName profileImageURL(width: 70) }';
const LANG = { English: 'EN' };   // the chip's language as Twitch's code for a stream's own setting
const Browse = {
  game: null, cursor: null, end: false, busy: false, at: 0, key: null, run: 0, listed: new Set(),
  thin: false, seen: 0, kept: 0,   // whether Twitch's tagged list has taken over, and how much of the plain list was in the language
  lang() { return store.get('lang', 'English'); },
  rewatch() { this.near.unobserve($('brEnd')); this.near.observe($('brEnd')); },   // watched afresh, the end of the list says again whether it's in view
  async load(force) {
    const key = `${this.game || ''}|${this.lang()}`, deep = $('brList').children.length > 30;
    // A list you've scrolled down stays as it is for a good while: reloading keeps only its first page.
    if (!force && key === this.key && Date.now() - this.at < (deep ? 9e5 : 60e3)) return;
    this.run++; this.key = key; this.at = Date.now(); this.cursor = null; this.end = false; this.busy = false;
    this.thin = false; this.seen = this.kept = 0;
    $('brHead').hidden = !this.game; $('secCats').hidden = !!this.game;
    $('brLang').textContent = this.lang() === 'all' ? 'All languages' : this.lang();
    if (!this.game) this.cats();
    else { $('brTitle').textContent = this.game; $('brSub').textContent = ''; }
    $('brH').firstChild.textContent = this.game ? 'Live channels' : 'Live now ';
    await this.page(true);
    if (deep && !$('vBrowse').hidden) scrollTo(0, 0);
  },
  async cats() {
    if ($('cats').children.length && Date.now() - this.catAt < 3e5) return;
    this.catAt = Date.now();
    try {
      const d = await gql('query { games(first: 30) { edges { node { name displayName viewersCount boxArtURL(width: 192, height: 256) } } } }');
      const box = $('cats');
      box.textContent = '';
      for (const { node: g } of d.games?.edges || []) {
        const a = el('a', 'cat'); a.href = `?g=${encodeURIComponent(g.name)}`;
        a.append(pic(g.boxArtURL), el('div', 'nm', g.displayName), el('div', 'gm', count(g.viewersCount)));
        box.append(a);
      }
    } catch {}
  },
  async page(first) {
    if (this.busy || this.end) return;
    this.busy = true;
    let loaded = false, failed = false;
    const run = this.run, game = this.game, box = $('brList'), lang = this.lang();   // the game as asked: Back clears it without a new run
    const mine = s => lang === 'all' || s.language === LANG[lang] || !!s.freeformTags?.some(t => t.name?.toLowerCase() === lang.toLowerCase());
    try {
      // About 4 rows in 7 of the plain list are English, so a go at it asks again, up to 3 times, until it has 15 rows to add.
      for (let asks = 0, added = 0; asks < 3 && added < 15 && !this.end; asks++) {
        const tagged = this.thin && lang !== 'all';
        const after = this.cursor ? `, after: ${JSON.stringify(this.cursor)}` : '';
        const opts = `{ sort: VIEWER_COUNT${tagged ? `, freeformTags: [${JSON.stringify(lang)}]` : ''} }`;
        const field = `streams(first: 30${after}, options: ${opts}) { edges { cursor node { ${STREAM} } } pageInfo { hasNextPage } }`;
        const d = game ? await gql(`query($g: String!) { game(name: $g) { displayName viewersCount ${field} } }`, { g: game }, TV_CID) : await gql(`query { ${field} }`, null, TV_CID);
        if (run !== this.run) return;
        this.at = Date.now();
        const res = game ? d.game?.streams : d.streams;
        if (game && d.game) { $('brTitle').textContent = d.game.displayName; $('brSub').textContent = `${count(d.game.viewersCount)} watching`; }
        const edges = res?.edges || [];
        if (first && !asks) { box.textContent = ''; this.listed = new Set(); }
        for (const { node: s } of edges) {
          const login = s?.broadcaster?.login;
          if (!login) continue;
          if (!tagged) this.seen++;
          // Twitch pages by place in a list that keeps re-sorting by viewers, so a channel that slipped a few places comes round again
          if (!mine(s) || this.listed.has(login)) continue;
          this.listed.add(login); added++;
          if (!tagged) this.kept++;
          box.append(streamRow({ login, name: s.broadcaster.displayName, avatar: s.broadcaster.profileImageURL, title: s.title,
            game: s.game?.displayName, viewers: s.viewersCount, since: s.createdAt, thumb: s.previewImageURL, type: s.type }));
        }
        this.cursor = edges[edges.length - 1]?.cursor || null;
        this.end = !res?.pageInfo?.hasNextPage || !this.cursor;
        loaded = true;
        if (tagged || $('vBrowse').hidden) break;
        // too few of the plain list's rows are in the language: Twitch's tagged list from its top, the rows already here passed over
        if (!this.end && lang !== 'all' && this.seen >= 90 && this.kept * 8 < this.seen) { this.thin = true; this.cursor = null; }
      }
      if (this.end && !box.children.length) box.append(el('p', 'note', 'Nothing live here in this language.'));
    } catch (e) {
      failed = true;
      if (run !== this.run) {}
      else if (first && !loaded) { box.textContent = ''; box.append(el('p', 'note', `Couldn’t reach Twitch (${e.message}).`)); }
      // a later page that failed gets another go in a while, if the end of the list is still in reach then
      else setTimeout(() => { if (run === this.run && !this.end) this.rewatch(); }, 15e3);
    } finally { if (run === this.run) this.busy = false; }
    // The observer below only calls when the end of the list comes into reach or goes out of it. With it still in reach after this page (a
    // tall window, few rows, a scroll landing as they went in), it would never call again: watching afresh has it say how things stand.
    if (loaded && !failed && run === this.run) this.rewatch();
  },
};
Browse.near = new IntersectionObserver(es => { if (es[0].isIntersecting && !$('vBrowse').hidden) Browse.page(); }, { rootMargin: '600px' });
Browse.near.observe($('brEnd'));
$('brLang').onclick = () => { store.set('lang', Browse.lang() === 'all' ? 'English' : 'all'); Browse.load(true); };

// Search as you type: your follows at once, everyone else as Twitch answers.
const Search = {
  n: 0, timer: 0, at: -1, answered: null,
  ITEM: 'login displayName profileImageURL(width: 50) stream { viewersCount game { displayName } }',
  hide() { this.n++; clearTimeout(this.timer); $('sgl').hidden = true; $('sgl').textContent = ''; this.at = -1; this.answered = null; },
  mine(low) { return Home.users.filter(u => u.login.includes(low) || u.displayName?.toLowerCase().includes(low)); },
  input() {
    const term = $('q').value.trim();
    if (term.length < 2 || /[/.]/.test(term)) return this.hide();
    clearTimeout(this.timer);
    this.n++;   // the answer on its way is for what was typed before
    this.answered = null;
    this.draw(this.mine(term.toLowerCase()).slice(0, 6), []);
    this.timer = setTimeout(() => this.run(term), 150);
  },
  async run(term) {
    const n = ++this.n;
    try {
      const d = await gql(`query($q: String!) { searchFor(userQuery: $q, platform: "web") { users { edges { item { ... on User { ${this.ITEM} } } } } channels { edges { item { ... on User { ${this.ITEM} } } } } games { edges { item { ... on Game { name displayName viewersCount boxArtURL(width: 54, height: 72) } } } } } }`, { q: term });
      if (n !== this.n) return;
      const low = term.toLowerCase(), r = d.searchFor, mine = this.mine(low);
      const found = new Map();
      for (const u of [...mine, ...(r?.users?.edges || []).map(e => e.item), ...(r?.channels?.edges || []).map(e => e.item)]) if (u?.login && !found.has(u.login)) found.set(u.login, u);
      const rank = u => (u.login === low ? 3e9 : 0) + (mine.includes(u) ? 2e9 : 0) + (u.stream ? 1e9 + u.stream.viewersCount : 0);
      this.draw([...found.values()].sort((a, b) => rank(b) - rank(a)).slice(0, 8), (r?.games?.edges || []).map(e => e.item).filter(Boolean).slice(0, 3));
      this.answered = term;
    } catch {}
  },
  draw(users, games) {
    const box = $('sgl');
    box.textContent = '';
    this.at = -1;
    for (const u of users) {
      const a = el('a', 'sg'); a.href = `?c=${u.login}`;
      const meta = el('div', 'meta');
      meta.append(el('div', 'nm', u.displayName || u.login));
      if (u.stream) { const g = el('div', 'gm'); g.append(el('i', 'dot'), [count(u.stream.viewersCount), u.stream.game?.displayName].filter(Boolean).join(' · ')); meta.append(g); }
      a.append(pic(u.profileImageURL), meta);
      box.append(a);
    }
    for (const g of games) {
      const a = el('a', 'sg'); a.href = `?g=${encodeURIComponent(g.name)}`;
      const meta = el('div', 'meta');
      meta.append(el('div', 'nm', g.displayName), el('div', 'gm', `Category${g.viewersCount ? ' · ' + count(g.viewersCount) + ' watching' : ''}`));
      const art = pic(g.boxArtURL, 'art');
      a.append(art, meta);
      box.append(a);
    }
    box.hidden = !box.children.length;
    this.fit();
  },
  // iPhone's keyboard covers the page instead of shrinking it, so the list ends where the keyboard starts.
  fit() {
    const box = $('sgl');
    if (vv && !box.hidden) box.style.maxHeight = `min(62dvh, ${Math.max(104, Math.round(vv.offsetTop + vv.height - box.getBoundingClientRect().top - 8))}px)`;
  },
  // Once Twitch has answered, Go on part of a name means the match showing for it. An exact name ranks first, so it's that.
  best(raw) {
    const top = $('sgl').firstElementChild, low = raw.toLowerCase(), says = n => n?.toLowerCase().includes(low);
    return this.answered === raw && top && (says(top.getAttribute('href')) || says(top.querySelector('.nm')?.textContent)) ? top.getAttribute('href') : null;
  },
  move(by) {
    const items = $('sgl').children;
    if (!items.length) return;
    this.at = (this.at + by + items.length) % items.length;
    [...items].forEach((n, i) => n.classList.toggle('on', i === this.at));
    items[this.at].scrollIntoView({ block: 'nearest' });
  },
  submit() {
    const raw = $('q').value.trim(), picked = $('sgl').children[this.at] || null;
    const video = raw.match(/twitch\.tv\/(?:\w+\/)?videos?\/(\d+)/);
    let url = picked?.getAttribute('href');
    if (!url && video) url = `?v=${video[1]}`;
    url ||= this.best(raw);
    if (!url && validLogin(norm(raw))) url = `?c=${norm(raw)}`;
    if (!url) url = $('sgl').firstElementChild?.getAttribute('href');
    if (!url) { $('q').focus(); return; }
    $('q').value = ''; $('q').blur();
    this.hide();
    go(url, true);
  },
};
$('q').addEventListener('input', () => Search.input());
vv?.addEventListener('resize', () => Search.fit());
vv?.addEventListener('scroll', () => Search.fit());
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); Search.move(e.key === 'ArrowDown' ? 1 : -1); }
  else if (e.key === 'Escape') Search.hide();
  else if (e.key === 'Enter') { e.preventDefault(); Search.submit(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.searchw')) Search.hide(); });
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (!b) return;
  const view = b.dataset.view;
  if (Browse.game) { Browse.game = null; history.replaceState(history.state, '', location.pathname); }
  else if (view === Home.view) Home.y[view] = 0;   // the tab you're on: its top
  store.set('homeView', view);
  Home.setView(view);
  Home.before = null;
});
$('brBack').onclick = () => back();
$('acct').onclick = () => Sheet.account();

document.querySelector('#home').addEventListener('click', e => {
  const a = e.target.closest('a[href^="?"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  $('q').value = ''; Search.hide();
  go(a.getAttribute('href'), true);
});
const refreshHome = () => { if (Home.view === 'browse') Browse.load(true); Home.load(true); };
$('refresh').onclick = () => { if (Me.acct) Me.loadFollows(); refreshHome(); };
$('brand').onclick = e => { e.preventDefault(); scrollTo(0, 0); refreshHome(); };
setInterval(() => { if (!document.hidden && !$('home').hidden && !Pages.idle()) Home.load(); }, 60e3);   // and once you're back (Pages.see)
$('search').addEventListener('submit', e => { e.preventDefault(); Search.submit(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('home').hidden) Home.load(); });

// The Home Screen app can sit suspended for days, still running the version it started with. Coming back
// to it checks for a newer page, which loads the next time you're on the home screen with nothing open.
// Newer means its code differs from what's running here. (Going by the server's tag missed one: a launch from the phone's
// cache runs the old code, and the first look takes the new tag for this page's own, 2026-11-05.)
const Update = {
  at: 0, ready: false,
  async check() {
    if (this.ready || Date.now() - this.at < 6e4) return this.apply();
    this.at = Date.now();
    try {
      const r = await fetch(location.pathname, { cache: 'no-cache' });   // asks the server, which mostly says the copy here is current
      if (!r.ok) return;
      const code = [...new DOMParser().parseFromString(await r.text(), 'text/html').scripts].find(s => s.textContent.includes('const BUILD'));
      if (code && buildOf(code.textContent) !== BUILD) this.ready = true;
      this.apply();
    } catch {}
  },
  apply() { if (this.ready && !$('home').hidden && $('sheet').hidden && !$('q').value) location.reload(); },
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) Update.check(); });
// Watching for hours in front never comes back to the app, so it looks now and then too, and again on the way home, where it can load.
setInterval(() => { if (!document.hidden && !Pages.idle()) Update.check(); }, 15 * 60e3);

// ── routing ─────────────────────────────────────────
// How many steps in from where the app opened, kept with each step: a page iOS reloads starts at 0 otherwise, and Back then skipped the
// channel before and left it behind home, and a forward swipe counted as a back.
let depth = history.state?.depth || 0;
history.scrollRestoration = 'manual';
function route(gesture) {
  const q = new URLSearchParams(location.search);
  const c = norm(q.get('c') || q.get('channel') || ''), v = q.get('v'), g = q.get('g');
  if (!$('sheet').hidden) Sheet.close();
  if (validLogin(c)) P.open(c, gesture, Home.find(c));
  else if (/^\d+$/.test(v || '')) P.openVod(v, gesture);
  else {
    P.close();
    $('watch').hidden = true; $('home').hidden = false;
    document.title = 'Wraith';
    Browse.game = g || null;
    if (g) { Home.before ??= Home.view; Home.setView('browse'); }
    else { Home.setView(Home.before ?? Home.view); Home.before = null; }
    Update.apply();
    Pages.whenSeen(() => { Home.load(); Update.check(); });
  }
}
function go(url, gesture) {
  if (!$('home').hidden) Home.y[Browse.game ? 'game' : Home.view] = scrollY;
  depth++; history.pushState({ depth }, '', url); route(gesture);
  if (url.startsWith('?g=')) scrollTo(0, 0);
}
function back() {
  if (depth > 0) history.back();
  else { history.replaceState({ depth: 0 }, '', location.pathname); route(false); }
}
window.addEventListener('popstate', () => { depth = history.state?.depth || 0; route(false); });

Sound.setLevel(Sound.level);
Sound.set(Sound.muted);
Me.save(Me.acct);
Pages.whenSeen(() => { Update.check(); Me.check(); Me.sync(); });
setInterval(() => { if (Me.acct && !document.hidden && !Pages.idle() && Date.now() - (Me.at.check || 0) > 3600e3) Me.check(); }, 60e3);
window.wraith = { P, Chat, Home, BG, Pages, Talk, Me, Replay, Browse, Search, SignIn, UI, Sheet, Card, Picker, Update, BUILD, relayGet, Quota, Pill, Awake, Auto };   // for poking at playback from devtools
Away.add('loaded ' + (location.search || 'home') + (document.hidden ? ' out of sight' : ''));
Pages.tell('here');
route(false);
})();
</script>
</body>
