<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Wraith Link</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>👻</text></svg>">
<style>
  :root {
    --bg: #0e0e10;
    --card: #18181b;
    --border: #2a2a30;
    --text: #efeff1;
    --muted: #8b8b95;
    --accent: #9147ff;
    --accent-hover: #772ce8;
    --live: #eb0400;
    --offline: #53535f;
    --ok: #00d066;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  body {
    padding: max(env(safe-area-inset-top), 24px) 16px max(env(safe-area-inset-bottom), 24px);
    max-width: 560px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .sub {
    color: var(--muted);
    font-size: 14px;
  }
  form {

    gap: 8px;
    margin-bottom: 16px;

  input[type=text] {
    flex: 1;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 17px;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type=text]:focus {
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; }
  .result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;

  .result.shown { display: block; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  .dot {

    height: 8px;
    border-radius: 50%;
    background: var(--offline);
    flex-shrink: 0;
  }
  .dot.live {
    background: var(--live);
    box-shadow: 0 0 0 0 rgba(235, 4, 0, 0.7);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(235, 4, 0, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(235, 4, 0, 0); }
    100% { box-shadow: 0 0 0 0 rgba(235, 4, 0, 0); }
  }
  .channel {
    color: var(--text);
    font-weight: 600;
  }
  .url {
    background: #0a0a0c;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 8px 0 12px;
    font: 12px ui-monospace, "SF Mono", Menlo, monospace;
    word-break: break-all;
    color: var(--muted);
    user-select: all;
    -webkit-user-select: all;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .actions a, .actions button.secondary {
    flex: 1;
    min-width: 0;
    background: #26262c;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .actions a:active, .actions button.secondary:active { background: #36363e; }
  .actions a.primary {
    background: var(--accent);
    border-color: var(--accent);
  }
  .actions a.primary:active { background: var(--accent-hover); }
  .error {
    color: #ff8080;
  }
  .recent {
    margin-top: 32px;
  }
  .recent-label {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;

  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 14px;

  .chip:active { background: #26262c; }

  }

    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;

  .vod-head {
    padding: 12px 14px;
    cursor: pointer;

  .vod-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;

    margin-top: 5px;

    color: var(--muted);
    display: flex;
    align-items: center;

  .vod-actions {
    display: none;

    flex-wrap: wrap;

  .vod.open .vod-actions { display: flex; }
  .vod-actions a, .vod-actions button {
    flex: 1;
    min-width: 0;
    background: #26262c;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
    font-family: inherit;

  .vod-actions a.primary {
    background: var(--accent);
    border-color: var(--accent);

  .vod-actions a:active, .vod-actions button:active { background: #36363e; }
  .vod-actions a.primary:active { background: var(--accent-hover); }

  .vods-msg.error { color: #ff8080; }

    margin-left: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 9px;
    padding: 10px 8px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { background: var(--accent); color: #fff; }
  .tab:not(.active):active { background: #26262c; }
  .tabcount {
    font-size: 12px;
    font-weight: 700;
    opacity: 0.85;
    margin-left: 4px;
  }
  .view { display: none; }
  .view.shown { display: block; }
  .live-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .live-htitle {
    color: var(--muted);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .live-refresh {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    width: 34px;
    height: 34px;
    padding: 0;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .live-refresh:active { background: #26262c; }
  .live-refresh:disabled { opacity: 0.5; }
  .live-refresh.spinning { animation: spin 0.7s linear infinite; }
  .live-card {
    background: var(--card);
    border: 1px solid var(--border);

  .live-card:active { background: #1e1e22; }
  .live-thumb {
    position: relative;
    aspect-ratio: 16 / 9;

  .live-thumb img {
    width: 100%;
    height: 100%;

  .live-badge {

    color: #fff;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;

  }
  .live-viewers {
    position: absolute;
    bottom: 8px;
    left: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .live-viewers .vdot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--live);
  }
  .live-uptime {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.78);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .live-body {
    display: flex;
    gap: 10px;
    padding: 12px 14px 0;
  }
  .live-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--border);
    object-fit: cover;

  .live-info { min-width: 0; flex: 1; }
  .live-name {

  .live-actions {
    display: flex;
    gap: 8px;

  }
  .live-actions button, .live-actions a {

    color: var(--text);
    border: 1px solid var(--border);

    font-size: 14px;

  .live-actions button.primary {

  .live-actions button:active, .live-actions a:active { background: #36363e; }
  .live-actions button.primary:active { background: var(--accent-hover); }
</style>

<body>
  <header>
    <h1>Wraith Link</h1>
    <span class="sub">Twitch CDN bypass</span>
  </header>

  <div class="tabs">
    <button class="tab active" type="button" data-tab="live">Live<span class="tabcount" id="liveCount"></span></button>
    <button class="tab" type="button" data-tab="link">Link</button>
    <button class="tab" type="button" data-tab="vods">VODs</button>
  </div>

  <section class="view shown" data-view="live">
    <div class="live-head">
      <span class="live-htitle">Following · live now</span>
      <button class="live-refresh" type="button" id="liveRefresh" aria-label="Refresh">↻</button>
    </div>
    <div id="liveList"><div class="vods-msg"><span class="spinner"></span> Checking who's live…</div></div>
  </section>

  <section class="view" data-view="link">
    <form id="f">
      <input type="text" id="ch" placeholder="channel" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
      <button type="submit" id="go">Go</button>
    </form>

    <div class="result" id="result"></div>

    <div class="recent">
      <div class="recent-label">Recent</div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <section class="view" data-view="vods">
    <div class="vods" id="vods">
      <div class="vods-head">
        <span class="vods-title">Ikumi · sub-only VODs</span>
        <span class="vods-count" id="vodsCount"></span>
      </div>
      <div id="vodsList"><div class="vods-msg"><span class="spinner"></span> Loading…</div></div>
    </div>
  </section>

<script>
const CLIENT_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';
const $ = id => document.getElementById(id);
const result = $('result');

const recent = {
  get() { try { return JSON.parse(localStorage.getItem('recent') || '[]'); } catch { return []; } },
  add(ch) {
    const list = this.get().filter(c => c !== ch);
    list.unshift(ch);
    localStorage.setItem('recent', JSON.stringify(list.slice(0, 8)));
    this.render();
  },
  remove(ch) {
    localStorage.setItem('recent', JSON.stringify(this.get().filter(c => c !== ch)));
    this.render();
  },
  render() {
    const chips = $('chips');
    const list = this.get();
    chips.innerHTML = list.length ? list.map(c =>
      `<span class="chip" data-ch="${c}">${c}<span class="x" data-rm="${c}">×</span></span>`
    ).join('') : '<span class="sub">none yet</span>';
  },
};

async function gql(query) {
  const r = await fetch('https://gql.twitch.tv/gql', {
    method: 'POST',
    headers: { 'Client-ID': CLIENT_ID, 'Content-Type': 'application/json' },
    body: JSON.stringify({ query }),
  });
  return r.json();
}

async function sha1hex(s) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function timeAgo(iso) {
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec / 60)}m`;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return m ? `${h}h ${m}m` : `${h}h`;
}

function showError(msg) {
  result.className = 'result shown';
  result.innerHTML = `<div class="status"><span class="dot"></span><span class="error">${msg}</span></div>`;
}

async function discoverCfDist(channel) {
  const r = await gql(`{ user(login: "${channel}") { videos(first:1, sort:TIME) { edges { node { seekPreviewsURL } } } } }`);
  const url = r?.data?.user?.videos?.edges?.[0]?.node?.seekPreviewsURL;
  if (!url) return null;
  const m = url.match(/https:\/\/([^.]+)\.cloudfront\.net\//);
  return m ? m[1] : null;
}

async function buildLink(channel) {
  channel = channel.toLowerCase().trim().replace(/^https?:\/\/(www\.)?twitch\.tv\//, '').replace(/\/.*$/, '');
  if (!channel) return;

  $('ch').value = channel;
  result.className = 'result shown';
  result.innerHTML = `<div class="status"><span class="spinner"></span><span>Checking ${channel}…</span></div>`;
  $('go').disabled = true;

  try {
    const meta = await gql(`{ user(login: "${channel}") { id login stream { id createdAt type } } }`);
    const user = meta?.data?.user;
    if (!user) { showError(`Channel "${channel}" not found.`); return; }
    if (!user.stream) {
      result.innerHTML = `<div class="status"><span class="dot"></span><span><span class="channel">${channel}</span> is offline.</span></div>`;
      recent.add(channel);
      return;
    }

    const cfDist = await discoverCfDist(channel);
    if (!cfDist) { showError(`No past VODs on ${channel} — can't discover CDN distribution.`); return; }

    const streamId = user.stream.id;
    const ts = Math.floor(new Date(user.stream.createdAt).getTime() / 1000);
    const hash = (await sha1hex(`${channel}_${streamId}_${ts}`)).substring(0, 20);
    const m3u8 = `https://${cfDist}.cloudfront.net/${hash}_${channel}_${streamId}_${ts}/chunked/index-dvr.m3u8`;
    const vlc = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(m3u8)}`;
    const ago = timeAgo(user.stream.createdAt);

    result.innerHTML = `
      <div class="status">
        <span class="dot live"></span>
        <span><span class="channel">${channel}</span> live · started ${ago} ago</span>
      </div>
      <div class="url" id="urlbox">${m3u8}</div>
      <div class="actions">
        <a class="primary" href="${m3u8}">Play in Safari</a>
        <a href="${vlc}">Open in VLC</a>
        <button class="secondary" type="button" id="copy">Copy<span class="copied" id="copied">✓</span></button>
      </div>
    `;

    $('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(m3u8);
        $('copied').classList.add('shown');
        setTimeout(() => $('copied').classList.remove('shown'), 1500);
      } catch {
        const range = document.createRange();
        range.selectNode($('urlbox'));
        getSelection().removeAllRanges();
        getSelection().addRange(range);
      }
    };

    recent.add(channel);
  } catch (e) {
    showError(`Error: ${e.message}`);
  } finally {
    $('go').disabled = false;
  }
}

// ── Ikumi ASMR VOD library ──────────────────────────────
// Her ASMR streams archive as Twitch VODs, many flipped to sub-only ("members").
// The CloudFront CDN serves the segments with zero auth, so we list every VOD and
// build its index-dvr.m3u8 straight from the seekPreviewsURL path — no sub needed.
const IKUMI = 'ikumi';

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function fmtDur(sec) {
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function fmtDate(iso) {
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function cleanTitle(t) {
  // strip her trailing brand boilerplate: chat commands (!Patreon !yt !gg), ⭐, and a dangling "ASMR"
  let s = t.replace(/!\S+/g, '').replace(/⭐/g, '').replace(/\s+/g, ' ').trim();
  return s.replace(/\s*ASMR\s*$/i, '').trim() || t;
}

function vodM3u8(seek) {
  // seekPreviewsURL: https://{cf}.cloudfront.net/{path}/storyboards/{id}-info.json
  const m = seek && seek.match(/https:\/\/([^.]+)\.cloudfront\.net\/([^/]+)\/storyboards\//);
  return m ? `https://${m[1]}.cloudfront.net/${m[2]}/chunked/index-dvr.m3u8` : null;
}

async function loadVods(login) {
  const list = $('vodsList');
  list.innerHTML = `<div class="vods-msg"><span class="spinner"></span> Loading…</div>`;
  try {
    const r = await gql(`{ user(login: "${login}") { videos(first: 100, sort: TIME) { edges { node { id title lengthSeconds createdAt resourceRestriction { type } seekPreviewsURL } } } } }`);
    const vods = (r?.data?.user?.videos?.edges || [])
      .map(e => ({ ...e.node, m3u8: vodM3u8(e.node.seekPreviewsURL) }))
      .filter(v => v.m3u8 && v.resourceRestriction);  // sub-only ("members") VODs only
    if (!vods.length) { list.innerHTML = `<div class="vods-msg">No sub-only VODs right now.</div>`; return; }
    $('vodsCount').textContent = vods.length;
    list.innerHTML = vods.map(v => {
      const vlc = `vlc-x-callback://x-callback-url/stream?url=${encodeURIComponent(v.m3u8)}`;
      return `<div class="vod">
        <div class="vod-head">
          <div class="vod-title">${esc(cleanTitle(v.title))}</div>
          <div class="vod-meta">${fmtDate(v.createdAt)} · ${fmtDur(v.lengthSeconds)}</div>
        </div>
        <div class="vod-actions">
          <a class="primary" href="${v.m3u8}">Play</a>
          <a href="${vlc}">VLC</a>
          <button class="secondary" type="button" data-copy="${v.m3u8}">Copy</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<div class="vods-msg error">Couldn't load VODs.<button class="vods-retry" id="vodsRetry">Retry</button></div>`;
    const rt = $('vodsRetry'); if (rt) rt.onclick = () => loadVods(login);
  }
}

$('vodsList').addEventListener('click', e => {
  const copyUrl = e.target.dataset.copy;
  if (copyUrl) {
    e.stopPropagation();
    const b = e.target, old = b.textContent;
    const done = () => { b.textContent = 'Copied ✓'; setTimeout(() => { b.textContent = old; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(copyUrl).then(done).catch(() => {});
    else {
      const ta = document.createElement('textarea');
      ta.value = copyUrl; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch {}
      ta.remove();
    }
    return;
  }
  if (e.target.closest('.vod-actions')) return;
  const head = e.target.closest('.vod-head');
  if (head) head.parentElement.classList.toggle('open');
});

$('f').addEventListener('submit', e => {
  e.preventDefault();
  buildLink($('ch').value);
});

$('chips').addEventListener('click', e => {
  const rm = e.target.dataset.rm;
  if (rm) { recent.remove(rm); return; }
  const ch = e.target.closest('[data-ch]')?.dataset.ch;
  if (ch) buildLink(ch);
});

// ── Following · live now ────────────────────────────────
// Static snapshot of the account's Twitch follows (login + display name).
// Live status is checked anonymously per load via the public GQL endpoint —
// no auth needed here. To refresh the roster, re-run the ChannelFollows
// persisted query while logged in and replace this array.
const FOLLOWS = [
  {l:"mirunemochi",n:"MiruneMochi"},{l:"meltymim",n:"meltymim"},{l:"menmakiii",n:"menmakiii"},
  {l:"squchan",n:"SquChan"},{l:"nanasanada",n:"NanaSanada"},{l:"akemikuraii",n:"AkemiKuraii"},
  {l:"powdur",n:"Powdur"},{l:"ruiasaka",n:"RuiAsaka"},{l:"jellyhoshiumi",n:"JellyHoshiumi"},
  {l:"emiru",n:"Emiru"},{l:"sinonsinfonia",n:"SinonSinfonia"},{l:"filian",n:"filian"},
  {l:"maliceevermore",n:"MaliceEvermore"},{l:"kanekolumi",n:"KanekoLumi"},{l:"smugalana",n:"SmugAlana"},
  {l:"zenyahima",n:"ZenyaHima"},{l:"gmhikaru",n:"GMHikaru"},{l:"halo_sweety",n:"HalO_Sweety"},
  {l:"ririgaki",n:"ririgaki"},{l:"leaflit",n:"Leaflit"},{l:"zackrawrr",n:"zackrawrr"},
  {l:"xqc",n:"xQc"},{l:"kiskachan",n:"kiskachan"},{l:"amano_nene",n:"amano_nene"},
  {l:"pillowdearasmr",n:"PillowDearASMR"},{l:"marimari_en",n:"marimari_en"},{l:"sera_promisu",n:"sera_promisu"},
  {l:"kirsche",n:"Kirsche"},{l:"fallenshadow",n:"fallenshadow"},{l:"tenma",n:"Tenma"},
  {l:"asmongold",n:"Asmongold"},{l:"madisonbeer",n:"madisonbeer"},{l:"asmrcham",n:"asmrCham"},
  {l:"sakae_izumi",n:"Sakae_Izumi"},{l:"senzawa",n:"senzawa"},{l:"watsonamelia_hololiveen",n:"watsonAMElia_hololiveen"},
  {l:"darling",n:"darling"},{l:"animeexpo",n:"AnimeExpo"},{l:"ikumi",n:"Ikumi"},
  {l:"jinnytty",n:"Jinnytty"},{l:"nintendo",n:"Nintendo"},{l:"arrumieshanon",n:"ArrumieShanon"},
  {l:"nasa",n:"NASA"},{l:"offlinetv",n:"OfflineTV"},
];

let liveLoadedAt = 0;
let liveLoading = false;

function uptime(iso) {
  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function chunk(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

async function fetchLive() {
  const parts = await Promise.all(chunk(FOLLOWS, 20).map(async batch => {
    const q = '{' + batch.map((c, i) =>
      `u${i}: user(login:"${c.l}"){ login displayName profileImageURL(width:70) broadcastSettings { title } stream { id type viewersCount createdAt game { displayName } previewImageURL(width:440,height:248) } }`
    ).join(' ') + '}';
    const r = await gql(q);
    return batch.map((c, i) => ({ c, u: r?.data?.['u' + i] }));
  }));
  return parts.flat()
    .filter(x => x.u && x.u.stream)
    .map(x => ({
      login: x.u.login,
      name: x.u.displayName || x.c.n,
      pfp: x.u.profileImageURL,
      title: x.u.broadcastSettings?.title || '',
      game: x.u.stream.game?.displayName || '',
      viewers: x.u.stream.viewersCount || 0,
      since: x.u.stream.createdAt,
      type: x.u.stream.type,
      preview: x.u.stream.previewImageURL,
    }))
    .sort((a, b) => b.viewers - a.viewers);
}

function renderLive(live) {
  const el = $('liveList');
  $('liveCount').textContent = live.length || '';
  if (!live.length) {
    el.innerHTML = `<div class="vods-msg">Nobody you follow is live right now.</div>`;
    return;
  }
  const bust = Date.now();
  el.innerHTML = live.map(s => {
    const thumb = s.preview ? s.preview + (s.preview.includes('?') ? '&' : '?') + 't=' + bust : '';
    const rerun = s.type && s.type !== 'live' ? `<span class="live-rerun">${esc(s.type)}</span>` : '';
    return `<div class="live-card" data-ch="${esc(s.login)}">
      <div class="live-thumb">
        ${thumb ? `<img src="${thumb}" alt="">` : ''}
        <span class="live-badge">Live</span>
        <span class="live-viewers"><span class="vdot"></span>${s.viewers.toLocaleString()}</span>
        <span class="live-uptime">${uptime(s.since)}</span>
      </div>
      <div class="live-body">
        ${s.pfp ? `<img class="live-avatar" src="${esc(s.pfp)}" alt="">` : `<div class="live-avatar"></div>`}
        <div class="live-info">
          <div class="live-name">${esc(s.name)}${rerun}</div>
          ${s.title ? `<div class="live-title">${esc(s.title)}</div>` : ''}
          ${s.game ? `<div class="live-game">${esc(s.game)}</div>` : ''}
        </div>
      </div>
      <div class="live-actions">
        <button class="primary" type="button" data-wraith="${esc(s.login)}">Wraith Link</button>
        <a href="https://www.twitch.tv/${esc(s.login)}" target="_blank" rel="noopener">Twitch ↗</a>
      </div>
    </div>`;
  }).join('');
}

async function loadLive(force) {
  if (liveLoading) return;
  if (!force && liveLoadedAt && Date.now() - liveLoadedAt < 45000) return;
  liveLoading = true;
  const el = $('liveList');
  if (force || !liveLoadedAt) el.innerHTML = `<div class="vods-msg"><span class="spinner"></span> Checking who's live…</div>`;
  $('liveRefresh').disabled = true;
  $('liveRefresh').classList.add('spinning');
  try {
    renderLive(await fetchLive());
    liveLoadedAt = Date.now();
  } catch (e) {
    el.innerHTML = `<div class="vods-msg error">Couldn't load live channels.<button class="vods-retry" id="liveRetry">Retry</button></div>`;
    const rt = $('liveRetry'); if (rt) rt.onclick = () => loadLive(true);
  } finally {
    liveLoading = false;
    $('liveRefresh').disabled = false;
    $('liveRefresh').classList.remove('spinning');
  }
}

$('liveRefresh').onclick = () => loadLive(true);
$('liveList').addEventListener('click', e => {
  if (e.target.closest('a')) return;            // let "Twitch ↗" open normally
  const card = e.target.closest('.live-card');
  if (!card) return;
  switchTab('link');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  buildLink(card.dataset.ch);
});

// ── Tabs ────────────────────────────────────────────────
let currentTab = 'live';
let vodsLoaded = false;
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('shown', v.dataset.view === name));
  if (name === 'live') loadLive(false);
  if (name === 'vods' && !vodsLoaded) { vodsLoaded = true; loadVods(IKUMI); }
}
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) switchTab(t.dataset.tab);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && currentTab === 'live') loadLive(false);
});

recent.render();

const params = new URLSearchParams(location.search);
const initial = params.get('c') || params.get('channel');
if (initial) { switchTab('link'); buildLink(initial); }
else switchTab('live');
</script>
