<style>
:root {
  --bg: #0b0b0d; --bg-1: #121215; --bg-2: #19191d; --bg-3: #232329;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.14);
  --fg: #f4f4f6; --fg-2: #a8a8b2; --fg-3: #6e6e79;
  --live: #ff3b4f; --good: #3ddc97; --warn: #fbbf24;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, sans-serif;
  --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
  --sal: env(safe-area-inset-left); --sar: env(safe-area-inset-right);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { font: 15px/1.4 var(--sans); min-height: 100dvh; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; touch-action: manipulation; }
a { color: inherit; text-decoration: none; -webkit-touch-callout: none; }
img { display: block; max-width: 100%; }
svg { width: 22px; height: 22px; flex: none; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid rgba(255,255,255,.5); outline-offset: 2px; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes sk { to { background-position: -200% 0; } }
@keyframes up { from { transform: translateY(28px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* ── home ─────────────────────────────────────────── */
#home { max-width: 1200px; margin: 0 auto; padding: calc(var(--sat) + 8px) max(16px, var(--sar)) calc(var(--sab) + 32px) max(16px, var(--sal)); }
/* one line where there's the width, the search under it where there isn't */
.top { display: grid; grid-template: "brand seg refresh acct" "search search search search" / auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px 2px; margin-bottom: 22px; }
@media (min-width: 560px) { .top { grid-template: "brand seg search refresh acct" / auto auto minmax(0, 1fr) auto auto; gap: 2px; margin-bottom: 14px; } .searchw { margin: 0 6px 0 10px; } }
#refresh { grid-area: refresh; }
#acct { grid-area: acct; }
.brand { grid-area: brand; display: flex; align-items: center; gap: 9px; margin-right: 10px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
@media (max-width: 389px) { .brand span + span { display: none; } }
.brand svg { width: 25px; height: 25px; }
.sp { flex: 1; }
.ib { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; color: var(--fg-2); }
.ib:active { background: var(--bg-2); }
.ib.busy svg { animation: rot .8s linear infinite; }
.search { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 5px 0 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; }
.search:focus-within { border-color: var(--line-2); }
.search svg { width: 18px; height: 18px; color: var(--fg-3); }
.search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; font-size: 16px; -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--fg-3); }
.search input::-webkit-search-cancel-button { display: none; }
.searchw { grid-area: search; position: relative; z-index: 6; min-width: 0; }
.sgl { position: absolute; right: 0; top: 48px; width: max(100%, 300px); max-height: 62dvh; overflow-y: auto; background: var(--bg-1); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: 0 16px 44px rgba(0,0,0,.65); }
.sg { display: flex; align-items: center; gap: 11px; min-height: 52px; padding: 7px 13px; }
.sg + .sg { border-top: 1px solid var(--line); }
.sg.on, .sg:active { background: var(--bg-3); }
.sg img { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--bg-2); object-fit: cover; }
.sg img.art { width: 27px; height: 36px; margin: 0 4.5px; border-radius: 4px; }
.sg .gm { margin-top: 1px; }
.dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--live); vertical-align: 1px; }
.seg { grid-area: seg; display: flex; gap: 2px; min-width: 0; }
.seg button { height: 34px; padding: 0 13px; border-radius: 999px; color: var(--fg-2); font-size: 14px; font-weight: 600; }
.seg button.on { background: var(--bg-2); color: var(--fg); }
.brh { display: flex; align-items: center; gap: 8px; margin: -8px 0 16px -8px; }
.brh .nm { font-size: 18px; font-weight: 700; }
.lng { height: 26px; margin-top: -6px; padding: 0 10px; border-radius: 999px; background: var(--bg-2); color: var(--fg-2); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.cats { display: flex; gap: 10px; margin: 0 -16px; padding: 0 16px 4px; overflow-x: auto; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; width: 96px; min-width: 0; }
.cat:active { opacity: .7; }
.cat img { width: 96px; height: 128px; border-radius: 8px; background: var(--bg-2); object-fit: cover; }
.cat .nm { margin-top: 6px; font-size: 12.5px; }
.cat .gm { margin-top: 1px; font-size: 11.5px; }
@media (max-height: 539px) { .cat { width: 72px; } .cat img { width: 72px; height: 96px; } .cat .nm { margin-top: 4px; font-size: 11.5px; } .cat .gm { font-size: 11px; } }
#acct.me svg { display: none; }
#acct.me img { width: 28px; height: 28px; border-radius: 50%; }
.sec + .sec { margin-top: 28px; }
.h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); }
.h b { color: var(--fg-2); font-weight: 600; }
.rows { display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 1fr); gap: 12px; align-items: start; }
.row:active .thumb img { opacity: .7; }
.thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--bg-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; transition: opacity .15s; }
.tag { position: absolute; left: 6px; top: 6px; padding: 0 5px; border-radius: 4px; background: var(--live); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; line-height: 17px; }
.vc { position: absolute; left: 6px; bottom: 6px; padding: 0 6px; border-radius: 4px; background: rgba(0,0,0,.72); color: #fff; font-size: 11.5px; font-weight: 600; line-height: 18px; font-variant-numeric: tabular-nums; }
.vc.r { left: auto; right: 6px; }
.meta { min-width: 0; }
.who { display: flex; align-items: center; gap: 7px; min-width: 0; }
.av { width: 22px; height: 22px; border-radius: 50%; background: var(--bg-2); object-fit: cover; flex: none; }
.nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt { margin-top: 3px; color: var(--fg-2); font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.gm { margin-top: 4px; color: var(--fg-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* with the room, pictures side by side. Too short for that (a closed Duo or a phone on its side), a picture beside its words, two across */
@media (min-width: 600px) and (min-height: 540px) {
  .rows { grid-template-columns: repeat(auto-fill, minmax(265px, 1fr)); gap: 20px 14px; }
  .row { grid-template-columns: 1fr; gap: 8px; }
}
@media (min-width: 560px) and (max-height: 539px) { .rows { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; } }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; height: 38px; padding-left: 5px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); font-size: 14px; max-width: 100%; }
.chip a { display: flex; align-items: center; gap: 8px; height: 100%; min-width: 0; }
.chip a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip img { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-3); }
.chip.on img { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 3.5px var(--live); }
.chip .x { width: 34px; height: 36px; display: grid; place-items: center; color: var(--fg-3); }
.chip .x svg { width: 15px; height: 15px; }
.offl { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 18px 6px; }
.offl a { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
.offl img { width: 52px; height: 52px; border-radius: 50%; background: var(--bg-2); filter: grayscale(.4); opacity: .85; }
.offl span { max-width: 100%; font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.offl small { margin-top: -5px; font-size: 11px; color: var(--fg-3); white-space: nowrap; }
.note { color: var(--fg-3); font-size: 14px; line-height: 1.5; }
.note button { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.sk { background: linear-gradient(90deg, var(--bg-2) 0, #202026 50%, var(--bg-2) 100%); background-size: 200% 100%; animation: sk 1.3s ease infinite; border-radius: 6px; }
.sk-line { height: 12px; margin-top: 8px; }

/* ── watch ────────────────────────────────────────── */
#watch { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: var(--sat); background: #000; }
.main { display: flex; flex-direction: column; flex: none; min-width: 0; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
.stage video.off { visibility: hidden; }
/* laid out small and scaled up to fill, so WebKit doesn't count it as main content (see Pill) */
.stage.pillfree video { inset: auto; left: 0; top: 0; width: calc(100% / var(--k, 2)); height: calc(100% / var(--k, 2)); transform: scale(var(--k, 2)); transform-origin: 0 0; }
video.decoy { position: fixed; left: 0; top: 0; width: 420px; height: 315px; z-index: -1; pointer-events: none; background: transparent; }
.hud { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; opacity: 0; transition: opacity .18s; pointer-events: none;
  background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 58%, rgba(0,0,0,.66)); }
.stage.ui .hud { opacity: 1; }
.stage.ui .hud .bar { pointer-events: auto; }
.stage.vod .hud { display: none; }
.bar { display: flex; align-items: center; gap: 2px; padding: 4px max(6px, var(--sar)) 4px max(6px, var(--sal)); }
.cb { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: #fff; }
.cb:active { background: rgba(255,255,255,.14); }
.hudt { flex: 1; min-width: 0; margin: 0 4px; color: #fff; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.hudt b { font-weight: 600; }
.hudt span { opacity: .8; font-size: 12.5px; }
.vol { width: 84px; margin: 0 4px; accent-color: #fff; cursor: pointer; }
@media (hover: none), (pointer: coarse) { .vol { display: none; } }
.lat { display: flex; align-items: center; gap: 7px; height: 30px; margin: 0 4px; padding: 0 11px; border-radius: 999px; background: rgba(24,24,28,.6); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lat i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.lat.cdn i { background: var(--warn); }
.lat.ad i { background: var(--live); }
#latBy { margin-left: -3px; }
#latBy::before { content: '· '; }
#latBy:empty { display: none; }
.mid { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.big { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: rgba(24,24,28,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; pointer-events: auto; }
.big svg { width: 30px; height: 30px; margin-left: 3px; }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; animation: rot .8s linear infinite; }
.banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); padding: 7px 13px; border-radius: 999px; background: rgba(24,24,28,.75); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; font-size: 12.5px; font-weight: 600; white-space: nowrap; pointer-events: none; transition: opacity .2s; }
.banner i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }
.banner span { overflow: hidden; text-overflow: ellipsis; }
.stage.ui .banner { opacity: 0; }
.unmute { position: absolute; right: max(12px, var(--sar)); bottom: 60px; display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 11px; border-radius: 999px; background: #fff; color: #000; font-size: 13.5px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
.unmute svg { width: 18px; height: 18px; }
.toast.gt { position: fixed; z-index: 30; bottom: calc(24px + var(--sab)); }
.toast { position: absolute; z-index: 1; left: 50%; bottom: 60px; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 8px 14px; border-radius: 10px; background: rgba(24,24,28,.88); color: #fff; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; animation: fade .2s; }
.msgbox { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px; text-align: center; background: #000; color: var(--fg-2); font-size: 14px; line-height: 1.45; }
.msgbox img { width: 60px; height: 60px; border-radius: 50%; background: var(--bg-2); }
.msgbox b { color: var(--fg); font-size: 16px; font-weight: 600; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line-2); font-size: 14px; font-weight: 600; color: var(--fg); }
.btn.pri { background: var(--fg); color: #000; border-color: transparent; }
.btn:active { opacity: .8; }
/* the channel under the picture: one thin row, the rest of it a tap away */
.info { display: flex; align-items: center; gap: 4px; padding: 2px max(10px, var(--sar)) 2px max(4px, var(--sal)); background: var(--bg); border-bottom: 1px solid var(--line); }
.info .cb { color: var(--fg-2); width: 36px; height: 40px; }
.info .who { flex: 1; gap: 9px; height: 40px; text-align: left; border-radius: 10px; }
.info .who:active { opacity: .7; }
.info .av { width: 28px; height: 28px; }
.info .meta { flex: 1; display: flex; align-items: baseline; gap: 8px; }
.info .nm { flex: none; max-width: 60%; font-size: 15px; }
.info .tt { display: none; }
.info .gm { flex: 1; min-width: 0; margin: 0; }
.fl { display: none; flex: none; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fg); color: #000; font-size: 13.5px; font-weight: 600; }
.fl.on { background: var(--bg-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-2); }
.fl:disabled { opacity: .5; }
#watch.chan .info { gap: 8px; padding-top: 9px; padding-bottom: 9px; }
#watch.chan .who { height: auto; }
#watch.chan .info .av { width: 40px; height: 40px; }
#watch.chan .info .meta { display: block; }
#watch.chan .info .nm { max-width: none; font-size: 16px; }
#watch.chan .info .tt { display: -webkit-box; -webkit-line-clamp: 1; margin-top: 1px; }
#watch.chan .info .gm { margin-top: 2px; }
#watch.chan .fl:not([hidden]) { display: block; }
#bChat2 { display: none; }
@media (orientation: landscape) and (min-width: 560px) { #watch.vodw #bChat2 { display: grid; } }
.side { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }
.tabs { display: none; align-items: center; gap: 6px; padding: 8px max(12px, var(--sar)) 8px max(12px, var(--sal)); border-bottom: 1px solid var(--line); }
#watch.chan .tabs { display: flex; }
.tabs [data-pane] { height: 32px; padding: 0 12px; border-radius: 999px; color: var(--fg-2); font-size: 13.5px; font-weight: 600; }
.tabs [data-pane].on { background: var(--bg-2); color: var(--fg); }
.tabs .cb { width: 36px; height: 32px; color: var(--fg-2); }
.pane { position: relative; flex: 1; min-height: 0; }
#paneChat { display: flex; flex-direction: column; }
.log { position: relative; flex: 1; min-height: 0; }
.chat { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 0 calc(10px + var(--sab)); font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.m { padding: 2px max(14px, var(--sar)) 2px max(14px, var(--sal)); }
.m .n { font-weight: 700; cursor: pointer; }
.m .rp { display: block; color: var(--fg-3); font-size: 12.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m.at { background: rgba(255,59,79,.13); box-shadow: inset 2px 0 var(--live); }
.m.hl { background: rgba(139,109,255,.15); box-shadow: inset 2px 0 #8b6dff; }
.m.first { box-shadow: inset 2px 0 var(--good); }
.m.old { opacity: .62; }
.m .mn { font-weight: 600; }
.emw { display: inline-grid; margin: -5px 0; vertical-align: middle; }
.emw > .em { grid-area: 1 / 1; place-self: center; margin: 0; }
.m .bd { display: inline-block; width: 18px; height: 18px; margin-right: 4px; vertical-align: -4px; }
.m .em { display: inline-block; height: 28px; width: auto; max-width: none; margin: -5px 0; vertical-align: middle; }
.m a { color: #9ec5ff; text-decoration: underline; text-underline-offset: 2px; }
.m.me .tx { font-style: italic; }
.m.sys { margin: 5px 0; padding-top: 6px; padding-bottom: 6px; color: var(--fg-2); background: rgba(255,255,255,.035); box-shadow: inset 2px 0 var(--fg-3); }
.m.sys .tx { display: block; color: var(--fg); margin-top: 2px; }
.m.note { color: var(--fg-3); font-size: 13px; }
.m.note.err { color: var(--warn); }
.m.gone { opacity: .3; }
.more { position: absolute; left: 50%; bottom: calc(14px + var(--sab)); transform: translateX(-50%); height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fg); color: #000; font-size: 13px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
/* the box for sending (see Talk), under a channel's chat */
.say { display: none; align-items: center; gap: 8px; padding: 8px max(10px, var(--sar)) calc(8px + var(--sab)) max(10px, var(--sal)); border-top: 1px solid var(--line); }
#paneChat.talk .say { display: flex; }
#paneChat.talk .chat { padding-bottom: 10px; }
#paneChat.talk .more { bottom: 14px; }
.say input { flex: 1; min-width: 0; height: 40px; padding: 0 15px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); outline: 0; font-size: 16px; -webkit-appearance: none; appearance: none; }
.say input:focus { border-color: var(--line-2); }
.say input::placeholder { color: var(--fg-3); font-size: 14.5px; }
.say input:placeholder-shown { text-overflow: ellipsis; }
.send { width: 40px; height: 40px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--fg); color: #000; }
.send svg { width: 20px; height: 20px; }
.send:disabled { opacity: .3; cursor: default; }
.signin { flex: 1; height: 40px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); color: var(--fg-2); font-size: 14px; font-weight: 600; }
.signin:active { background: var(--bg-3); }
.emo { width: 36px; height: 40px; display: grid; place-items: center; flex: none; margin-right: -4px; color: var(--fg-2); }
.emo.on { color: var(--fg); }
.ep { flex: 0 1 min(40dvh, 300px); min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--bg-1); }
.ep input { flex: none; height: 36px; margin: 8px max(10px, var(--sar)) 4px max(10px, var(--sal)); padding: 0 13px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); outline: 0; font-size: 16px; -webkit-appearance: none; appearance: none; }
.epl { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 max(10px, var(--sar)) 10px max(10px, var(--sal)); }

.epg { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 2px; }

.ac { display: flex; gap: 6px; padding: 7px max(10px, var(--sar)) 0 max(10px, var(--sal)); overflow-x: auto; scrollbar-width: none; }
.ac::-webkit-scrollbar { display: none; }
.ac button { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px; border-radius: 999px; background: var(--bg-2); font-size: 13px; white-space: nowrap; }
.ac .em { height: 20px; }
.vods { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 10px max(14px, var(--sar)) calc(16px + var(--sab)) max(14px, var(--sal)); }

.vod:active { opacity: .7; }
.vod .thumb { border-radius: 8px; }
.vod .tt { margin-top: 0; color: var(--fg); font-size: 14px; }
.pr { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--live); }

.desc { margin-top: 10px; color: var(--fg); font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-line; }
.desc.dim { color: var(--fg-3); font-size: 13px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.links .btn { height: 34px; padding: 0 13px; font-size: 13.5px; }
.st { display: inline-block; margin-right: 6px; padding: 0 5px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: .04em; line-height: 16px; vertical-align: 1px; background: var(--bg-3); color: var(--fg-2); }
.st.lv { background: var(--live); color: #fff; }

/* a screen with room for both (a phone on its side, a desktop window): video on the left, the panel docked on the right */
@media (orientation: landscape) and (min-width: 560px) {
  #watch { flex-direction: row; }
  .main { flex: 1; min-height: 0; justify-content: center; }   /* picture and channel row as one block */
  .stage { flex: none; max-height: calc(100% - 46px); }
  #watch.chan .stage { max-height: calc(100% - 78px); }
  .side { flex: none; width: clamp(300px, 32vw, 380px); border-left: 1px solid var(--line); }
}
@media (orientation: landscape) and (min-aspect-ratio: 8/5) { #watch.nochat:not(.chan) .side { display: none; } }
/* short screens give the channel row's height to the picture, except on videos and under a message, which covers the controls: there it holds the only way back */
@media (orientation: landscape) and (max-height: 560px) and (min-aspect-ratio: 8/5) { #watch:not(.vodw, .chan, :has(#msgbox:not([hidden]))) .info { display: none; } #watch:not(.vodw, .chan, :has(#msgbox:not([hidden]))) .stage { max-height: 100%; } }
/* A screen too square for that, like the inner screen of an iPhone Duo (951×669, with 84 down one side for iOS's status
   pill and clock), would be a third black. So the picture fills the width beside that strip and stays there, with a strip
   along the bottom: chat or the channel on the left, the box or the channel's tabs on the right, the channel row above
   those. Chat costs the picture nothing here, so there's no hiding it. With the keyboard up it goes back to side by side,
   which is what fits above it.
   Since iOS 27.2 a Home Screen app's page stops short of that strip and has no safe area there: 867×669 open, 382×678 closed and upright,
   594 wide closed on its side, which is why "room for both" starts at 560 wide. Laying the page out at the screen's size reached across
   the strip in Chrome and on the simulator (coder/xum#7976), and on the phone iOS blacked the strip out again with the page still under
   it and the controls with it, which the page can't see (Jerry, 2026-11-09: "when it reverts, I just lose all the control"). So the page
   is the one iOS gives, with the controls on the picture, and what's said below of the strip is for 27.1, which hands it over as a safe area. */
@media (orientation: landscape) and (min-width: 560px) and (max-aspect-ratio: 1599/1000) {
  #watch { container-type: size; --col: min(300px, 38cqw); }
  #watch:not(.kb) { flex-direction: column; }
  #watch:not(.kb) .main { flex: none; justify-content: flex-start; }
  #watch:not(.kb, .full) .stage { max-height: none; margin-left: var(--sal); width: min(calc(100cqw - var(--sar) - var(--sal)), calc((100cqh - 132px) * 16 / 9)); }
  #watch:not(.kb, .full) .stage:not(:fullscreen) .bar { padding-left: 6px; padding-right: 6px; }
  #watch:not(.kb, .full) .unmute { right: 12px; }
  #watch:not(.kb) .side { flex: 1; width: auto; min-height: 0; border-left: 0; border-top: 1px solid var(--line); }
  #watch:not(.kb) #paneChat { display: grid; grid-template-columns: minmax(0, 1fr) var(--col); grid-template-rows: minmax(0, 1fr) auto auto auto; }
  #watch:not(.kb) .log { grid-column: 1; grid-row: 1 / -1; border-right: 1px solid var(--line); }
  #watch:not(.kb) .chat { padding-bottom: max(14px, calc(var(--sab) - 14px)); }
  #watch:not(.kb) .m { padding-left: 14px; padding-right: 14px; }
  #watch:not(.kb) .rpb, #watch:not(.kb) .ac, #watch:not(.kb) .say { grid-column: 2; position: relative; z-index: 1; background: var(--bg); }
  #watch:not(.kb) .rpb { grid-row: 2; padding-top: 0; }
  #watch:not(.kb) .ac { grid-row: 3; }
  #watch:not(.kb) .say { grid-row: 4; border-top: 0; padding: 8px 16px 14px 10px; }
  /* the emotes take chat's place, which leaves the picture clear */
  #watch:not(.kb) .ep { grid-column: 1; grid-row: 1 / -1; z-index: 2; height: auto; min-height: 0; border-top: 0; border-right: 1px solid var(--line); }
  #watch:not(.kb) .ep input { margin: 6px 10px 2px; }
  #watch:not(.kb) .epl { padding: 0 10px 6px; }
  #watch:not(.kb) .epl h4 { margin: 6px 2px 3px; }
  #watch:not(.kb) .info { position: absolute; z-index: 1; right: 0; bottom: 8px; width: var(--col); padding: 0 12px 0 4px; border: 0; background: none; }
  #watch:not(.kb):has(#paneChat.talk) .info, #watch.chan:not(.kb) .info { bottom: 62px; }
  #watch:not(.kb, .chan):has(#rpb:not([hidden])) .info { bottom: 90px; }
  /* the channel, in chat's place */
  #watch:not(.kb) #paneVods, #watch:not(.kb) #paneAbout { margin-right: var(--col); border-right: 1px solid var(--line); }
  #watch:not(.kb) .vods { padding: 8px 14px; }
  #watch:not(.kb) #vods { display: grid; grid-auto-flow: column; grid-auto-columns: 290px; grid-template-rows: repeat(auto-fill, 72px); gap: 0 12px; align-content: start; overflow: auto hidden; }
  #watch:not(.kb) #vods .vod { grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 4px 0; }
  #watch:not(.kb) #vods .note { grid-row: 1; }
  #watch:not(.kb) .tabs { position: absolute; right: 0; bottom: 0; width: var(--col); height: 62px; padding: 8px 16px 14px 10px; border: 0; }
  #watch.chan:not(.kb) { --col: min(320px, 46cqw); }
  #bChat, #watch.vodw #bChat2 { display: none; }
  /* The strip beside the picture is iOS's: its island, clock and Wi-Fi run down it to about 185, centred 48 in from the edge. Below
     them it's dead space with room for the controls, in line with those: there they can stay out, off the picture. */
  html[data-strip] #watch:not(.kb, .full) .stage { overflow: visible; }
  html[data-strip] #watch:not(.kb, .full) .hud { opacity: 1; background: none; }
  html[data-strip] #watch:not(.kb, .full) .hud .bar:first-child { display: none; }
  html[data-strip] #watch:not(.kb, .full) .hud .bar:last-child { position: absolute; top: 190px; bottom: 0; width: 72px; flex-direction: column; justify-content: space-evenly; gap: 0; padding: 0; pointer-events: auto; }
  html[data-strip=right] #watch:not(.kb, .full) .hud .bar:last-child { left: 100%; }
  html[data-strip=left] #watch:not(.kb, .full) .hud .bar:last-child { right: 100%; }
  html[data-strip] #watch:not(.kb, .full) .hud .sp { display: none; }
  html[data-strip] #watch:not(.kb, .full) .lat { display: grid; grid-template-columns: auto auto; justify-content: center; gap: 0 5px; height: auto; margin: 0; padding: 7px 4px; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  html[data-strip] #watch:not(.kb, .full) #latBy { grid-column: 1 / -1; margin: 0; text-align: center; }
  html[data-strip] #watch:not(.kb, .full) #latBy::before { content: none; }
  html[data-strip] #watch:not(.kb, .full) .banner { opacity: 1; }
  html[data-strip] #watch:not(.kb, .full) .toast, html[data-strip] #watch:not(.kb, .full) .unmute { bottom: 12px; }
  html[data-strip] #watch:has(#msgbox:not([hidden])) .hud { display: none; }
}
/* The closed screen's island is around its camera, which stays where it is as you turn the phone. With the strip on the left it's at
   the top of the strip, to 134 with Now Playing in it and well short of 96 without (Jerry, 2026-11-05: "this orientation no longer has
   pill either"): the controls run down the rest of the strip in a column, in line with it, as on the open screen. With the strip on the right it's at the
   foot, level with the strip along the bottom, which stops short of it, and the controls have the top to themselves. */
@media (orientation: landscape) and (min-width: 560px) and (max-aspect-ratio: 1599/1000) and (max-height: 599px) {
  html[data-strip=left] #watch:not(.kb, .full) .hud .bar:last-child { top: 96px; }
  html[data-strip=right] #watch:not(.kb, .full) .hud .bar:last-child { top: 0; width: 84px; }
  html[data-strip=right] #watch:not(.kb, .idle) .side { margin-right: var(--sar); }
  html[data-strip=right] #watch:not(.kb, .idle) .info, html[data-strip=right] #watch:not(.kb, .idle) .tabs { right: var(--sar); }
  .say input { padding: 0 10px; }
  .say input::placeholder { font-size: 12.5px; }
  #watch:not(.kb) .ep input { height: 30px; }
  #watch:not(.kb) .epl h4:first-child { display: none; }
  #watch:not(.kb) #vods { grid-template-rows: 1fr; grid-auto-columns: 300px; }
  #watch:not(.kb) #vods .vod { grid-template-columns: 150px minmax(0, 1fr); }
}
/* the row has room above the box for its text one line over another, and for as much of the title as fits */
@media (orientation: landscape) and (min-width: 560px) and (max-aspect-ratio: 1599/1000) {
  #watch:not(.kb) .who { height: auto; }
  #watch:not(.kb) .info .av { width: 40px; height: 40px; }
  #watch:not(.kb) .info .meta { display: block; }
  #watch:not(.kb) .info .nm { max-width: none; font-size: 15px; }
  #watch:not(.kb) .info .tt { display: -webkit-box; -webkit-line-clamp: 1; margin-top: 1px; font-size: 13px; }
  #watch:not(.kb) .info .gm { margin-top: 2px; }
  #watch:not(.kb, .chan):has(#rpb:not([hidden])) .info .tt { display: none; }
}
@media (orientation: landscape) and (min-width: 560px) and (max-aspect-ratio: 1599/1000) and (min-height: 600px) {
  #watch:not(.kb) .info .tt { -webkit-line-clamp: 2; }
  #watch:not(.kb, .chan):has(#rpb:not([hidden])) .info .tt { display: -webkit-box; }
}
@media (orientation: landscape) and (min-width: 560px) and (max-aspect-ratio: 143/100) and (min-height: 600px) {
  #watch:not(.kb) .info .tt { -webkit-line-clamp: 4; }
  #watch:not(.kb, .chan):has(#rpb:not([hidden])) .info .tt { -webkit-line-clamp: 2; }
}
/* typing: where the screen's tall enough the box is well below iOS's things in the strip, and the picture stays out of it. So only
   what's beside the strip keeps clear of it. */
@media (orientation: landscape) {
  @media (min-height: 600px) { html[data-strip=right] #watch.kb .say { padding-right: 10px; } }
  html[data-strip=left] #watch.kb .main { padding-left: var(--sal); }
  html[data-strip=left] #watch.kb .side { --sal: 0px; }
  html[data-strip] #watch.kb .stage { --sal: 0px; --sar: 0px; }
}
html[data-strip] #watch:not(.kb) .rpb, html[data-strip] #watch:not(.kb) .ac { --sal: 0px; --sar: 0px; }
@media not ((orientation: landscape) and (min-width: 560px)) { #bChat { display: none; } }
/* fullscreen on an iPhone when iOS's own player won't take the video: the player fills the page, edge to edge, with the controls clear of iOS's strip (see UI.fill) */
#watch.full .stage { position: fixed; inset: 0; z-index: 5; width: auto; height: auto; max-height: none; margin: 0; aspect-ratio: auto; overflow: hidden; border-radius: 0; background: #000; }
#watch.full .hud { padding: var(--sat) 0 var(--sab); }
#watch.full #bChat { display: none; }
/* An offline channel has no picture to give the screen to: its page is its row, a line saying so, and its videos. */
@media not ((orientation: landscape) and (min-aspect-ratio: 8/5)) {
  #watch.idle .info { order: -1; border-bottom: 0; }
  #watch.idle .info .gm { display: none; }
  #watch.idle .stage { aspect-ratio: auto; width: 100%; max-height: none; margin: 0; overflow: visible; background: var(--bg); }
  #watch.idle .stage > :not(.msgbox, .toast) { display: none; }
  #watch.idle .msgbox { position: static; flex-direction: row; flex-wrap: wrap; justify-content: flex-start; gap: 0 8px; padding: 2px max(14px, var(--sar)) 6px max(14px, var(--sal)); text-align: left; background: none; font-size: 13.5px; }
  #watch.idle .msgbox img { display: none; }
  #watch.idle .msgbox b { font-size: 13.5px; }
  #watch.idle .main { background: var(--bg); }
  #watch.idle .side { border-top: 1px solid var(--line); }
  #watch.idle #vods { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 14px; align-content: start; }
}
@media (orientation: landscape) and (min-width: 560px) and (max-aspect-ratio: 1599/1000) {
  #watch.idle:not(.kb) .info { position: static; width: auto; padding: 4px max(12px, var(--sar)) 4px max(4px, var(--sal)); background: var(--bg); }
  #watch.idle:not(.kb) .tabs { position: static; width: auto; height: auto; padding: 6px max(12px, var(--sar)) 6px max(12px, var(--sal)); border-bottom: 1px solid var(--line); }
  #watch.idle:not(.kb) #paneVods, #watch.idle:not(.kb) #paneAbout { margin-right: 0; border-right: 0; }
  #watch.idle:not(.kb) .vods { padding-left: max(14px, var(--sal)); padding-right: max(14px, var(--sar)); padding-bottom: calc(8px + var(--sab)); }
  #watch:not(.kb) #about { padding-bottom: calc(8px + var(--sab)); }
  #watch.idle:not(.kb) #paneChat { grid-template-columns: minmax(0, 1fr); padding: 0 var(--sar) 0 var(--sal); }
  #watch.idle:not(.kb) .m { padding-left: calc(max(14px, var(--sal)) - var(--sal)); padding-right: calc(max(14px, var(--sar)) - var(--sar)); }
  #watch.idle:not(.kb) .log, #watch.idle:not(.kb) .ep { grid-row: 1; border-right: 0; }
  #watch.idle:not(.kb) .rpb, #watch.idle:not(.kb) .ac, #watch.idle:not(.kb) .say { grid-column: 1; }
  #watch.idle:not(.kb) .say { padding: 8px 10px calc(8px + var(--sab)); border-top: 1px solid var(--line); }
  #watch.idle:not(.kb) #vods { grid-auto-flow: row; grid-auto-columns: auto; grid-template-rows: none; gap: 2px 14px; overflow: hidden auto; }
  #watch.idle:not(.kb) #vods .vod { grid-template-columns: 136px minmax(0, 1fr); gap: 12px; padding: 6px 0; }
}
/* typing, with the on-screen keyboard up: picture, chat and the box share the space above it (see fitKeyboard) */
#watch.kb .info, #watch.kb .tabs { display: none; }
#watch.kb .say { padding-bottom: 8px; }
#watch.kb:has(#epq:focus) .log { display: none; }   /* finding an emote: the results get what's left above the keyboard */
#watch.kb:has(#epq:focus) .ep { flex: 1; }
#watch.kb .stage { max-height: 100%; }
/* a screen short enough above the keyboard has the picture give way, down to a strip of it, for chat or the emotes */
@media (orientation: portrait) {
  #watch.kb:not(.idle) .main { flex: 0 1 auto; min-height: 90px; }
  #watch.kb:not(.idle) .stage { flex: 0 1 auto; min-height: 0; }
  #watch.kb:not(.idle) .side { flex: 1 0 167px; }
  #watch.kb:not(.idle):has(#epq:focus) .side { flex-basis: 193px; }
}
/* A closed Duo upright has iOS's island, clock and Wi-Fi down the right and nothing across the top: to 161 (Jerry's screenshot,
   2026-11-05), or to 228 with Now Playing in there, which shows for a past video. So the picture
   starts just below them, the width of the screen; the channel's row goes beside them, above it; and chat runs from under the picture
   down to its box (Jerry, 2026-11-05: "you can move the video up ... find an elegant solution for the chat"). A sheet stops short of
   them too. Only what doesn't hold the video gets rearranged: changing how a playing video's parents display makes iOS rebuild its layer. */
@media (orientation: portrait) {
  html[data-strip] #watch:not(.full, .idle) { --top: 170px; background: var(--bg); }
  html[data-strip] #watch.vodw:not(.full, .idle) { --top: 232px; }
  html[data-strip] #watch:not(.full, .idle) :is(.side, #paneChat) { display: contents; }
  html[data-strip] #watch:not(.full, .idle) .main { order: 1; }
  html[data-strip] #watch:not(.full, .idle) .tabs { order: 2; }
  html[data-strip] #watch:not(.full, .idle) :is(.log, .ep, .pane) { order: 3; flex: 1 1 0; min-height: 0; }
  html[data-strip] #watch:not(.full, .idle):has(#ep:not([hidden])) .log { display: none; }
  html[data-strip] #watch:not(.full, .idle) .rpb { order: 4; }
  html[data-strip] #watch:not(.full, .idle) .ac { order: 5; }
  html[data-strip] #watch:not(.full, .idle) .say { order: 6; }
  html[data-strip] #watch:not(.full, .idle) :is(.stage > *, .tabs, .log, .ep, .pane, .rpb, .ac, .say) { --sal: 0px; --sar: 0px; }
  /* the row, beside iOS's things: its text one line over another, with as much of the title as fits */
  html[data-strip] #watch:not(.full, .idle) .info { order: -1; min-height: var(--top); gap: 6px; padding-top: 10px; padding-bottom: 10px; border-bottom: 0; }
  html[data-strip] #watch:not(.full, .idle) .info .who { height: auto; gap: 12px; }
  html[data-strip] #watch:not(.full, .idle) .info .av { width: 48px; height: 48px; }
  html[data-strip] #watch:not(.full, .idle) .info .meta { display: block; }
  html[data-strip] #watch:not(.full, .idle) .info .nm { max-width: none; font-size: 17px; }
  html[data-strip] #watch:not(.full, .idle) .info .tt { display: -webkit-box; -webkit-line-clamp: 3; margin-top: 3px; font-size: 13.5px; }
  html[data-strip] #watch:not(.full, .idle) .info .gm { margin-top: 4px; font-size: 13px; }
  html[data-strip] #watch.kb:not(.full, .idle) .log { flex: 1 0 110px; }
  html[data-strip] #watch.kb:not(.full, .idle):has(#epq:focus) .ep { flex: 1 0 136px; }
  html[data-strip] #watch.kb:not(.full, .idle) .stage { width: calc(100% - var(--sal) - var(--sar)); margin-left: var(--sal); }
  html[data-strip] .panel { max-height: calc(100dvh - 174px); }
  html[data-strip]:has(#watch.vodw:not([hidden])) .panel { max-height: calc(100dvh - 236px); }
}

/* ── settings sheet ───────────────────────────────── */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: fade .2s; }
.panel { position: relative; width: 100%; max-width: 520px; max-height: 86dvh; overflow-y: auto; padding: 8px 16px calc(18px + var(--sab)); background: var(--bg-1); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; animation: up .25s cubic-bezier(.2,.8,.2,1); }
@keyframes side { from { transform: translateX(28px); opacity: 0; } }
@media (orientation: portrait) and (min-width: 600px) { .sheet { align-items: center; } .panel { border-radius: 20px; border-bottom: 1px solid var(--line); } }
/* on its side, a sheet comes in from the edge, as tall as the screen, and the picture stays in view */
@media (orientation: landscape) and (min-width: 560px) {
  .sheet { align-items: stretch; justify-content: flex-end; }
  .scrim { background: rgba(0,0,0,.3); }
  .panel { width: calc(min(380px, 50vw) + var(--sar)); max-width: none; max-height: none; padding: calc(var(--sat) + 8px) calc(var(--sar) + 16px) calc(18px + var(--sab)) 16px; border-width: 0 0 0 1px; border-radius: 0; animation-name: side; }
  .grab { display: none; }
  .panel h3:first-child, .panel .card:first-child { margin-top: 8px; }
}
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 2px auto 8px; }
.panel h3 { margin: 16px 4px 8px; font-size: 12.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg-3); }
.opts { background: var(--bg-2); border-radius: 13px; overflow: hidden; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 10px 14px; text-align: left; }
.opt + .opt { border-top: 1px solid var(--line); }
.opt:active { background: var(--bg-3); }
.opt .l { flex: 1; min-width: 0; font-size: 15px; }

<script>
(() => {
'use strict';

// This page's version, worked out from its own code: the relay's counts say which build each page calling it is running, and a
// newer page on the server is one whose code works out differently.
const buildOf = s => { let h = 7; for (let i = 0; i < s.length; i += 3) h = Math.imul(h, 31) + s.charCodeAt(i) | 0; return (h >>> 0).toString(36); };
const BUILD = buildOf(document.currentScript?.textContent || '');
const CID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';
// "Wraith relay 2" Apps Script. Twitch's playlist servers turn away browsers on other
// sites, so playlists come through it; the video itself loads straight from Twitch's CDN.
// The first project, "Wraith relay", went bad on 2026-11-12: from about 13:20 Google sat on 3 to 7 calls in 10 to it and never ran them,
// for ten hours and counting, while the same code in a project made that night answered 24 of 24 in the same minutes. A new address
// for the old project sat on as many, so if this one goes the same way, it's a new project it wants, not a new deployment.
const RELAY = 'https://script.google.com/macros/s/AKfycbyhCHjVig1unp9uDzYnZnRamWEoW05su6fPSVnk3t5qxqlwkIVtBGSVVCoDCmAMOPp-1A/exec';
// Twitch's TV app. Its device sign-in (a code you approve on Twitch) works from any page with no registered
// app, and asking as it gets past the integrity check that stops the web client paging through lists.
const TV_CID = 'ue6666qo983tsx6so1t0vnawi233wa';
// ironat___'s follows, newest first: the list until you sign in, when it starts coming from Twitch itself.
const FOLLOWS = ('forsen redify kaise meltymim menmakiii powdur ruiasaka jellyhoshiumi emiru filian maliceevermore '
  + 'smugalana zenyahima halo_sweety leaflit zackrawrr xqc kiskachan amano_nene pillowdearasmr marimari_en sera_promisu '
  + 'kirsche fallenshadow asmongold sakae_izumi senzawa ikumi jinnytty nintendo nasa').split(' ');
// Seconds behind the broadcast each feed holds. Live backs off from 2 s when the connection
// stalls and creeps back down once it has been smooth for a while.
const TARGET = { live: 2, liveMax: 5, cdn: 16, cdnMax: 32 };

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('wraith.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('wraith.' + k, JSON.stringify(v)); } catch {} },
};
const rid = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
const DEVICE = store.get('device', null) || (() => { const d = rid(32); store.set('device', d); return d; })();

// ── icons ───────────────────────────────────────────
const PATHS = {
  back: '<path d="M15 5l-7 7 7 7"/>',
  play: '<path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.6-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z" fill="currentColor" stroke="none"/>',
  pause: '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>',
  vol: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.8 6.5a8 8 0 0 1 0 11"/>',
  mute: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  full: '<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>',
  unfull: '<path d="M9 4v4a1 1 0 0 1-1 1H4M15 4v4a1 1 0 0 0 1 1h4M20 15h-4a1 1 0 0 0-1 1v4M4 15h4a1 1 0 0 1 1 1v4"/>',
  refresh: '<path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  chat: '<path d="M5 5h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-8l-4 3v-3H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
  send: '<path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/>',
  smile: '<circle cx="12" cy="12" r="8.5"/><path d="M8.5 14a4 4 0 0 0 7 0M9.5 10h.01M14.5 10h.01"/>',
  user: '<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[n]}</svg>`;
function setIcon(node, n) {
  if (node.dataset.i === n && node.querySelector('svg')) return;
  node.dataset.i = n;
  node.querySelector('svg')?.remove();
  node.insertAdjacentHTML('afterbegin', icon(n));
}
document.querySelectorAll('[data-i]').forEach(n => n.insertAdjacentHTML('afterbegin', icon(n.dataset.i)));
$('logo').innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M14 56V29a18 18 0 0 1 36 0v27l-6-4.5-6 4.5-6-4.5-6 4.5-6-4.5z"/><ellipse cx="25.5" cy="29" rx="3.4" ry="4.4" fill="#0b0b0d"/><ellipse cx="38.5" cy="29" rx="3.4" ry="4.4" fill="#0b0b0d"/></svg>';

// ── small helpers ───────────────────────────────────
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function pic(src, cls, lazy) { const i = el('img', cls); i.alt = ''; i.decoding = 'async'; if (lazy) i.loading = 'lazy'; if (src) i.src = src; return i; }   // lazy before the address: WebKit goes for the picture as the address is set
const count = n => n >= 999500 ? +(n / 1e6).toFixed(1) + 'M' : n >= 1e5 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? +(n / 1e3).toFixed(1) + 'K' : String(n);
const dur = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m`; };
const clock = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const uptime = iso => dur((Date.now() - Date.parse(iso)) / 1000);
const day = iso => { const d = new Date(iso); return d.toLocaleDateString(undefined, Date.now() - d > 3e10 ? { month: 'short', year: 'numeric' } : { month: 'short', day: 'numeric' }); };   // nearly a year back, the year says more than the day
const ago = iso => { const s = (Date.now() - Date.parse(iso)) / 1000; return s < 3600 ? `${Math.max(1, Math.floor(s / 60))}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : s < 604800 ? `${Math.floor(s / 86400)}d ago` : day(iso); };
const when = iso => { const d = new Date(iso); return d.toLocaleString(undefined, d - Date.now() < 6048e5 ? { weekday: 'short', hour: 'numeric', minute: '2-digit' } : { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
const emoteUrl = id => id.startsWith('kick') ? `https://files.kick.com/emotes/${id.slice(4)}/fullsize` : `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/dark/2.0`;
// Never offered in the picker or completion, going by name: Twitch's Pride sets and the gay, trans and gachi ones on
// 7TV, BTTV and FFZ. "gay" goes by case to spare KasugaYeah. They still show in chat when someone posts one.
const unwanted = name => /[gG](ay|AY)/.test(name) || /pride|gachi|billy|femboy|queer|lesbian|lgbt|bisexual|nonbinary|trans(?!form|it|lat|port|fer|act|cend|par|mit|cri)|twitchunity|virtualhug|blacklivesmatter/i.test(name);
const norm = s => String(s || '').trim().toLowerCase().replace(/^(https?:\/\/)?((www|m)\.)?twitch\.tv\//, '').replace(/[/?#].*$/, '').replace(/^@/, '');
const validLogin = s => /^[a-z0-9_]{2,25}$/.test(s);
const cdnPath = url => (url || '').match(/^(https:\/\/[^/]+\/[^/]+)\/storyboards\//)?.[1] || null;
const revoke = urls => urls?.forEach(u => { if (u?.startsWith('blob:')) URL.revokeObjectURL(u); });
const weight = x => x.h * x.h * (x.fps || 30);   // what a rendition asks of a decoder, to compare two: pixels a second, near enough
function bufAhead(v) {
  const b = v.buffered, t = v.currentTime;
  for (let i = 0; i < b.length; i++) if (b.start(i) <= t + 0.25 && b.end(i) > t) return b.end(i) - t;
  return 0;
}
const holds = (v, t) => { const b = v.buffered; for (let i = 0; i < b.length; i++) if (b.start(i) <= t && b.end(i) > t + 0.3) return true; return false; };   // loaded there, with a little to play
// Where a moment of a live stream (Twitch's stamp, in ms) falls on an hls.js player's clock: in the segment holding it, or reckoned on from
// the newest one listed, as Twitch's segments run back to back. The picture and the sound are stamped alike, which is how one finds the other.
function posAt(h, when) {
  const fr = h?.latestLevelDetails?.fragments;
  if (!fr?.length || !Number.isFinite(when)) return null;
  let f = null;
  for (const x of fr) if (x.programDateTime != null && x.programDateTime <= when) f = x;
  f ||= fr.find(x => x.programDateTime != null);
  return f ? f.start + (when - f.programDateTime) / 1000 : null;
}

// ── Twitch ──────────────────────────────────────────
const gqlPost = (body, client, extra) => fetch('https://gql.twitch.tv/gql', { method: 'POST', headers: { 'Client-ID': client, 'Content-Type': 'application/json', 'X-Device-Id': DEVICE, ...extra }, body: JSON.stringify(body), signal: AbortSignal.timeout(15e3) });   // a request a dead connection holds would hold the start up for good

async function gql(query, variables, client = CID) {
  const r = await gqlPost({ query, variables }, client);
  if (!r.ok) throw new Error(`Twitch answered ${r.status}`);
  const j = await r.json();
  if (!j.data) throw new Error(j.errors?.[0]?.message || 'Twitch error');
  return j.data;
}

const USER = `id login displayName profileImageURL(width: 150) broadcastSettings { title }
  stream { id createdAt viewersCount type game { displayName } previewImageURL(width: 440, height: 248) }
  videos(first: 1, sort: TIME) { edges { node { id status seekPreviewsURL } } }
  lastBroadcast { startedAt }`;

// One users(logins:) field takes up to 100 names. (Aliasing user() per name is capped at 15 per
// request, which is what broke the old page's live list.)
async function getUsers(logins) {
  const batches = [];
  for (let i = 0; i < logins.length; i += 100) batches.push(logins.slice(i, i + 100));
  const out = await Promise.all(batches.map(async b => {
    const d = await gql(`query($l: [String!]) { users(logins: $l) { ${USER} } }`, { l: b });
    const byLogin = new Map((d.users || []).filter(Boolean).map(u => [u.login, Object.assign(u, { at: Date.now() })]));
    return b.map(l => byLogin.get(l) || null);
  }));
  return out.flat();
}

// The kind of player a stream is asked for as. Through the relay a "site" session gets no preroll as long as the
// request carries a device ID (gql always sends one); the others are for when an ad turns up anyway (see P.dodge).
const PLAYER_TYPES = ['site', 'popout', 'embed', 'frontpage'];
const TOKEN_QUERY = 'query($l: String!, $t: String!) { streamPlaybackAccessToken(channelName: $l, params: { platform: "web", playerBackend: "mediaplayer", playerType: $t }) { value signature authorization { isForbidden forbiddenReasonCode } } }';
async function getToken(login, type = P.playerType) {
  return (await gql(TOKEN_QUERY, { l: login, t: type })).streamPlaybackAccessToken;
}
// For picking a stream back up: your account's, if anonymous is turned away because it's sub-only.
async function tokenFor(login) {
  const tok = await getToken(login).catch(() => null);
  return tok?.authorization?.isForbidden ? Me.streamToken(login) : tok;
}
const noToken = tok => !tok || !!tok.authorization?.isForbidden;   // none, or one Twitch won't play (sub-only)

function usherUrl(login, tok) {
  const q = new URLSearchParams({
    acmb: 'e30=', allow_source: 'true', allow_audio_only: 'true', cdm: 'wv', fast_bread: 'true',
    p: String(1e6 + Math.floor(Math.random() * 9e6)), platform: 'web', play_session_id: rid(32),
    player_backend: 'mediaplayer', playlist_include_framerate: 'true', reassignments_supported: 'true',
    sig: tok.signature, supported_codecs: 'h264', token: tok.value,
  });
  return `https://usher.ttvnw.net/api/channel/hls/${login}.m3u8?${q}`;
}

// Where the live stream's recording sits on Twitch's CloudFront CDN. The recording VOD names the
// exact path; without one, rebuild it with the TwitchRecover formula sha1(login_streamid_epoch).
async function cdnBase(u) {
  const v = u.videos?.edges?.[0]?.node, path = cdnPath(v?.seekPreviewsURL);
  if (path && v.status === 'RECORDING') return path;
  const host = path ? new URL(path).host : 'd2nvs31859zcd8.cloudfront.net';
  const raw = `${u.login}_${u.stream.id}_${Math.floor(Date.parse(u.stream.createdAt) / 1000)}`;
  const sha = new Uint8Array(await crypto.subtle.digest('SHA-1', new TextEncoder().encode(raw)));
  return `https://${host}/${Array.from(sha, b => b.toString(16).padStart(2, '0')).join('').slice(0, 20)}_${raw}`;
}

// ── Kick ────────────────────────────────────────────
// xQc streams on Kick too, mostly alongside Twitch and now and then there alone (Jerry, 2026-11-13: "is it possible to implement kick for xqc
// only"). Twitch login → Kick name, for the channels watched there as well.
const KICK = { xqc: 'xqc' };
// Kick's channel API answers any site (it hands the asking page's own address back). Its stream is Amazon IVS, which Twitch's own video grew
// out of: the same playlists, 2 s segments stamped with the time, and the next two listed ahead (as #EXT-X-PREFETCH). The top playlist answers
// only Kick's own sites, so that one comes through the relay; the renditions' playlists and the segments answer anyone, so the picture asks for
// them itself and polling costs the relay nothing. Kick's token opts its viewers out of ads.
async function kickChannel(slug) {

// Inside a tap, start-and-stop every player: Safari then lets any of them start with sound later
// (an ad break or leaving the app switches players with no tap to hang it on).
function unlock() {
  if (ios && !Pill.decoy) Pill.make();   // its stand-in made inside a tap, and ready by the time a picture plays
  for (const v of [vL, vC, aBG]) {
    const was = v.paused;
    const p = v.play(); if (p) p.catch(() => {});
    if (was) v.pause();
  }
}

if (!store.get('qualityReset', false)) { store.set('quality', 'source'); store.set('qualityReset', true); }   // old builds saved their own step-downs as your pick

// All there is to know about what's open, as it stands with nothing open. Closing puts it all back.
const nothingOpen = () => ({
  login: null, user: null, vod: null,
  feed: null,                        // what's on screen: 'live' | 'cdn' | 'vod'
  tokenP: null, audioUrl: null,      // the token the first start uses; this session's audio_only playlist
  groups: [], subOnly: false,        // the renditions hls.js found; whether only the CDN can play this
  base: null, start: 0, seekPending: false,   // the copy on the CDN, when the stream began, whether the copy's yet to be seeked into
  rend: null, asks: 0, played: null, failedAt: 0,   // the name the copy turned out to be under; how often it's been asked for again; the address of one that has played; when it last failed
  vodSrcs: null, vodAudio: null, vodAt: 0,    // addresses for a video and its sound, best first; where to put it once it has loaded
  ad: false, adEnd: 0, cover: false, // an ad break, when it ends, and whether the CDN feed is covering it
  dodged: new Set(), dodging: false, // kinds of session already tried on this ad break
  cap: 0, capWait: 180e3, lastStall: 0, stalls: [],   // renditions below the pick that buffering has forced, for this stream only
  choked: [],                        // stalls with seconds still loaded and frames being dropped: the device, not the connection (tooMuch)
  rate: 'normal', liveT: TARGET.live, calm: Date.now(),   // speed; current live target, and since when playback has been smooth
  cdnT: TARGET.cdn, cdnDry: 0, sought: 0,   // the CDN feed's target for this stream, when it last ran dry, and when the page last moved it
  retries: 0, fixes: 0, began: 0,    // restarts and media recoveries in a row with nothing to show; when the live player last started
  quietUntil: 0,                     // stalls before this are the player starting up, not the network
  pos: -1, moved: 0, gone: 0,        // where the picture last was and when; how many refreshes in a row said offline
  userPaused: false, pausedAt: 0, resumedAt: 0,   // a pause you chose; when the picture last paused; when its loading last started up again
  pausedAway: false,                 // held only because the stream restarted with nobody looking or listening: coming back plays it
  playBack: false,                   // a start iOS wouldn't take out of sight: coming back plays it
  taken: false, waitsForYou: false,  // something outside the page stopped the picture; a start held back for lack of anyone here: a tap or coming back plays it
  started: false, relayGone: false,  // whether a picture has played since this was opened; whether the relay's out for the day
  asked403: false, liveId: null,     // whether a refusal has been asked about with a fresh token; the broadcast the live player is on
  openedAt: 0, quietStart: false,    // when this was opened; a stream that started by itself with nobody touching the screen lately, so muted
  ranAt: 0, ranT: -1,                // when the picture last moved or started playing, and where it was then
  refreshDue: false,                 // a look at the channel skipped with nobody waiting on it (out of sight with no sound, nobody about), for later
  errs: {},                          // player errors this stream, for the stats panel
  kick: null, src: 'twitch',         // the channel on Kick, for one that streams there too (KICK); where the live picture comes from
});

const P = {
  ...nothingOpen(),
  gen: 0, hls: null, liveRun: 0, timer: 0, retryT: 0,
  playerType: PLAYER_TYPES.includes(store.get('playerType', '')) ? store.get('playerType', '') : PLAYER_TYPES[0],
  pref: store.get('feed', 'live'),   // the feed picked in the sheet: 'live' | 'cdn'
  q: store.get('quality', 'source'), // 'source' | 'auto' | a rendition like '720p60'
  heavy: null, chokedAt: 0, fq: [],  // the lightest rendition this device has failed to keep up with, till the page reloads or a quality is picked; when it last choked; frame counts over the last half minute
  skipped: 0,                        // ad breaks since the app started, for the stats panel
  labelled: 0, restAfter: 5000,      // when the latency label was last written; how long a pause before loading stops

  async open(login, gesture, cached) {
    this.close();
    const gen = ++this.gen;
    this.login = login; this.openedAt = Date.now();
    if (gesture) unlock();
    UI.watch(login, cached);
    // a page iOS loaded out of sight asks nothing of anyone till it's looked at (Pages.seen), and then about the stream as it is by then
    if (!Pages.shown) { await Pages.seen(); if (gen !== this.gen) return; this.openedAt = Date.now(); }
    const kickP = KICK[login] ? kickChannel(KICK[login]).catch(() => null) : null;   // asked alongside Twitch
    // A channel on Kick too gets its chat once it's known which the picture's from: Twitch's opened first would show for a moment and be gone
    if (kickP) { Chat.clear(); Chat.note('Connecting to chat…').classList.add('wait'); } else Chat.open(login);
    this.tokenP = getToken(login).catch(e => e);
    try {
      const u = cached && Date.now() - cached.at < 60e3 ? cached : (await getUsers([login]))[0];
      if (gen !== this.gen) return;
      if (!u) return UI.msg(null, `No channel called “${login}”`, 'Check the spelling and try again.');
      this.user = u;
      UI.info(u); Recent.add(u);
      if (!kickP) Chat.channel(u.id);
      this.kick = kickP && await kickP;
      if (gen !== this.gen) return;
      const kick = this.kick?.live && (!u.stream || store.get('src.' + login, 'twitch') === 'kick');   // live on Kick alone, or Kick's your pick
      if (kickP) { if (kick) this.src = 'kick'; this.chat(); }
      if (!u.stream && !kick) {   // the seat's this page's from now, as for a stream: a page you opened later, or come back to, takes it from here
        if (Pages.seated && Pages.taking()) Pages.ask();
        UI.offline(u);
        return this.awaitLive();
      }
      if (u.stream) {
        this.start = Date.parse(u.stream.createdAt) / 1000;
        this.base = await cdnBase(u);
        if (gen !== this.gen) return;
      }
      if (!(await Pages.confirm()) || gen !== this.gen) return;
      if (kick) this.kickOn();
      else if (this.pref === 'cdn' && cdnLive) this.playCdn(); else this.playLive();
      this.timer = setInterval(() => this.refresh(), 60e3);
    } catch (e) {
      if (gen !== this.gen) return;
      if (kickP && !Chat.login) Chat.open(login);
      UI.msg(null, 'Couldn’t reach Twitch', e.message, () => this.open(login));
    }
  },

  async openVod(id, gesture) {
    this.close();
    const gen = ++this.gen;
    if (gesture) unlock();
    UI.watch(null);
    Chat.clear();
    if (!Pages.shown) { await Pages.seen(); if (gen !== this.gen) return; }   // as for a stream
    try {
      const d = await gql(`query($id: ID!) { video(id: $id) { id title lengthSeconds createdAt status seekPreviewsURL resourceRestriction { type } game { displayName } owner { id login displayName profileImageURL(width: 150) } } }`, { id });
      if (gen !== this.gen) return;
      const v = d.video;
      if (!v) return UI.msg(null, 'Video not found', 'It may have been deleted.');
      if (v.status === 'RECORDING' && v.owner?.login) {   // still live: watch the stream instead
        history.replaceState(history.state, '', '?c=' + v.owner.login);
        return this.open(v.owner.login, false);
      }
      this.vod = v;
      UI.vodInfo(v); Vods.channel(v.owner?.login); About.channel(v.owner?.login);
      Chat.loadGlobal();
      if (v.owner?.id) Chat.channel(v.owner.id);
      const base = cdnPath(v.seekPreviewsURL);
      if (!base) return UI.msg(null, 'This video isn’t on the CDN', 'Twitch didn’t publish a playlist for it.');
      if (!nativeHls) { Tabs.show('vods'); return UI.needsSafari(`https://www.twitch.tv/videos/${v.id}`, true); }
      Replay.open(v.id);
      const srcs = await vodSources(base);
      if (gen !== this.gen) return revoke(srcs);
      this.feed = 'vod'; this.vodSrcs = srcs;
      if (ios) vodSources(base, ['audio_only']).then(a => {   // ready for when the app goes to the background
        if (gen === this.gen) this.vodAudio = a; else revoke(a);
      });
      stage.classList.add('vod'); $('watch').classList.add('vodw');
      vC.controls = true;
      vL.classList.add('off'); vC.classList.remove('off');
      const pos = store.get('pos.' + v.id, 0);
      if (pos > 15 && pos < v.lengthSeconds - 30) this.vodAt = pos;
      UI.spin(true);
      this.nextVodSource();
    } catch (e) {
      if (gen === this.gen) UI.msg(null, 'Couldn’t load the video', e.message, () => this.openVod(id));
    }
  },

  async playLive() {
    this.destroyHls();
    const gen = this.gen, run = this.liveRun, stale = () => gen !== this.gen || run !== this.liveRun;   // a newer start takes over
    this.stopCdn();
    this.noAd();   // the new session's ads, if any, are its own
    $('msgbox').hidden = true;
    this.feed = 'live'; UI.feed(); UI.spin(true);
    this.moved = this.began = Date.now();
    if (this.src === 'kick') return this.playKick(stale);
    let tok = await (this.tokenP || getToken(this.login).catch(e => e));
    this.tokenP = null;
    if (stale()) return;
    if (!tok || tok instanceof Error) return this.restart();   // a moment without the network shouldn't go straight to the CDN
    if (tok.authorization?.isForbidden) {   // sub-only, but your account may be in
      tok = await Me.streamToken(this.login);
      if (stale()) return;
      if (noToken(tok)) { this.subOnly = true; return this.fallback('Sub-only stream'); }
    }
    const Hls = await this.player(stale);
    if (!Hls) return;
    this.newHls(Hls).loadSource(usherUrl(this.login, tok));
    this.hls.attachMedia(vL);
    this.show('live');
    this.play(vL);
  },

  async player(stale) {   // hls.js, once it's loaded, or null having said why not
    let Hls;
    try { Hls = window.Hls || await hlsReady; } catch { hlsAgain(); if (!stale()) this.fallback('The player didn’t load'); return null; }
    if (stale()) return null;
    if (!Hls.isSupported()) { this.fallback('This browser can’t run the low-latency player'); return null; }
    return Hls;
  },
  newHls(Hls) {
    for (const k of shownSegs.keys()) if (k !== BG.hls?.url) shownSegs.delete(k);   // the last session's playlists won't be asked for again
    const hls = this.hls = new Hls({
      ...LOADING,
      pLoader: RelayLoader,
      progressive: true,              // play upcoming segments while Twitch is still sending them
      liveSyncDuration: 4,
      liveMaxLatencyDuration: 14,
      maxLiveSyncPlaybackRate: 1,     // the rate controller in tick() does catch-up instead
      liveDurationInfinity: true,
      maxBufferLength: 8, maxMaxBufferLength: 12, backBufferLength: 10,
      abrEwmaDefaultEstimate: 8e6,
      startFragPrefetch: true,
      preserveManualLevelOnError: true,   // a failed load on Source shouldn't quietly switch to Auto
      // the picture is called a looping one for a moment each time the screen's hold is renewed (Awake.renew), and a looping video that
      // goes up a quality as it loads has hls.js throw out all it had loaded before that segment, what's playing with it
      loopBackBufferFlush: false,
    });
    hls.on(Hls.Events.MANIFEST_PARSED, () => this.onManifest());
    hls.on(Hls.Events.ERROR, (_, d) => this.onError(d));
    return hls;
  },

  // The picture from Kick, for a channel on both (KICK): when it's live on Kick alone, or you've picked Kick. Kick's chat comes with it, and
  // Kick's title and count where Twitch has none. Everything else is the low-latency player as for Twitch: its speed, quality, the sound away.
  kickOn() {
    this.src = 'kick';
    UI.info(this.user);
    if (Chat.kick !== this.kick?.room) this.chat();   // opening, P.open has it up already
    this.playLive();
  },
  chat() { Chat.open(this.login, this.src === 'kick' ? this.kick?.room : null); if (this.user) Chat.channel(this.user.id); },   // where the picture's from, with the channel's emotes
  // Kick's address for a stream is good for about 10 minutes: an older one is asked for again.
  async playKick(stale) {
    let k = this.kick;
    if (!k?.url || Date.now() - k.at > 4 * 60e3) {
      k = await kickChannel(KICK[this.login]).catch(() => null);
      if (stale()) return;
      if (!k) return this.restart();
      this.kick = k;
    }
    if (!k.live || !k.url) return this.kickOff();
    const Hls = await this.player(stale);
    if (!Hls) return;
    this.newHls(Hls).loadSource(k.url);
    this.hls.attachMedia(vL);
    this.show('live');
    this.play(vL);
  },
  // Kick's stream is over, or won't play (why): Twitch's, if they're live there, or offline, looking for either.
  async kickOff(why) {
    const gen = this.gen, [u] = await getUsers([this.login]).catch(() => [null]);
    if (gen !== this.gen) return;
    if (u?.stream) {
      if (why) UI.toast(`${why} · on Twitch`);
      this.user = u; this.src = 'twitch';
      this.start = Date.parse(u.stream.createdAt) / 1000; this.base = await cdnBase(u);
      if (gen !== this.gen) return;
      BG.stop(true);   // the sound away was Kick's: Twitch's player brings its own once it's up (onManifest)
      UI.info(u); this.chat();
      return (this.pref === 'cdn' || this.relayGone) && cdnLive ? this.playCdn() : this.playLive();
    }
    if (why) return UI.msg(null, why, 'Kick’s stream wouldn’t play.', () => { $('msgbox').hidden = true; this.retries = 0; this.kick.at = 0; this.playLive(); });
    this.src = 'twitch';
    this.chat();   // an offline channel's chat is Twitch's, as for any other
    this.ended(u || this.user);
  },
  // Twitch or Kick, for a channel on both: picked in the settings sheet, and kept for next time.
  setSrc(s) {
    store.set('src.' + this.login, s);
    if (s === this.src || (s === 'kick' && !this.kick?.live) || (s === 'twitch' && !this.user?.stream)) return;
    BG.stop(true); BG.carry = false;
    this.retries = 0;
    if (s === 'kick') { this.stopCdn(); return this.kickOn(); }
    this.src = 'twitch';
    UI.info(this.user); this.chat();
    if (this.pref === 'cdn' && cdnLive) { this.destroyHls(); this.playCdn(); } else this.playLive();
  },
  // Twitch's stream is over: on Kick if they're still live there, offline otherwise.
  async kickOrEnd(u) {
    const gen = this.gen, k = KICK[this.login] ? await kickChannel(KICK[this.login]).catch(() => null) : null;
    if (gen !== this.gen) return;
    if (!k?.live) return this.ended(u);
    this.user = u; this.kick = k;
    BG.stop(true);
    this.stopCdn(); this.kickOn();
  },

  onManifest() {
    this.groups = this.hls.levels.map((l, i) => ({ i, id: l.attrs?.VIDEO || `${l.height}p`, h: l.height || 0, fps: Math.round(l.frameRate || 0), br: l.bitrate }));
    this.applyQuality();
    // started over while you were away listening; once hls.js is done with this manifest, or its own start undoes the handover
    if (BG.may()) queueMicrotask(() => BG.start());
  },

  ladder() { return this.groups.filter(x => x.h).sort((a, b) => b.br - a.br); },

  qualities() {
    return this.ladder().map(x => ({ id: x.id, label: x.id === 'chunked' ? `${x.h}p${x.fps > 30 ? x.fps : ''} · source` : x.id }));
  },

  // Where the picked quality sits on this stream's ladder. Channels differ in what they have, and one
  // this stream lacks means the next one down: someone saving data on 720p60 doesn't want 1080p.
  pickAt(list) {
    const at = list.findIndex(x => x.id === this.q);
    if (at >= 0 || !/^\d/.test(this.q)) return Math.max(0, at);
    const [h, fps = 60] = this.q.match(/\d+/g).map(Number), below = list.findIndex(x => x.h < h || (x.h === h && x.fps <= fps));
    return below >= 0 ? below : list.length - 1;
  },

  levelIndex() {   // the hls.js level for the picked quality, less any step down from buffering
    const list = this.ladder();
    if (!list.length) return this.groups[0].i;
    let at = Math.min(this.pickAt(list) + this.cap, list.length - 1);
    while (this.heavy && at < list.length - 1 && weight(list[at]) >= this.heavy.w) at++;   // nor one the device has shown it can't keep up with
    return list[at].i;
  },
  // Auto's ceiling on a device that couldn't keep up with something: the best of what's lighter (hls.js numbers them by bitrate, lowest first)
  autoTop() { return this.heavy ? Math.max(-1, ...this.groups.filter(x => x.h && weight(x) < this.heavy.w).map(x => x.i)) : -1; },

  applyQuality(gently) {   // gently: from the next segment on, keeping what's buffered
    const hls = this.hls;
    if (!hls || !this.groups.length) return;
    if (this.q === 'auto') { hls.autoLevelCapping = this.autoTop(); hls.currentLevel = -1; return; }
    const i = this.levelIndex();
    if (gently) hls.loadLevel = i;
    else if (hls.currentLevel !== i || hls.loadLevel !== i) hls.currentLevel = i;   // currentLevel is what's playing: there may be another on its way
  },

  setQuality(id) {
    this.q = id; this.cap = 0; this.rend = null; store.set('quality', id);
    this.heavy = null; this.choked = []; this.chokedAt = 0; this.fq = [];   // your pick is tried as picked
    this.quietUntil = Date.now() + 6000;   // the switch's own buffering isn't a bad connection
    if (this.liveUp()) this.applyQuality();
    if (this.feed === 'cdn') this.playCdn({ cover: this.cover, reload: true });
  },

  setPref(f) {
    this.pref = f; store.set('feed', f);
    if (!this.user?.stream || this.feed === 'vod') return;
    if (f === 'cdn' && this.liveUp()) { this.destroyHls(); this.noAd(); this.playCdn(); }
    else if (f === 'live' && this.feed === 'cdn' && !this.subOnly) this.playLive();
  },

  onError(d) {
    const Hls = window.Hls;
    this.noteErr(d);
    if (relayOut(d)) return this.fallback(RELAY_OUT);
    if (!d.fatal) {   // this one hls.js has dealt with itself, the same way as below, which leaves the video paused without a pause event
      if (d.details === Hls.ErrorDetails.MEDIA_SOURCE_REQUIRES_RESET && this.feed === 'live') this.play(vL);
      return;
    }
    if (d.type === Hls.ErrorTypes.MEDIA_ERROR && this.fixes++ < 2) {   // the recovery reloads the video, which leaves it paused
      this.began = Date.now(); recoverHls(this.hls, vL);
      if (this.feed === 'live') this.play(vL);
      return;
    }
    if (this.src === 'kick') {   // Kick's address gone stale, or the stream over: a fresh look at the channel says which
      if (this.kick) this.kick.at = 0;
      const gen = this.gen;
      if (d.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR && [403, 404].includes(d.response?.code)) return void this.checkEnded().then(ended => { if (!ended && gen === this.gen) this.restart(); });
      return this.restart();
    }
    if (d.response?.code === 403 && d.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR) {
      // a token past its 20 minutes gets the same 403 as a sub-only stream: a fresh one says which it was
      if (!this.asked403) { this.asked403 = true; this.tokenP = null; return this.restart(); }
      this.subOnly = true; return this.fallback('Sub-only stream');
    }
    if (d.response?.code === 404 && d.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR) {   // usher has no such stream: likely over
      const gen = this.gen;
      return void this.checkEnded().then(ended => { if (!ended && gen === this.gen) this.restart(); });
    }
    if (d.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT && this.retries) this.retries = 3;   // a fresh start got no answer either: the relay is hung, so on to the CDN
    this.restart();
  },

  // Start the low-latency feed over, giving up on it after a few tries in a row with nothing to show.
  restart() {
    const gen = this.gen;
    // With no network a try fails at once, and three of them gave up on the feed within seconds: on a computer for good, with a message
    // nothing took down when the network came back. They don't count, and cost the relay nothing.
    if (!navigator.onLine) this.retries = Math.min(this.retries, 2);
    if (this.retries++ < 3) {
      if (!this.cover) UI.spin(true);
      // while away the sound has its own player, and coming back starts this one over anyway
      setTimeout(() => { if (gen === this.gen && this.liveUp() && !BG.on) this.playLive(); }, 1500 * this.retries);
      return;
    }
    this.checkEnded().then(ended => { if (!ended && gen === this.gen) this.fallback(this.src === 'kick' ? 'Kick’s feed keeps failing' : 'The low-latency feed keeps failing'); });
  },

  // Live isn't possible (sub-only, relay down, old browser): the CDN feed still is. On Kick there's no such copy: Twitch's stream, or a message.
  fallback(why) {
    this.destroyHls();
    this.noAd();
    this.relayGone = why === RELAY_OUT;   // out for the day: nothing's coming back soon
    if (this.src === 'kick') return this.kickOff(why);
    if (cdnLive && this.base) {
      UI.toast(`${why} · playing from the CDN`);
      if (!this.subOnly && this.pref === 'live') this.retryLive();
      return this.playCdn();
    }
    UI.needsSafari(why);
  },

  // On the CDN feed only because low latency failed: look every few minutes for the relay to come back, and every few
  // seconds while away with the sound waiting on it. Away with no sound, nobody's waiting, and the relay's fetches are kept for you.
  // One wait at a time: each failed go at low latency would otherwise start another.
  retryLive() {
    const gen = this.gen;
    const off = () => gen !== this.gen || this.feed !== 'cdn' || this.pref !== 'live';   // overtaken: another channel, or the CDN's no longer standing in for low latency
    clearTimeout(this.retryT);
    this.retryT = setTimeout(async () => {
      if (off()) return;
      if (BG.on || (document.hidden && !BG.may()) || Pages.idle()) return this.retryLive();
      if (!window.Hls?.isSupported()) { hlsAgain(); return this.retryLive(); }   // nothing to go back to yet: the picture stays put
      const tok = await tokenFor(this.login);
      const master = !noToken(tok) ? await relayText(usherUrl(this.login, tok)) : null;
      if (off()) return;   // the CDN may have been picked meanwhile
      if (!master?.includes('#EXT-X-STREAM-INF')) return this.retryLive();
      this.retries = 0; this.tokenP = Promise.resolve(tok);
      this.playLive();
    }, BG.may() ? 15e3 : 180e3);
  },

  noAd() { this.cover = this.ad = false; this.adEnd = 0; UI.banner(); },
  uncover() { this.cover = false; this.stopCdn(); this.show('live'); },   // the cover off an ad break, back to the low-latency picture
  liveUp() { return this.feed === 'live' || this.cover; },   // the low-latency player is the one in use: on screen, or under an ad break's cover

  onAd(on, end) {
    if (on) {
      if (end) this.adEnd = end;
      if (this.ad) return;
      this.ad = true; this.skipped++;
      this.dodge();
      UI.banner();
    } else {
      this.dodged.clear();   // the next break starts its search afresh, also after one that ended with a new session arriving clean
      if (!this.ad) return;
      this.ad = false; this.adEnd = 0;
      if (this.cover) this.uncover();
      if (BG.on) this.hls?.stopLoad();   // away, on the CDN's sound: it all comes back with the picture
      else if (this.feed === 'live') {   // to the edge now, and again once the playlist that said so is in
        this.toLiveEdge(); this.play(vL);
        this.hls?.once(window.Hls.Events.LEVEL_UPDATED, () => this.toLiveEdge());
      }
      UI.banner();
    }
  },

  // An ad on this session. Another kind of session usually isn't getting it (your account's Turbo never is),

  // Safari can show the ad-free CDN feed through it, also while the looking takes a while; elsewhere the picture holds.
  async dodge() {
    if (this.dodging) return;
    this.dodging = true;
    const gen = this.gen, login = this.login, over = () => gen !== this.gen || !this.ad || BG.on;
    const cover = () => { if (gen === this.gen && this.ad && this.feed === 'live' && !BG.on && cdnLive && this.base) { this.cover = true; this.playCdn({ cover: true }); UI.banner(); } };
    const slow = setTimeout(cover, 5000);
    try {
      for (const kind of [...PLAYER_TYPES, 'account']) {
        if (kind === this.playerType || this.dodged.has(kind)) continue;
        this.dodged.add(kind);
        const tok = kind === 'account' ? await Me.streamToken(login) : await getToken(login, kind).catch(() => null);
        if (over()) return;
        if (noToken(tok)) continue;

  playCdn({ cover = false, reload = false } = {}) {

    if (!cover) this.tokenP = null;   // tokens last 20 minutes, and low latency may not be picked for hours
    const url = `${this.base}/${this.cdnRendition()}/index-dvr.m3u8`;
    if (reload || vC.dataset.url !== url) { vC.dataset.url = url; vC.src = url; this.seekPending = true; this.moved = Date.now(); }

  cdnRendition() {
