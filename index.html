// ── settings sheet ──────────────────────────────────
const Sheet = {
  fn: null,
  show(fn) {
    this.fn = fn;
    this.render();
    $('sheet').hidden = false;
    clearTimeout(hudTimer);
    clearInterval(this.timer);
    this.timer = setInterval(() => this.stats(), 1000);
  },
  open() { this.show(body => this.playback(body)); },
  account() { this.show(body => this.accountItems(body, true)); },
  close() { $('sheet').hidden = true; clearInterval(this.timer); SignIn.cancel(); if (!$('watch').hidden) hud(true); },
  render() {
    const body = $('sheetBody');
    body.textContent = '';
    this.fn(body);
  },
  group(body, title, items) {
    if (title) body.append(el('h3', null, title));
    const box = el('div', 'opts');
    for (const it of items) {
      const b = el('button', 'opt' + (it.on ? ' on' : '')); b.type = 'button'; b.disabled = !!it.disabled;
      const l = el('span', 'l', it.label);
      if (it.desc) l.append(el('span', 'd', it.desc));
      b.append(l); b.insertAdjacentHTML('beforeend', icon('check')); b.lastChild.classList.add('ck');
      b.onclick = () => { it.pick?.(); if (!$('sheet').hidden && this.fn) this.render(); };
      box.append(b);
    }
    body.append(box);
  },
  playback(body) {
    const live = P.user?.stream, past = P.feed === 'vod' || P.feed === 'clip';
    if (!past) this.group(body, 'Feed', [
      { label: 'Low latency', desc: `About ${TARGET.live} s behind. Ads are cut out${cdnLive ? '; during a break you watch the ad-free feed' : ''}.`,
        on: P.pref === 'live', disabled: P.subOnly, pick: () => P.setPref('live') },
      { label: 'Ad-free CDN', desc: `About ${TARGET.cdn} s behind. Never has ads and plays sub-only streams${cdnLive ? '' : ' (Safari only)'}.`,
        on: P.pref === 'cdn', disabled: !cdnLive, pick: () => P.setPref('cdn') },
    ]);
    const qs = P.qualities();
    if (live && !past) this.group(body, 'Quality', [
      { label: 'Source', desc: qs[0] ? qs[0].label.replace(' · source', '') : null, on: P.q === 'source', pick: () => P.setQuality('source') },
      ...qs.slice(1).map(x => ({ label: x.label, on: P.q === x.id, pick: () => P.setQuality(x.id) })),
      ...(P.hls ? [{ label: 'Auto', desc: 'Lets the player drop quality on a weak connection.', on: P.q === 'auto', pick: () => P.setQuality('auto') }] : []),
    ]);
    this.accountItems(body);
    body.append(el('div', 'stats'));
    this.stats();
  },
  accountItems(body, full) {
    const me = Me.acct;
    if (!me) return this.group(body, 'Account', [{ label: 'Sign in with Twitch', desc: 'Send chat, your real follow list, hide chatters you’ve blocked.', pick: () => SignIn.start() }]);
    const facts = [`${(Me.follows || FOLLOWS).length} follows`, `${Me.blocks.size} blocked`, `${Me.emotes.length} emotes`].join(' · ');
    this.group(body, 'Account', [{ label: `Sign out ${me.name || me.login}`, desc: facts, pick: () => Me.signOut() }]);
    const trouble = Object.entries(Me.notes).filter(([, v]) => v);
    if (trouble.length) { const s = el('div', 'stats'); for (const [k, v] of trouble) s.append(el('div', null, `${k}: ${v}`)); body.append(s); }
  },
  stats() {
    const s = $('sheetBody').querySelector('.stats:last-child');
    if (!s || !this.fn || !P.feed) return;
    const v = P.active(), l = P.latency(), lines = [];
    const lvl = P.hls?.levels?.[P.hls.currentLevel];
    lines.push(`Playing: ${P.cover ? 'ad-free feed (ad break)' : { live: 'low-latency feed', cdn: 'CDN feed', vod: 'past broadcast', clip: 'clip' }[P.feed]}`);
    if (l != null) lines.push(`Behind live: ${l.toFixed(1)} s${P.feed === 'live' ? ` (aiming for ${P.liveT} s)` : ''}`);
    if (v && v.videoHeight) lines.push(`Picture: ${v.videoWidth}×${v.videoHeight}${lvl ? ` · ${(lvl.bitrate / 1e6).toFixed(1)} Mbps · ${lvl.details?.fragments?.[0]?.initSegment ? 'fMP4' : 'TS'}` : ''}${v.playbackRate !== 1 ? ` · speed ${v.playbackRate}×` : ''}`);
    if (P.cap) lines.push(`Held ${P.cap} step${P.cap > 1 ? 's' : ''} below your pick after buffering`);
    if (v) lines.push(`Buffered: ${bufAhead(v).toFixed(1)} s`);
    if (P.skipped) lines.push(`Ad breaks skipped: ${P.skipped}`);
    if (Quota.n) lines.push(`Relay today: ${Quota.n.toLocaleString()} of 20,000`);
    const errs = Object.entries(P.errs).sort((a, b) => b[1] - a[1]).slice(0, 4);
    if (errs.length) lines.push(`Hiccups: ${errs.map(([k, n]) => n > 1 ? `${k} ×${n}` : k).join(', ')}`);
    s.textContent = '';
    for (const x of lines) s.append(el('div', null, x));
  },
};
$('scrim').onclick = () => Sheet.close();

// ── home ────────────────────────────────────────────
const Recent = {
  list() { return store.get('recent', []); },
  add(u) {
    if (Home.roster().includes(u.login)) return;
    store.set('recent', [{ l: u.login, n: u.displayName, p: u.profileImageURL }, ...this.list().filter(x => x.l !== u.login)].slice(0, 12));
  },
  remove(l) { store.set('recent', this.list().filter(x => x.l !== l)); Home.renderRecent(); },
};

// A channel's thumbnail, keeping the last one on screen until its replacement has loaded so the list never blinks.
const thumbs = new Map();
function thumb(login, url) {
  const img = pic(thumbs.get(login) || url);
  if (url && thumbs.get(login) !== url) { const n = new Image(); n.onload = () => { thumbs.set(login, url); img.src = url; }; n.src = url; }
  return img;
}
function streamRow(x) {
  const a = el('a', 'row');
  a.href = `?c=${x.login}`;
  const th = el('div', 'thumb');
  th.append(thumb(x.login, x.thumb), el('span', 'tag', !x.type || x.type === 'live' ? 'LIVE' : String(x.type).toUpperCase()), el('span', 'vc', count(x.viewers)));
  if (x.since) th.append(el('span', 'vc r', uptime(x.since)));
  const meta = el('div', 'meta'), who = el('div', 'who');
  who.append(pic(x.avatar, 'av'), el('span', 'nm', x.name));
  meta.append(who, el('div', 'tt', x.title || ''), el('div', 'gm', x.game || ''));
  a.append(th, meta);
  return a;
}

const Home = {
  users: [], live: new Set(), at: 0, busy: false, view: store.get('homeView', 'follow'), y: { follow: 0, browse: 0 },
  roster() { return Me.follows || FOLLOWS; },
  find(login) { return this.users.find(u => u.login === login) || null; },
  setView(view) {
    if (view !== this.view) { this.y[this.view] = scrollY; this.view = view; store.set('homeView', view); }
    document.querySelectorAll('.seg [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === view));
    $('vFollow').hidden = view !== 'follow';
    $('vBrowse').hidden = view !== 'browse';
    if (view === 'browse') Browse.load();
    scrollTo(0, this.y[view]);
  },
  async load(force) {
    this.renderRecent();
    if (Me.acct) Me.sync();
    if (this.view === 'browse') Browse.load(force);
    if (this.busy || (!force && Date.now() - this.at < 45e3)) return;
    this.busy = true;
    $('refresh').classList.add('busy');
    if (!this.at) this.skeleton();
    try {
      const roster = this.roster(), recent = Recent.list().map(r => r.l);
      const all = (await getUsers([...new Set([...roster, ...recent])])).filter(Boolean);
      const mine = new Set(roster);
      this.users = all.filter(u => mine.has(u.login));
      this.live = new Set(all.filter(u => u.stream).map(u => u.login));
      this.at = Date.now();
      this.render();
      this.renderRecent();
    } catch (e) {
      if (!this.at) {
        const box = $('live'); box.textContent = '';
        const p = el('p', 'note', `Couldn’t reach Twitch (${e.message}). `), b = el('button', null, 'Retry');
        b.type = 'button'; b.onclick = () => this.load(true); p.append(b); box.append(p);
      }
    } finally {
      this.busy = false;
      $('refresh').classList.remove('busy');
    }
  },
  skeleton() {
    const box = $('live'); box.textContent = '';
    for (let i = 0; i < 3; i++) {
      const r = el('div', 'row'), m = el('div', 'meta');
      r.append(el('div', 'thumb sk'));
      m.append(el('div', 'sk sk-line'), el('div', 'sk sk-line')); m.lastChild.style.width = '60%';
      r.append(m); box.append(r);
    }
  },
  render() {
    const live = this.users.filter(u => u.stream).sort((a, b) => b.stream.viewersCount - a.stream.viewersCount);
    const last = u => Date.parse(u.lastBroadcast?.startedAt || 0) || 0;
    const off = this.users.filter(u => !u.stream).sort((a, b) => last(b) - last(a));
    const box = $('live'), bust = Math.floor(Date.now() / 60e3);
    box.textContent = '';
    $('liveN').textContent = live.length || '';
    if (!live.length) box.append(el('p', 'note', 'Nobody you follow is live right now.'));
    for (const u of live) {
      const s = u.stream;
      box.append(streamRow({ login: u.login, name: u.displayName, avatar: u.profileImageURL, title: u.broadcastSettings?.title, game: s.game?.displayName,
        viewers: s.viewersCount, since: s.createdAt, thumb: s.previewImageURL ? `${s.previewImageURL}?t=${bust}` : '', type: s.type }));
    }
    const offBox = $('off'); offBox.textContent = '';
    $('secOff').hidden = !off.length;
    for (const u of off) {
      const a = el('a'); a.href = `?c=${u.login}`;
      a.append(pic(u.profileImageURL), el('span', null, u.displayName));
      if (last(u)) a.append(el('small', null, ago(u.lastBroadcast.startedAt)));
      offBox.append(a);
    }
  },
  renderRecent() {
    const roster = this.roster(), list = Recent.list().filter(r => !roster.includes(r.l)), box = $('recent');
    $('secRecent').hidden = !list.length;
    box.textContent = '';
    for (const r of list) {
      const c = el('span', 'chip' + (this.live.has(r.l) ? ' on' : '')), a = el('a'), x = el('button', 'x');
      a.href = `?c=${r.l}`; a.append(pic(r.p), el('span', null, r.n || r.l));
      x.type = 'button'; x.setAttribute('aria-label', `Remove ${r.n || r.l}`); x.innerHTML = icon('x');
      x.onclick = () => Recent.remove(r.l);
      c.append(a, x); box.append(c);
    }
  },
};

// Browse: what's on across Twitch, by category. The language chip is a Twitch tag; most browsing is in one language.
const STREAM = 'viewersCount type createdAt title previewImageURL(width: 440, height: 248) game { displayName } broadcaster { login displayName profileImageURL(width: 150) }';
const Browse = {
  game: null, cursor: null, end: false, busy: false, at: 0, key: null, gameInfo: null, run: 0,
  lang() { return store.get('lang', 'English'); },
  async load(force) {
    const key = `${this.game || ''}|${this.lang()}`, deep = $('brList').children.length > 30;
    // A list you've scrolled down stays as it is for a good while: reloading keeps only its first page.
    if (!force && key === this.key && Date.now() - this.at < (deep ? 9e5 : 60e3)) return;
    this.run++; this.key = key; this.at = Date.now(); this.cursor = null; this.end = false; this.busy = false;
    $('brHead').hidden = !this.game; $('secCats').hidden = !!this.game;
    $('brLang').textContent = this.lang() === 'all' ? 'All languages' : this.lang();
    if (!this.game) this.cats();
    else { $('brTitle').textContent = this.game; $('brSub').textContent = ''; }
    $('brH').firstChild.textContent = this.game ? 'Live channels' : 'Live now ';
    await this.page(true);
    if (deep && !$('vBrowse').hidden) scrollTo(0, 0);
  },
  async cats() {
    if ($('cats').children.length && Date.now() - this.catAt < 3e5) return;
    this.catAt = Date.now();
    try {
      const d = await gql('query { games(first: 30) { edges { node { name displayName viewersCount boxArtURL(width: 192, height: 256) } } } }');
      const box = $('cats');
      box.textContent = '';
      for (const { node: g } of d.games?.edges || []) {
        const a = el('a', 'cat'); a.href = `?g=${encodeURIComponent(g.name)}`;
        a.append(pic(g.boxArtURL), el('div', 'nm', g.displayName), el('div', 'gm', count(g.viewersCount)));
        box.append(a);
      }
    } catch {}
  },
  async page(first) {
    if (this.busy || this.end) return;
    this.busy = true;
    const run = this.run, box = $('brList'), lang = this.lang();
    const after = this.cursor ? `, after: ${JSON.stringify(this.cursor)}` : '';
    const opts = `{ sort: VIEWER_COUNT${lang === 'all' ? '' : `, freeformTags: [${JSON.stringify(lang)}]`} }`;
    const field = `streams(first: 30${after}, options: ${opts}) { edges { cursor node { ${STREAM} } } pageInfo { hasNextPage } }`;
    try {
      const d = this.game ? await gql(`query($g: String!) { game(name: $g) { displayName viewersCount ${field} } }`, { g: this.game }, TV_CID) : await gql(`query { ${field} }`, null, TV_CID);
      if (run !== this.run) return;
      this.at = Date.now();
      const res = this.game ? d.game?.streams : d.streams;
      if (this.game && d.game) { $('brTitle').textContent = d.game.displayName; $('brSub').textContent = `${count(d.game.viewersCount)} watching`; }
      const edges = res?.edges || [];
      if (first) box.textContent = '';
      for (const { node: s } of edges) box.append(streamRow({ login: s.broadcaster?.login, name: s.broadcaster?.displayName, avatar: s.broadcaster?.profileImageURL, title: s.title,
        game: s.game?.displayName, viewers: s.viewersCount, since: s.createdAt, thumb: s.previewImageURL, type: s.type }));
      this.cursor = edges[edges.length - 1]?.cursor || null;
      this.end = !res?.pageInfo?.hasNextPage || !this.cursor;
      if (first && !edges.length) box.append(el('p', 'note', 'Nothing live here in this language.'));
    } catch (e) {
      if (run === this.run && first) { box.textContent = ''; box.append(el('p', 'note', `Couldn’t reach Twitch (${e.message}).`)); }
    } finally { if (run === this.run) this.busy = false; }
  },
};
new IntersectionObserver(es => { if (es[0].isIntersecting && !$('vBrowse').hidden) Browse.page(); }, { rootMargin: '600px' }).observe($('brEnd'));
$('brLang').onclick = () => { store.set('lang', Browse.lang() === 'all' ? 'English' : 'all'); Browse.load(true); };

// Search as you type: your follows at once, everyone else as Twitch answers.
const Search = {
  n: 0, timer: 0, at: -1,
  ITEM: 'login displayName profileImageURL(width: 50) stream { viewersCount game { displayName } }',
  hide() { this.n++; clearTimeout(this.timer); $('sgl').hidden = true; $('sgl').textContent = ''; this.at = -1; },
  input() {
    const term = $('q').value.trim();
    clearTimeout(this.timer);
    if (term.length < 2 || /[/.]/.test(term)) return this.hide();
    const low = term.toLowerCase();
    this.draw(term, Home.users.filter(u => u.login.includes(low) || u.displayName?.toLowerCase().includes(low)).slice(0, 6), []);
    this.timer = setTimeout(() => this.run(term), 150);
  },
  async run(term) {
    const n = ++this.n;
    try {
      const d = await gql(`query($q: String!) { searchFor(userQuery: $q, platform: "web") { users { edges { item { ... on User { ${this.ITEM} } } } } channels { edges { item { ... on User { ${this.ITEM} } } } } games { edges { item { ... on Game { name displayName viewersCount boxArtURL(width: 54, height: 72) } } } } } }`, { q: term });
      if (n !== this.n) return;
      const low = term.toLowerCase(), r = d.searchFor, mine = Home.users.filter(u => u.login.includes(low) || u.displayName?.toLowerCase().includes(low));
      const found = new Map();
      for (const u of [...mine, ...(r?.users?.edges || []).map(e => e.item), ...(r?.channels?.edges || []).map(e => e.item)]) if (u?.login && !found.has(u.login)) found.set(u.login, u);
      const rank = u => (u.login === low ? 3e9 : 0) + (mine.includes(u) ? 2e9 : 0) + (u.stream ? 1e9 + u.stream.viewersCount : 0);
      this.draw(term, [...found.values()].sort((a, b) => rank(b) - rank(a)).slice(0, 8), (r?.games?.edges || []).map(e => e.item).filter(Boolean).slice(0, 3));
    } catch {}
  },
  draw(term, users, games) {
    const box = $('sgl');
    box.textContent = '';
    this.at = -1;
    for (const u of users) {
      const a = el('a', 'sg'); a.href = `?c=${u.login}`;
      const meta = el('div', 'meta');
      meta.append(el('div', 'nm', u.displayName || u.login));
      if (u.stream) { const g = el('div', 'gm'); g.append(el('i', 'dot'), [count(u.stream.viewersCount), u.stream.game?.displayName].filter(Boolean).join(' · ')); meta.append(g); }
      a.append(pic(u.profileImageURL), meta);
      box.append(a);
    }
    for (const g of games) {
      const a = el('a', 'sg'); a.href = `?g=${encodeURIComponent(g.name)}`;
      const meta = el('div', 'meta');
      meta.append(el('div', 'nm', g.displayName), el('div', 'gm', `Category${g.viewersCount ? ' · ' + count(g.viewersCount) + ' watching' : ''}`));
      const art = pic(g.boxArtURL, 'art');
      a.append(art, meta);
      box.append(a);
    }
    box.hidden = !box.children.length;
  },
  move(by) {
    const items = $('sgl').children;
    if (!items.length) return;
    this.at = (this.at + by + items.length) % items.length;
    [...items].forEach((n, i) => n.classList.toggle('on', i === this.at));
    items[this.at].scrollIntoView({ block: 'nearest' });
  },
  submit() {
    const raw = $('q').value.trim(), picked = $('sgl').children[this.at] || null;
    const video = raw.match(/twitch\.tv\/(?:\w+\/)?videos?\/(\d+)/), clip = raw.match(/(?:clips\.twitch\.tv\/|twitch\.tv\/\w+\/clip\/)([\w-]+)/);
    let url = picked?.getAttribute('href');
    if (!url && video) url = `?v=${video[1]}`;
    if (!url && clip) url = `?clip=${clip[1]}`;
    if (!url && validLogin(norm(raw))) url = `?c=${norm(raw)}`;
    if (!url) url = $('sgl').firstElementChild?.getAttribute('href');
    if (!url) { $('q').focus(); return; }
    $('q').value = ''; $('q').blur();
    this.hide();
    go(url, true);
  },
};
$('q').addEventListener('input', () => Search.input());
$('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); Search.move(e.key === 'ArrowDown' ? 1 : -1); }
  else if (e.key === 'Escape') Search.hide();
  else if (e.key === 'Enter') { e.preventDefault(); Search.submit(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.searchw')) Search.hide(); });
document.querySelector('.seg').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) { if (Browse.game) { Browse.game = null; history.replaceState(null, '', location.pathname); } Home.setView(b.dataset.view); } });
$('brBack').onclick = () => back();
$('acct').onclick = () => Sheet.account();

document.querySelector('#home').addEventListener('click', e => {
  const a = e.target.closest('a[href^="?"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  $('q').value = ''; Search.hide();
  go(a.getAttribute('href'), true);
});
$('refresh').onclick = () => { if (Me.acct) Me.loadFollows(); Home.load(true); };
$('brand').onclick = e => { e.preventDefault(); scrollTo(0, 0); Home.load(true); };
setInterval(() => { if (!document.hidden && !$('home').hidden) Home.load(); }, 60e3);
$('search').addEventListener('submit', e => { e.preventDefault(); Search.submit(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('home').hidden) Home.load(); });

// The Home Screen app can sit suspended for days, still running the version it started with. Coming back
// to it checks for a newer page, which loads the next time you're on the home screen with nothing open.
const Update = {
  tag: null, at: 0, ready: false,
  async check() {
    if (Date.now() - this.at < 18e5) return;
    this.at = Date.now();
    try {
      const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-cache' });
      const tag = r.headers.get('etag') || r.headers.get('last-modified');
      if (!r.ok || !tag) return;
      if (this.tag && tag !== this.tag) this.ready = true;
      this.tag ||= tag;
      this.apply();
    } catch {}
  },
  apply() { if (this.ready && !$('home').hidden && $('sheet').hidden && !$('q').value) location.reload(); },
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) Update.check(); });

// ── routing ─────────────────────────────────────────
let depth = 0;
history.scrollRestoration = 'manual';
function route(gesture) {
  const q = new URLSearchParams(location.search);
  const c = norm(q.get('c') || q.get('channel') || ''), v = q.get('v'), clip = q.get('clip'), g = q.get('g');
  if (Sheet && !$('sheet').hidden) Sheet.close();
  if (validLogin(c)) P.open(c, gesture, Home.find(c));
  else if (/^\d+$/.test(v || '')) P.openVod(v, gesture);
  else if (clip) P.openClip(clip, gesture);
  else {
    P.close();
    $('watch').hidden = true; $('home').hidden = false;
    document.title = 'Wraith';
    Browse.game = g || null;
    Home.setView(g ? 'browse' : Home.view);
    Home.load();
    Update.apply();
  }
}
function go(url, gesture) {
  if (!$('home').hidden) Home.y[Home.view] = scrollY;
  history.pushState(null, '', url); depth++; route(gesture);
  if (url.startsWith('?g=')) scrollTo(0, 0);
}
function back() {
  if (depth > 0) history.back();
  else { history.replaceState(null, '', location.pathname); route(false); }
}
window.addEventListener('popstate', () => { depth = Math.max(0, depth - 1); route(false); });

Sound.setLevel(Sound.level);
Sound.set(Sound.muted);
Update.check();
Me.save(Me.acct);
Me.check();
Me.sync();
setInterval(() => { if (Me.acct && !document.hidden && Date.now() - (Me.at.check || 0) > 3600e3) Me.check(); }, 60e3);
window.wraith = { P, Chat, Home, BG, Talk, Me, Replay, Browse, Search, SignIn, Clips, UI, Card };   // for poking at playback from devtools
route(false);
})();
</script>
